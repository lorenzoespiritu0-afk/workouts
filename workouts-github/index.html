<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workouts</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workouts">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<script>window.STANDALONE=true;</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#000000;--surface:#141416;--ink:#F5F5F7;--muted:#8E8E93;--line:#26272B;--chip:#1E1F23;
  --run:#4F8DFF;--walk:#A58BFF;--ride:#2FC48D;--lift:#4CC4E0;--climb:#FF5C8A;--hike:#C99A5B;--core:#FF7A59;--hang:#FF8A4C;--other:#8E8E93;
  --gold:#F4B63F;--silver:#C0C6CF;--bronze:#C8834B;--xp:#F4B63F;--accent:#CDF54A;--on-accent:#0B0F00;--red:#FF453A;--accent2:#5AC8FA;
  --num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:inherit}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--run);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:24px 18px calc(110px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-family:var(--num);font-weight:800;font-size:3.1rem;line-height:.95;margin:0;letter-spacing:-.01em}
.topr{display:flex;gap:12px;align-items:center}
.link{color:var(--muted);font-size:.92rem;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.lvpill{white-space:nowrap;background:var(--xp);color:#fff;font-family:var(--num);font-weight:700;font-size:1.05rem;padding:5px 12px;border-radius:999px}
.unit{font-size:.55em;font-weight:600;margin-left:3px;opacity:.75}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:999px;background:var(--chip);font-weight:600;font-size:.9rem;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface)}

.month{font-family:var(--num);font-weight:700;font-size:1.25rem;color:var(--muted);margin:22px 0 8px}
.card{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:14px;padding:14px 16px 14px 18px;margin-bottom:10px;position:relative;overflow:hidden}
.card.has-route{grid-template-columns:minmax(0,1fr) 78px}
.card .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .title{font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .date{color:var(--muted);font-size:.85rem;white-space:nowrap}
.card .nums{display:flex;gap:20px;margin-top:8px;flex-wrap:wrap}
.card .thumb{align-self:center;color:var(--c)}
.card.has-route .nums{gap:14px}
.card.has-route .n b{font-size:1.3rem}
.card .thumb svg{display:block;width:78px;height:62px}
.aw{display:flex;gap:12px;margin-top:9px;font-size:.85rem;color:var(--muted);align-items:center;flex-wrap:wrap}
.aw .xp{color:var(--xp);font-weight:700}
.n b{display:block;font-family:var(--num);font-weight:700;font-size:1.55rem;line-height:1;white-space:nowrap}
.n span{font-size:.75rem;color:var(--muted)}
.empty{background:var(--surface);border-radius:14px;padding:22px;color:var(--muted);line-height:1.5}
.empty strong{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:4px}

.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-weight:600;font-size:.88rem}
.seg button[aria-pressed=true]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 26px}
.tot{background:var(--surface);border-radius:14px;padding:14px 16px}
.tot b{display:block;font-family:var(--num);font-weight:800;font-size:clamp(1.6rem,7.5vw,2.1rem);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot span{color:var(--muted);font-size:.82rem}
h2.sec{font-family:var(--num);font-weight:700;font-size:1.6rem;margin:28px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.recs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rec{background:var(--surface);border-radius:14px;padding:14px 16px;text-align:left;width:100%}
.rec.wide{grid-column:1/-1}
.rec .l{font-size:.82rem;color:var(--muted)}
.rec .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--num);font-weight:800;font-size:clamp(1.6rem,7.5vw,2.5rem);line-height:1.02;margin:4px 0 2px;color:var(--c)}
.rec .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec.none .v{color:var(--line)}
.lifts{background:var(--surface);border-radius:14px;padding:6px 16px;margin-top:10px}
.liftrow{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;width:100%;text-align:left}
.liftrow:last-child{border-bottom:0}
.liftrow b{font-family:var(--num);font-size:1.4rem;font-weight:700;white-space:nowrap}
.liftrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.liftrow small{font-weight:500;font-size:.95rem;color:var(--muted)}
.chart{background:var(--surface);border-radius:14px;padding:14px 12px 8px;margin-top:10px}
.chart svg{display:block;width:100%;height:auto}

/* level & trophies */
.level{background:var(--surface);border-radius:18px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.lvnum{width:96px;height:96px;border-radius:50%;background:var(--xp);color:#fff;display:grid;place-items:center;text-align:center;line-height:.9}
.lvnum b{font-family:var(--num);font-weight:800;font-size:3rem;display:block}
.lvnum span{font-size:.7rem;font-weight:600;opacity:.85}
.rank{font-family:var(--num);font-weight:800;font-size:2rem;line-height:1}
.xpbar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin:10px 0 6px}
.xpbar span{display:block;height:100%;background:var(--xp);border-radius:5px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.xpinfo{font-size:.85rem;color:var(--muted)}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.medal{background:var(--surface);border-radius:14px;padding:12px;text-align:center}
.medal b{font-family:var(--num);font-weight:800;font-size:2rem;display:block;line-height:1;margin-top:4px}
.medal span{font-size:.78rem;color:var(--muted)}
.mdot{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-family:var(--num);font-weight:800;font-size:1rem;flex:none}
.m1{background:var(--gold)}.m2{background:var(--silver)}.m3{background:var(--bronze)}
.tlist{background:var(--surface);border-radius:14px;padding:4px 14px;margin-top:10px}
.trow{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.trow:last-child{border-bottom:0}
.trow .tx{flex:1;min-width:0}
.trow .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tx span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tv{font-family:var(--num);font-weight:700;font-size:1.25rem;white-space:nowrap}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.badge{background:var(--surface);border-radius:14px;padding:14px 8px 12px;text-align:center;width:100%}
.badge .ic{width:58px;height:58px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:linear-gradient(145deg,#FFD66B,#E2A400);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.badge b{display:block;font-size:.85rem;font-weight:700;line-height:1.2}
.badge span{display:block;font-size:.72rem;color:var(--muted);margin-top:3px}
.badge.locked .ic{background:var(--chip);filter:grayscale(1);opacity:.55;box-shadow:none}
.badge.locked b{color:var(--muted)}
.mini{height:4px;border-radius:2px;background:var(--chip);margin:6px 10px 0;overflow:hidden}
.mini i{display:block;height:100%;background:var(--muted)}

/* routes & segments */
.route{background:var(--bg);border-radius:14px;margin:4px 0 14px;color:var(--c);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px}
.route svg{display:block;width:100%;height:auto}
.segcard{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:10px;width:100%;text-align:left}
.segcard .thumb{color:var(--c)}
.segcard .thumb svg{display:block;width:90px;height:64px}
.segcard b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segcard span{font-size:.82rem;color:var(--muted)}
.segcard .best{font-family:var(--num);font-weight:800;font-size:1.6rem;text-align:right;line-height:1}
.segcard .best small{display:block;font-family:var(--font);font-weight:500;font-size:.72rem;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--c);padding:0;border:0;background:none}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr 1fr;align-items:center;padding:6px 4px}
nav .tab{padding:10px 0;font-weight:600;font-size:.8rem;color:var(--muted);white-space:nowrap}
nav .tab[aria-current=page]{color:var(--ink)}
nav .plus{background:var(--ink);color:var(--surface);font-weight:700;width:50px;height:50px;border-radius:50%;font-size:1.7rem;line-height:1;margin:0 4px}

.scrim{position:fixed;inset:0;background:rgba(8,10,16,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:94%;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom,0px));animation:up .22s ease;}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.sheet,.celeb .big{animation:none!important}.xpbar span{transition:none}}
.sheet h3{font-family:var(--num);font-weight:800;font-size:2rem;margin:0 0 4px;line-height:1}
.sheet h4{font-family:var(--num);font-weight:700;font-size:1.3rem;margin:20px 0 6px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 16px}
label{display:block;font-size:.84rem;color:var(--muted);margin:14px 0 6px;font-weight:500}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid3 label,.grid2 label{margin-top:0}
.typepick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.typepick button{padding:10px 4px;border-radius:10px;background:var(--chip);font-weight:600;font-size:.86rem}
.typepick button[aria-pressed=true]{background:var(--c);color:#fff}
.gpx{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:12px;padding:12px;margin-bottom:6px}
.gpx .btn{flex:none;padding:11px 14px}
.gpx p{margin:0;font-size:.84rem;color:var(--muted);line-height:1.35}
.ex{background:var(--bg);border-radius:12px;padding:10px;margin-bottom:8px}
.ex .r{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-top:8px;align-items:end}
.ex input{background:var(--surface)}
.ex small{display:block;font-size:.72rem;color:var(--muted);margin-bottom:3px}
.x{width:40px;height:44px;border-radius:10px;color:var(--muted);font-size:1.2rem}
.addex{width:100%;padding:12px;border-radius:10px;border:2px dashed var(--line);color:var(--muted);font-weight:600}
details{margin-top:14px;background:var(--bg);border-radius:12px;padding:12px}
summary{cursor:pointer;font-weight:600;font-size:.92rem}
details .grid3{margin-top:10px}
details input{background:var(--surface)}
.hint{font-size:.8rem;color:var(--muted);margin:6px 0 0;line-height:1.45}
.err{color:#D13B4F;font-size:.88rem;margin-top:10px;min-height:1em}
.row{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:14px;border-radius:12px;font-weight:700;background:var(--chip)}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn.danger{color:#D13B4F}
.dstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;margin:6px 0 16px}
.dstats .n b{font-size:clamp(1.3rem,6.4vw,1.9rem);overflow:hidden;text-overflow:ellipsis}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:.8rem}
.notes{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;margin-top:14px;font-size:.95rem}
.xpchip{display:inline-block;background:var(--xp);color:#fff;font-weight:700;font-size:.85rem;padding:4px 10px;border-radius:999px}

.celeb{text-align:center}
.celeb .big{white-space:nowrap;font-family:var(--num);font-weight:800;font-size:clamp(3.2rem,17vw,5rem);line-height:1;color:var(--xp);animation:pop .6s ease both;margin:8px 0 2px}
.celeb .lvup{display:inline-block;margin-top:12px;background:var(--xp);color:#fff;font-weight:700;padding:8px 16px;border-radius:999px;animation:pop .6s .4s ease both}
.celeb .tlist,.celeb .badges{text-align:left}

.preview{border-radius:14px;padding:18px;display:grid;place-items:center;min-height:200px;
  background-color:#3b4250;background-image:linear-gradient(45deg,rgba(255,255,255,.06) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.06) 75%),linear-gradient(45deg,rgba(255,255,255,.06) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.06) 75%);background-size:24px 24px;background-position:0 0,12px 12px}
.preview.light{background-color:#e8eaee;background-image:linear-gradient(45deg,rgba(0,0,0,.05) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.05) 75%),linear-gradient(45deg,rgba(0,0,0,.05) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.05) 75%)}
.preview img{max-width:100%;max-height:52vh;display:block;-webkit-touch-callout:default}
.opts{display:grid;gap:10px;margin:14px 0 0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* v3 additions */
body.viewer nav{display:none}
body.viewer .wrap{padding-bottom:40px}
.banner{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:.88rem;color:var(--muted);margin-bottom:14px;line-height:1.45}
.ins{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px}
.ins h3{font-family:var(--num);font-weight:800;font-size:1.5rem;margin:0 0 4px}
.ins .bigv{font-family:var(--num);font-weight:800;font-size:3.2rem;line-height:1}
.ins .row2{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.gauge{position:relative;height:12px;border-radius:6px;margin:14px 0 6px;background:linear-gradient(90deg,#9AA3B0 0 40%,#0E9F6E 40% 65%,#E2A400 65% 75%,#D13B4F 75% 100%)}
.gauge i{position:absolute;top:-5px;width:4px;height:22px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.gscale{display:grid;grid-template-columns:40% 25% 10% 25%;font-size:.72rem;color:var(--muted)}
.gscale span:nth-child(3){white-space:nowrap}
.rec-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec-item:last-child{border-bottom:0}
.rec-item .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;flex:none;background:var(--chip)}
.rec-item b{display:block;margin-bottom:2px}
.rec-item span{font-size:.88rem;color:var(--muted);line-height:1.45}
.fb{background:var(--bg);border-radius:12px;padding:4px 14px;margin-top:8px}
.fb p{margin:0;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem;line-height:1.45}
.fb p:last-child{border-bottom:0}
.spark{display:block;width:100%;height:60px;color:var(--xp)}
.prob{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:10px}
.prob .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.prob .ph b{font-family:var(--num);font-size:1.3rem}
.gchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.gchips::-webkit-scrollbar{display:none}
.gchip{flex:none;min-width:42px;padding:8px 10px;border-radius:9px;background:var(--surface);font-weight:700;font-size:.85rem}
.gchip[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.cdot{flex:none;width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.cdot[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{padding:7px 11px;border-radius:999px;background:var(--surface);font-size:.82rem;font-weight:600}
.tchip[aria-pressed=true]{background:var(--c);color:#fff}
.plabel{font-size:.74rem;color:var(--muted);margin:10px 0 5px;font-weight:600}
.pyr{display:grid;gap:5px}
.pyr div{display:grid;grid-template-columns:92px 1fr 30px;gap:8px;align-items:center;font-size:.85rem}
.pyr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pyr i{display:block;height:16px;border-radius:4px;background:var(--climb)}
.pyr em{font-style:normal;color:var(--muted);text-align:right}
.rpe{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:4px}
.rpev{font-family:var(--num);font-weight:800;font-size:1.4rem;color:var(--ink)}
.swrow{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;background:var(--sw);box-shadow:0 0 0 1px var(--line)}
.sw-same{background:var(--chip);color:var(--ink);font-weight:700;font-size:1rem}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.circ{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.circ input[type=color]{width:44px;height:40px;padding:2px;flex:none}
.headbtns{display:flex;gap:8px}
.headbtns .chip{font-size:.85rem}

/* ================= v2 design pass: motion, touch, materials ================= */
:root{--ease-out:cubic-bezier(.16,1,.3,1);--ease-in:cubic-bezier(.55,0,.75,.2);--press:cubic-bezier(.2,.8,.2,1)}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none;caret-color:var(--accent)}
button,summary,.tchip,.chip,label{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.gl input,.gl select{font-size:16px}
/* press feedback lands on touch-down */
.btn,.chip,.tchip,.gchip,.cdot,.seg button,.typepick button,.card,.plc,button.trow,button.ins,.rec,.addex,.sw,.x,.stepper button,.tbtns button,.liftrow,nav .plus{transition:transform .18s var(--press),background-color .18s,opacity .18s,box-shadow .18s}
.btn:active,.chip:active,.tchip:active,.gchip:active,.seg button:active,.typepick button:active,.addex:active,.x:active,.sw:active{transform:scale(.95)}
.cdot:active{transform:scale(.88)}
.card:active,.plc:active,button.trow:active,button.ins:active,.rec:active,.liftrow:active{transform:scale(.982)}
nav .plus:active{transform:scale(.9)}
/* sheet: slides up from the bottom, leaves the same way, can be dragged down */
/* sheet motion uses keyframes that leave no transform behind, so iOS keeps scrolling and painting the sheet normally */
.scrim{display:none!important;background:rgba(0,0,0,.62)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.scrim.open,.scrim.closing{display:flex!important}
.scrim.open{animation:scrimIn .3s ease}
.scrim.closing{animation:scrimOut .26s ease forwards;pointer-events:none}
.sheet{animation:none;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#3A3A3F transparent;box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.scrim.open .sheet{animation:sheetIn .48s var(--ease-out)}
.scrim.closing .sheet{animation:sheetOut .26s var(--ease-in) forwards}
@keyframes scrimIn{from{background-color:rgba(0,0,0,0)}}
@keyframes scrimOut{to{background-color:rgba(0,0,0,0)}}
@keyframes sheetIn{from{transform:translate3d(0,100%,0)}}
@keyframes sheetOut{to{transform:translate3d(0,105%,0)}}
.sheet.dragging{transition:none!important}
.sheet::before{width:40px;height:5px;background:#48484D;margin:0 auto 14px;transition:background .2s,width .2s}
.sheet.dragging::before{background:#8E8E93;width:52px}
.sheet .swap{animation:swapin .26s var(--ease-out)}
@keyframes swapin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* tab content cross-fades */
#app.enter{animation:appin .28s var(--ease-out)}
@keyframes appin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* iOS-style compact title on scroll */
#mini{position:fixed;top:0;left:0;right:0;z-index:4;height:calc(48px + env(safe-area-inset-top,0px));display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.7);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid rgba(255,255,255,.07);opacity:0;transform:translateY(-8px);transition:opacity .18s ease,transform .3s var(--ease-out);pointer-events:none}
#mini b{padding-bottom:13px;font-size:1.02rem;font-weight:600;letter-spacing:-.01em}
body.scrolled #mini{opacity:1;transform:none}
/* tab bar with drawn icons */
nav .in{grid-template-columns:1fr 1fr 76px 1fr 1fr 1fr;padding:5px 6px 3px}
nav .tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 3px;font-size:11px;font-weight:600;letter-spacing:.005em;color:#8E8E93}
nav .tab svg{width:26px;height:26px;transition:transform .3s var(--ease-out)}
nav .tab[aria-current=page] svg{transform:translateY(-1px) scale(1.04)}
nav .tab[aria-current=page] svg path,nav .tab[aria-current=page] svg rect,nav .tab[aria-current=page] svg circle{stroke-width:2.2}
nav .plus{display:grid;place-items:center;width:54px;height:54px;margin:0 auto;transform:translateY(-6px)}
nav .plus svg{width:26px;height:26px}
nav .plus:active{transform:translateY(-6px) scale(.9)}
.ico{display:inline-block;vertical-align:-.18em;width:1.15em;height:1.15em;flex:none}
/* workout cards: a type chip instead of a colored stripe */
.card::before{display:none}
.card{padding:15px 16px}
.card .kind{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:.8rem;font-weight:500;min-width:0}
.card .kind>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 17%,transparent)}
.tico svg{width:18px;height:18px}
.card .title{display:block;font-size:1.12rem;margin-top:10px}
.card .nums{margin-top:6px}
.card .atplace{display:none}
/* toast: a floating material, not a white pill */
.toast{background:rgba(44,44,48,.88);color:#fff;-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 34px rgba(0,0,0,.45);font-weight:500;padding:11px 18px;transform:translate(-50%,14px) scale(.96);transition:opacity .2s ease,transform .45s var(--ease-out);max-width:calc(100% - 40px);text-align:center;z-index:30}
.toast.show{transform:translate(-50%,0) scale(1)}
/* climbing: send counter + steppers */
.tally{background:radial-gradient(120% 140% at 0% 0%,rgba(255,92,138,.16),transparent 60%),#0B0B0C;border:1px solid rgba(255,92,138,.22);border-radius:22px;padding:14px 12px 12px;margin:18px 0 4px}
.tally-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px 12px}
.tally-h b{font-family:var(--num);font-size:1.12rem;font-weight:700;letter-spacing:-.02em}
.tally-h span{color:var(--muted);font-size:.8rem;text-align:right}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tcell{background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:9px 7px 7px;display:flex;flex-direction:column;align-items:center;transition:border-color .25s,background .25s}
.tcell.on{border-color:color-mix(in srgb,var(--g,var(--climb)) 60%,transparent);background:color-mix(in srgb,var(--g,var(--climb)) 9%,var(--surface))}
.tlab{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.8rem;color:var(--muted);max-width:100%}
.tlab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlab i{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.tcell.on .tlab{color:var(--ink)}
.tn{font-family:var(--num);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.03em;color:#48484D}
.tcell.on .tn{color:var(--ink)}
.tbtns{display:grid;grid-template-columns:1fr 1.5fr;gap:6px;width:100%;margin-top:4px}
.tbtns button{height:44px;border-radius:12px;background:var(--chip);font-size:1.45rem;font-weight:400;line-height:1;color:var(--ink)}
.tbtns button:last-child{background:rgba(255,92,138,.16);color:var(--climb);font-weight:500}
.tcell.on .tbtns button:last-child{background:var(--climb);color:#fff}
.tbtns button:active{transform:scale(.92)}
.tbtns button:disabled,.stepper button:disabled{opacity:.28}
.tally .link{display:block;margin:10px auto 0}
.prob{border-radius:18px;padding:12px 12px 6px;transition:border-color .25s}
.prob[data-res=flash]{border-color:rgba(244,182,63,.4)}
.prob[data-res=attempt] .pgrade b{color:var(--muted)}
.prob .ph{margin-bottom:10px}
.pgrade{display:flex;align-items:center;gap:8px;min-width:0}
.pgrade b{font-family:var(--num);font-size:1.3rem;font-weight:700;letter-spacing:-.02em}
.pdot{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.pnum{color:#5C5C61;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums}
.pctl{display:flex;gap:8px;align-items:center;margin-top:10px}
.pctl .seg{flex:1;margin:0;min-width:0}
.pctl .seg button{padding-left:4px;padding-right:4px;font-size:.84rem}
.stepper{display:flex;align-items:center;flex:none;background:var(--chip);border-radius:13px;padding:3px}
.stepper button{width:42px;height:42px;border-radius:10px;font-size:1.35rem;line-height:1;color:var(--ink)}
.stepper button:active{background:rgba(255,255,255,.1);transform:scale(.9)}
.stepper output{min-width:38px;display:flex;flex-direction:column;align-items:center;line-height:1}
.stepper output b{font-family:var(--num);font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.stepper output small{font-size:.62rem;color:var(--muted);margin-top:3px;font-weight:600}
.bump{animation:bump .34s var(--ease-out)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.25)}100%{transform:scale(1)}}
.prob details.pmore{background:transparent;border:0;padding:0;margin:6px 0 0}
.pmore>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 2px;font-size:.84rem;font-weight:500;color:var(--muted);cursor:pointer}
.pmore>summary::-webkit-details-marker{display:none}
.pmore>summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .25s var(--ease-out);flex:none}
.pmore[open]>summary::before{transform:rotate(45deg)}
.pmore>summary span{margin-left:auto;color:var(--ink);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.untilnow{margin-top:10px;background:rgba(205,245,74,.12)!important;color:var(--accent)!important}
.climb-resume{border:1px solid rgba(255,92,138,.5);background:radial-gradient(130% 160% at 0% 0%,rgba(255,92,138,.22),transparent 60%),var(--surface)}
.chico{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;margin-right:8px;vertical-align:-6px;background:rgba(255,255,255,.08)}
.chico svg{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){
  .scrim.open .sheet,.scrim.closing .sheet{animation:none!important}
  #app.enter,.sheet .swap,.bump{animation:none}
  .toast{transform:translate(-50%,0)}
}

/* ---------- interval timer ---------- */
.seg-wrap{flex-wrap:wrap}.seg-wrap button{flex:1 0 22%}
.acts{grid-template-columns:repeat(4,1fr)}
.actbtn{flex-direction:column;justify-content:center;gap:6px;padding:12px 4px 10px;font-size:.82rem}
.actbtn i{width:auto;height:auto;background:none;box-shadow:none;color:var(--c);display:block}
.actbtn i svg{width:24px;height:24px;display:block}
.tstart{display:flex;align-items:center;justify-content:center;gap:8px}
.tstart{white-space:nowrap}.tstart span{opacity:.75;font-weight:500;font-variant-numeric:tabular-nums}
.tstart svg{width:20px;height:20px}
.thold{background:rgba(255,107,61,.16)!important;color:var(--core)!important;display:inline-flex;align-items:center;gap:6px}
.tcard{border-color:color-mix(in srgb,var(--c) 35%,transparent)!important}
.tfields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tfield{background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:10px 10px 8px;display:flex;flex-direction:column;gap:8px}
.tfield>span{font-size:.78rem;font-weight:600;color:var(--muted);padding-left:2px}
.tfield .stepper{justify-content:space-between}
.tfield .stepper output b{font-size:1.15rem}
.tsum{display:flex;align-items:baseline;gap:10px;margin:16px 2px 4px}
.tsum b{font-family:var(--num);font-size:2rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tsum span{color:var(--muted);font-size:.85rem}
.tmr{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:#000;color:var(--ink);opacity:0;transform:scale(1.04);transition:opacity .3s ease,transform .45s var(--ease-out);--tc:#8E8E93;overscroll-behavior:none;touch-action:manipulation}
.tmr.open{opacity:1;transform:none}
.tmr::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 38%,color-mix(in srgb,var(--tc) 30%,transparent),transparent 70%);transition:background .5s ease;pointer-events:none}
.tmr[data-ph=prep]{--tc:#F4B63F}.tmr[data-ph=work]{--tc:var(--wc)}.tmr[data-ph=rest]{--tc:#2FC48D}.tmr[data-ph=setrest]{--tc:#5AC8FA}.tmr[data-ph=done]{--tc:#F4B63F}
.tmr>*{position:relative}
.tmr-top{width:100%;max-width:520px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center}
.tmr-tt{text-align:center;display:flex;flex-direction:column;gap:2px}
.tmr-tt b{font-size:1rem;font-weight:600}
.tmr-tt span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tmr-ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--ink);transition:transform .16s var(--press),background .2s}
.tmr-ib svg{width:22px;height:22px}
.tmr-ib:active{transform:scale(.9)}
.tmr-ib.armed{background:var(--red)}
.tmr-ib.lg{width:64px;height:64px}
.tmr-ib.lg svg{width:26px;height:26px}
.tmr-ring{position:relative;width:min(78vw,46vh,400px);aspect-ratio:1;margin:auto 0 0}
.tmr-ring svg{width:100%;height:100%;display:block}
.tmr-ring .trk{fill:none;stroke:rgba(255,255,255,.08);stroke-width:9}
.tmr-ring .arc{fill:none;stroke:var(--tc);stroke-width:9;stroke-linecap:round;transition:stroke .4s ease}
.tmr-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 14%}
.tmr-ph{font-size:.95rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tc);transition:color .4s}
.tmr-n{font-family:var(--num);font-weight:700;font-size:clamp(4.5rem,24vw,8.5rem);line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin:4px 0}
.tmr-n.tick{animation:tmtick .5s var(--ease-out)}
@keyframes tmtick{from{transform:scale(.86);opacity:.4}to{transform:none;opacity:1}}
.tmr-name{font-size:1.05rem;font-weight:600;min-height:1.4em;max-width:100%;text-wrap:balance}
.tmr[data-ph=rest] .tmr-name,.tmr[data-ph=setrest] .tmr-name,.tmr[data-ph=prep] .tmr-name{color:var(--muted);font-weight:500}
.tmr.paused .tmr-n{opacity:.4}
.tmr-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:420px;margin-top:22px}
.tmr-meta div{display:flex;flex-direction:column;align-items:center;gap:2px}
.tmr-meta b{font-family:var(--num);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tmr-meta span{font-size:.74rem;color:var(--muted);font-weight:600}
.tmr-next{color:var(--muted);font-size:.9rem;text-align:center;margin:14px 0 0;min-height:1.3em;max-width:420px}
.tmr-bar{width:100%;max-width:420px;height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:auto;overflow:hidden}
.tmr-bar i{display:block;height:100%;background:var(--tc);transform-origin:left;transform:scaleX(0);transition:background .4s}
.tmr-ctl{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:22px}
.tmr-ctl.col{flex-direction:column;gap:10px;width:100%;max-width:420px;margin-top:auto}
.tmr-ctl.col .btn{width:100%;flex:none}
.tmr-pp{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:var(--tc);color:#000;transition:transform .16s var(--press),background .4s}
.tmr-pp svg{width:34px;height:34px}
.tmr-pp:active{transform:scale(.92)}
.tmr-done{margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%}
.tmr-done h2{font-family:var(--num);font-size:2.6rem;letter-spacing:-.03em;margin:14px 0 0}
.tmr-badge{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--tc);color:#000;animation:pop .5s var(--ease-out)}
.tmr-badge svg{width:46px;height:46px}
@media (max-height:640px){.tmr-meta{margin-top:12px}.tmr-ctl{margin-top:12px}.tmr-pp{width:72px;height:72px}}
@media (prefers-reduced-motion:reduce){.tmr{transform:none}.tmr-n.tick,.tmr-badge{animation:none}}

/* drawn symbols replacing emoji */
.sym{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;color:var(--sc,currentColor);overflow:visible}
.ic .sym{width:.95em;height:.95em;color:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.badge.locked .ic .sym{color:var(--muted);filter:none}
.mdot .sym,.chico .sym,.tico .sym{color:inherit;width:1.05em;height:1.05em}
.xpchip .sym,.redchip .sym{color:inherit}

/* ---------- v3 palette & header refinements ---------- */
:root{--surface:#121214;--chip:#1C1D21;--line:#232428;--muted:#8E8E93}
h1{font-size:2.35rem;letter-spacing:-.035em}
.top{flex-wrap:nowrap;align-items:center;margin-bottom:16px}
.top h1{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topr{gap:8px;flex:none}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.tool{background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:12px 12px 13px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform .18s var(--press)}
.tool:active{transform:scale(.97)}
.tool .chico{margin:0 0 8px}
.tool b{font-size:.98rem;font-weight:600}
.tool>span:last-child{font-size:.78rem;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--ink);flex:none;transition:transform .16s var(--press),background .2s}
.iconbtn svg{width:21px;height:21px}
.iconbtn:active{transform:scale(.9)}
.lvpill{height:40px;display:flex;align-items:center;gap:5px;padding:0 13px;font-size:1rem;background:rgba(244,182,63,.1);border:1px solid rgba(244,182,63,.3)}
.lvk{font-family:var(--font);font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.chips{margin-bottom:10px}
.chip[aria-pressed=true]{background:var(--ink);color:#000}
.pfilter{width:auto;max-width:100%;height:36px;padding:0 34px 0 14px;border-radius:999px;font-size:16px;margin:0 0 14px;background-color:var(--chip)}
nav .tab[aria-current=page]{color:var(--accent)}
nav .tab[aria-current=page] span{color:var(--ink)}
.cday.today{box-shadow:inset 0 0 0 2px var(--accent)}
.seg button[aria-pressed=true]{color:var(--ink)}
.tmr-ib.armed{background:var(--red)}

/* ================= v5 sleek: Apple Fitness × Strava ================= */
:root{--bg:#000;--surface:#1C1C1E;--surface2:#2C2C2E;--chip:#2C2C2E;--line:#38383A;--muted:#8E8E93;--ink:#FFFFFF;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif}
h1{font-family:var(--display);font-weight:700;font-size:2.125rem;letter-spacing:-.022em;line-height:1.05}
.top{margin-bottom:14px}
/* fills, not outlines */
.card,.tot,.rec,.ins,.tlist,.lifts,.chart,.medal,.badge,.segcard,.plc,.empty,.level,.cal,.banner,.tool,.tfield,.tcell,.week{border:0!important;background:var(--surface)}
.ex,.gpx,details,.timer,.fb,.newplace,.prob{background:#151517;border:0}
.sheet{background:#121214;border:0}
.sheet .ins,.sheet .tlist,.sheet .tfield,.sheet .tool,.sheet .chart{background:var(--surface)}
/* numbers: rounded, tight */
.n b,.tot b,.rec .v,.bigv,.medal b,.lvnum b,.rpev,.card .nums b,.segcard .best,.plc .cn,.trow .tv,.liftrow b,.celeb .big,.tn,.tsum b,.tmr-n,.tmr-meta b,.wk-s b{font-family:var(--num);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sheet h3,.ins h3{font-family:var(--display);font-weight:700;letter-spacing:-.02em}
.sheet h3{font-size:1.6rem}
.sheet h4{font-family:var(--display);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:22px 0 8px}
/* section headers like iOS */
.month,h2.month{font-family:var(--display);font-size:1.3rem;font-weight:700;letter-spacing:-.015em;color:var(--ink);margin:22px 2px 10px;text-transform:none}
h2.sec{font-family:var(--display);font-weight:700;letter-spacing:-.015em}
/* feed card */
.card.feed{display:block;padding:16px 16px 14px;border-radius:20px;margin-bottom:12px}
.fh{display:flex;align-items:center;gap:12px;min-width:0}
.fh .tico{width:40px;height:40px;border-radius:50%}
.fh .tico svg{width:21px;height:21px}
.fm{min-width:0;display:flex;flex-direction:column;gap:2px}
.fm b{font-size:1.06rem;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm span{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.feed .nums{display:flex;gap:0;margin:14px 0 0}
.card.feed .n{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;padding-right:10px}
.card.feed .n+.n{padding-left:12px;border-left:1px solid var(--line)}
.card.feed .n span{font-size:.72rem;color:var(--muted);font-weight:500;order:-1}
.card.feed .n b{font-size:clamp(1.15rem,5.4vw,1.4rem);white-space:nowrap}
.fmap{margin:14px -4px 0;height:150px;border-radius:14px;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.06) 1px,transparent 1.4px) 0 0/14px 14px,#141416;color:var(--c);overflow:hidden}
.fmap svg{width:100%;height:100%;display:block}
.card.feed .aw{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
/* weekly strip */
.week{display:block;width:100%;text-align:left;border-radius:20px;padding:16px 16px 12px;margin:0 0 14px}
.wk-h{display:flex;justify-content:space-between;align-items:baseline}
.wk-h span{font-size:.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wk-h em{font-style:normal;font-size:.78rem;font-weight:600}
.wk-h em.up{color:var(--accent)}.wk-h em.down{color:var(--muted)}
.wk-s{display:grid;grid-template-columns:1.3fr 1fr 1fr;margin-top:6px}
.wk-s div{display:flex;flex-direction:column}
.wk-s b{font-size:1.75rem;line-height:1.1}
.wk-s span{font-size:.75rem;color:var(--muted)}
.wk-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}
.wk-d{display:flex;flex-direction:column;align-items:center;gap:6px}
.wk-col{width:100%;max-width:26px;height:46px;border-radius:7px;background:rgba(255,255,255,.06);display:flex;flex-direction:column-reverse;overflow:hidden;gap:2px}
.wk-col i{display:block;width:100%;border-radius:3px}
.wk-d span{font-size:.7rem;color:var(--muted);font-weight:600}
.wk-d.today span{color:var(--ink)}
.wk-d.today .wk-col{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.wk-d.fut .wk-col{background:rgba(255,255,255,.03)}
/* iOS segmented control */
.seg{background:rgba(118,118,128,.24);border-radius:10px;padding:2px}
.seg button{border-radius:8px;padding:7px 4px;font-size:.86rem;font-weight:500;color:var(--ink)}
.seg button[aria-pressed=true]{background:#636366;color:#fff;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.25)}
/* chips */
.chip{background:var(--surface);color:var(--ink);font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:#000;font-weight:600}
/* lists: inset grouped with hairlines */
.tlist{border-radius:16px}
.tlist>.trow{border-bottom:0}
.tlist>.trow+.trow{box-shadow:inset 0 1px 0 var(--line)}
/* buttons */
.btn{border-radius:14px;font-weight:600}
.btn.primary{background:#fff;color:#000}

/* metric tiles: label above value, like Fitness */
.tot{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:4px;border-radius:18px;padding:14px 16px}
.tot>span{font-size:.78rem;color:var(--muted);font-weight:500}
.tot b{font-size:1.9rem;line-height:1.05}
.tot .unit,.wk-s small{font-size:.9rem;color:var(--muted);font-weight:600;margin-left:2px}
.dstats .n{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:2px}
.dstats .n span{font-size:.74rem;color:var(--muted);font-weight:500}
.wk-s{margin-top:10px}.wk-s span{order:-1;margin-bottom:1px}
.chart{border-radius:18px}
.ins{border-radius:20px}
.plc{border-radius:18px}
.empty{border-radius:18px}
.ins .chip,.week .chip,.card .chip,.sheet .chip,.level .chip,.tlist .chip,.chart .chip{background:var(--surface2)}
.ins .tchip:not([aria-pressed=true]),.sheet .ins .tchip:not([aria-pressed=true]){background:var(--surface2)}
/* exercise library */
.exlib{position:fixed;inset:0;z-index:35;background:#000;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 0;transform:translate3d(0,100%,0);transition:transform .42s var(--ease-out)}
.exlib.open{transform:none}
.exl-top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:8px 14px}
.exl-top b{text-align:center;font-size:1.05rem;font-weight:600}
.exl-search{padding:4px 16px 8px}
.exl-search input{background:var(--surface);border-radius:12px;height:42px}
.exl-chips{padding:0 16px;margin-bottom:8px;flex:none}
.chip.sm{padding:6px 12px;font-size:.8rem}
.exl-list{flex:1;overflow:auto;padding:0 16px 120px;overscroll-behavior:contain}
.exl-list h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin:16px 4px 8px}
.exg{background:var(--surface);border-radius:16px}
.exi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;min-height:54px}
.exi+.exi{box-shadow:inset 0 1px 0 var(--line)}
.exc{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1.6px #48484A;color:#000;font-weight:700}
.exc svg{width:15px;height:15px}
.exi[aria-pressed=true] .exc{background:var(--accent);box-shadow:none}
.ext{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ext b{font-weight:600;font-size:.96rem}
.ext span{font-size:.76rem;color:var(--muted)}
.exq{font-size:.7rem;color:var(--muted);background:var(--surface2);border-radius:6px;padding:3px 7px;flex:none}
.exl-bar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000 30%)}
.exl-bar .btn{width:100%}
.btn.go:disabled{opacity:.35}
.bwtag{display:inline-block;margin-top:6px;font-size:.7rem;font-weight:600;color:var(--accent);background:rgba(205,245,74,.1);border-radius:6px;padding:3px 7px}
#addexlib{display:flex;align-items:center;justify-content:center;gap:8px}
#addexlib svg{width:18px;height:18px}
/* timer programs */
.plist{background:var(--surface);border-radius:16px}
.pcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px}
.pcard+.pcard{box-shadow:inset 0 1px 0 var(--line)}
.pcard .chico{margin:0}
.pct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pct b{font-weight:600}
.pct span{font-size:.78rem;color:var(--muted)}
.pcgo{color:var(--muted)}.pcgo svg{width:18px;height:18px}
.pmoves{margin-bottom:6px}
@media (prefers-reduced-motion:reduce){.exlib{transition:none}}

/* climbing grade marks */
.gm{display:block;width:100%;height:100%;overflow:visible}
.cdot.gmk{background:none!important;border:0;padding:3px;width:42px;height:42px;border-radius:14px;box-shadow:none}
.cdot.gmk[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.cdot.gmk:not([aria-pressed=true]){opacity:.92}
.pdot{background:none!important;box-shadow:none!important;width:22px;height:22px}
.mdot.gmd{background:none!important;box-shadow:none!important;padding:0}
.mdot.gmd .gm{width:30px;height:30px}
.gm-sm{width:20px!important;height:20px!important;display:inline-block}
.gm-xs{width:13px!important;height:13px!important;display:inline-block}
.gm-inl{width:18px!important;height:18px!important;display:inline-block;vertical-align:-4px}
.cdots{gap:4px;align-items:center}
.tlab .gm{flex:none}
@media (prefers-reduced-transparency:reduce){nav,#mini,.toast,.scrim{-webkit-backdrop-filter:none;backdrop-filter:none}nav,#mini{background:#0A0A0C}}

/* ---------- 3D medals ---------- */
.k3{position:relative;width:var(--sz);height:var(--sz);margin:0 auto;perspective:calc(var(--sz)*5);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.k3.grab{cursor:grabbing}
.k3-r{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.k3-e{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.k3-e i{position:absolute;left:0;top:0;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.k3-f{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:grid;place-items:center;
  background:conic-gradient(from var(--a,0deg),var(--c1),var(--c2) 17%,var(--c1) 33%,var(--c2) 50%,var(--c1) 67%,var(--c2) 83%,var(--c1));
  box-shadow:inset 0 0 0 calc(var(--sz)*.03) rgba(255,255,255,.34),inset 0 0 0 calc(var(--sz)*.055) rgba(0,0,0,.16),inset 0 calc(var(--sz)*-.02) calc(var(--sz)*.05) rgba(0,0,0,.25)}
.k3-front{transform:translateZ(calc(var(--th)/2))}
.k3-back{transform:rotateY(180deg) translateZ(calc(var(--th)/2))}
.k3-in{width:74%;height:74%;border-radius:50%;display:grid;place-items:center;align-content:center;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.26),rgba(255,255,255,0) 60%),radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.18));box-shadow:inset 0 calc(var(--sz)*.012) calc(var(--sz)*.02) rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.4)}
.k3-ic{font-size:calc(var(--sz)*.38);line-height:1;display:grid;place-items:center}
.k3 .k3-ic .sym{width:1em;height:1em;color:var(--ink);filter:drop-shadow(0 calc(var(--sz)*.012) calc(var(--sz)*.01) rgba(0,0,0,.35)) drop-shadow(0 -1px 0 rgba(255,255,255,.25))}
.k3-num{font-family:var(--num);font-weight:800;font-size:calc(var(--sz)*.42);letter-spacing:-.04em;line-height:1;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.45),0 calc(var(--sz)*-.008) 0 rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.k3-eng{color:var(--ink);font-weight:800;font-size:calc(var(--sz)*.075);line-height:1.2;text-align:center;padding:0 12%;letter-spacing:.02em;text-transform:uppercase;text-shadow:0 1px 0 rgba(255,255,255,.35),0 -1px 0 rgba(0,0,0,.3)}
.k3-eng span{display:block;margin-top:.5em;font-weight:600;font-size:.82em;opacity:.8}
.k3-gl{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:linear-gradient(105deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.62) 48%,rgba(255,255,255,0) 61%);background-size:300% 100%;background-position:var(--gx,50%) 0;mix-blend-mode:soft-light}
.k3-sh{position:absolute;left:18%;right:18%;bottom:-13%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.75),transparent);filter:blur(3px);pointer-events:none}
.k3.locked .k3-f{filter:grayscale(1) brightness(.5) contrast(.9)}
.k3.locked .k3-e{filter:grayscale(1) brightness(.5)}
.k3.k3sm{--ink:#2A1B00}
.k3.k3sm .k3-sh{display:none}
.lvcoin{display:grid;justify-items:center;gap:4px}
.lvcoin span{font-size:.7rem;font-weight:600;color:var(--muted)}
.acc3d{padding:18px 0 26px}
.acc3d+.k3hint{margin-top:-6px}
.k3hint{font-size:.78rem;color:var(--muted);margin:0 0 8px}

/* earned accolade badges read as minted coins */
.badge:not(.locked) .ic{position:relative;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.3),inset 0 0 0 5px rgba(0,0,0,.14),inset 0 -4px 6px rgba(0,0,0,.22),0 6px 14px -6px rgba(0,0,0,.7)}
.badge:not(.locked) .ic::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);background-size:300% 100%;background-position:120% 0;animation:coinShine 1.1s .25s var(--ease-out,ease-out) both;pointer-events:none}
@keyframes coinShine{to{background-position:-20% 0}}
.badge{transition:transform .14s var(--press,ease)}
.badge:active{transform:scale(.96)}

/* ---------- unlock moment ---------- */
.unl{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.94);color:var(--ink,#F5F5F7);opacity:0;transition:opacity .32s ease;overscroll-behavior:none;overflow:hidden}
.unl.open{opacity:1}
.unl.closing{opacity:0;transition-duration:.24s}
.unl-glow{position:absolute;left:50%;top:38%;width:150vmin;height:150vmin;transform:translate(-50%,-50%);background:radial-gradient(closest-side,color-mix(in srgb,var(--g) 34%,transparent),color-mix(in srgb,var(--g2) 10%,transparent) 45%,transparent 70%);animation:unlGlow 3.6s ease-in-out infinite alternate;pointer-events:none}
@supports not (background:color-mix(in srgb,red 50%,blue)){.unl-glow{background:radial-gradient(closest-side,rgba(255,214,107,.22),transparent 70%)}}
@keyframes unlGlow{from{opacity:.75;transform:translate(-50%,-50%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
.unl-in{position:relative;width:100%;max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center}
.unl canvas.cf3{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.unl-ey{margin:0 0 18px;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--g)}
.unl-m{margin:4px 0 30px}
.unl-t{font-family:var(--num);font-size:clamp(2rem,9vw,2.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0}
.unl-d{margin:8px 0 0;color:#B8B8BF;font-size:1rem;line-height:1.4;max-width:30ch}
.unl-chip{display:inline-block;margin-top:14px;padding:6px 12px;border-radius:999px;font-size:.8rem;font-weight:700;color:#fff}
.unl-h{margin:18px 0 0;font-size:.76rem;color:#8E8E93}
.unl-b{margin-top:20px;min-width:200px;min-height:50px;font-size:1.05rem}
.unl-dots{display:flex;gap:6px;margin-top:16px}
.unl-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22)}
.unl-dots i.on{background:#fff;width:18px;border-radius:3px}
.unl.open .unl-in>*{animation:unlUp .5s var(--ease-out,cubic-bezier(.16,1,.3,1)) both}
.unl.open .unl-in>.unl-m{animation:unlPop .9s cubic-bezier(.175,.885,.32,1.275) both}
.unl.open .unl-in>:nth-child(1){animation-delay:.05s}
.unl.open .unl-in>:nth-child(3){animation-delay:.42s}
.unl.open .unl-in>:nth-child(4){animation-delay:.49s}
.unl.open .unl-in>:nth-child(5){animation-delay:.56s}
.unl.open .unl-in>:nth-child(6){animation-delay:.63s}
.unl.open .unl-in>:nth-child(7){animation-delay:.70s}
.unl.open .unl-in>:nth-child(8){animation-delay:.74s}
@keyframes unlUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes unlPop{0%{opacity:0;transform:scale(.45) translateY(30px)}60%{opacity:1}100%{opacity:1;transform:none}}
@media (max-height:640px){.unl-m{margin-bottom:20px}.unl-h{display:none}.unl-ey{margin-bottom:10px}}
@media (prefers-reduced-motion:reduce){.unl.open .unl-in>*,.unl-glow,.badge:not(.locked) .ic::after{animation:none!important}.unl{transition:none}}

/* ---------- fitness, fatigue, form ---------- */
.formst{text-align:right;flex:none}
.formst b{display:block;font-family:var(--num);font-size:1.5rem;font-weight:800;letter-spacing:-.02em;color:var(--fc)}

.ins .fx{margin:8px 0 4px;font-size:.92rem;line-height:1.45}

.pmc svg{display:block;width:100%;height:auto;overflow:visible;color:var(--ink)}
.pmc-leg{display:flex;gap:14px;font-size:.78rem;color:var(--muted);margin-bottom:2px}

.pmc-leg i{width:12px;height:3px;border-radius:2px;display:inline-block}

.pmc-tip{position:absolute;top:-6px;pointer-events:none;opacity:0;transition:opacity .12s;background:#2C2C2E;border-radius:10px;padding:7px 10px;font-size:.76rem;line-height:1.35;display:grid;gap:1px;box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap;z-index:2}
.pmc-tip b{font-size:.8rem}
.pmc-tip span{display:flex;align-items:center;gap:6px;color:#D1D1D6;font-variant-numeric:tabular-nums}

.mix{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden}

.ins.calx{width:100%;display:flex;gap:12px;align-items:center;text-align:left;margin-top:14px}

.ins.calx>span:last-child>span{font-size:.82rem;color:var(--muted);line-height:1.35}

#sheet:focus{outline:none}

.wk-s{display:flex;flex-wrap:wrap;gap:6px 22px}

.probs-long:not(.open) .pmore{display:none}

.musbox{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:center;background:var(--surface);border-radius:14px;padding:14px}

button.trow.sendrow{width:100%;text-align:left;color:inherit;font:inherit;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer}
button.trow.sendrow:last-child{border-bottom:0}
button.trow.sendrow:active{opacity:.6}

.wk-h em{padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.06)}

.wk-d.today span{position:relative}

.chip .fdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--d);margin-right:6px;vertical-align:1px}

.dico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);margin-top:2px}

.dstats.c2 .n,.dstats.c3 .n{background:rgba(255,255,255,.05);border-radius:14px;padding:11px 13px 12px;min-width:0}

.row.dsec:empty{display:none}

.qrow{display:flex;justify-content:center;gap:4px;margin-top:14px}

function projector(pts,w,h,padd){

  return i=>[(xs[i]-mnx)*sc+ox,(ys[i]-mny)*sc+oy];

  }else{

function chalValue(ch,L){

    case "sessions":return L.length;
    case "minutes":return L.reduce((a,s)=>a+(s.dur||0)/60,0);
    case "days":return new Set(L.map(s=>s.date)).size;
    case "dist":return T.reduce((a,s)=>a+(s.dist||0),0);
    case "sends":return L.reduce((a,s)=>a+(s.type==="climb"?sends(s).length:0),0);
    case "count":return T.length;
    case "vol":return L.reduce((a,s)=>a+volume(s),0);
    case "elev":return L.reduce((a,s)=>a+(s.type!=="lift"&&s.type!=="climb"?s.elev||0:0),0);
    case "types":return new Set(L.map(s=>s.type)).size;
    case "long":return Math.max(0,...L.map(s=>(s.dur||0)/60));
    case "early":return L.filter(s=>s.time&&s.time<"07:00").length;
    case "hard":return L.filter(s=>(s.rpe||0)>=8).length;
  }
  return 0;
}

function cats(s){
  const out=[],T=TYPES[s.type].toLowerCase();
  if(s.type!=="lift"&&s.type!=="climb"&&s.dist>0)out.push({key:"long-"+s.type,kind:"longest",noun:T,value:s.dist,dir:1,fmt:fmtDist});
  if(s.dur>0)out.push({key:"dur-"+s.type,kind:"longest",noun:s.type==="lift"?"lifting session":s.type==="climb"?"bouldering session":T+" by time",value:s.dur,dir:1,fmt:fmtDur});
  if((s.type==="run"||s.type==="walk")&&s.dist>=1&&s.dur>0)out.push({key:"pace-"+s.type,kind:"fastest",noun:T+" pace",value:s.dur/s.dist,dir:-1,fmt:fmtPace});
  if(s.type==="ride"&&s.dist>=5&&s.dur>0)out.push({key:"speed-ride",kind:"fastest",noun:"ride speed",value:s.dist/(s.dur/3600),dir:1,fmt:v=>fmtSpeed(v,3600)});
  if(s.type!=="lift"&&s.type!=="climb"&&s.elev>0)out.push({key:"climb-"+s.type,kind:"biggest",noun:T+" climb",value:s.elev,dir:1,fmt:fmtElev});
  if(s.maxEle!=null&&s.type!=="lift"&&s.type!=="climb")out.push({key:"alt",kind:"highest",noun:"elevation reached",value:s.maxEle,dir:1,fmt:fmtElev});
  for(const [D,name] of EFFORTS[s.type]||[]){const v=s.efforts&&s.efforts[String(D)];if(v>0)out.push({key:`eff-${s.type}-${D}`,kind:"fastest",noun:name,value:v,dir:-1,fmt:fmtClock,pr:true,sub:s.type==="ride"?fmtSpeed(D/1000,v):fmtPace(v/(D/1000))});}
  if(s.type==="hike"&&s.elev>=100&&s.dur>0)out.push({key:"vrate-hike",kind:"fastest",noun:"climbing rate",value:s.elev/(s.dur/3600),dir:1,fmt:v=>Math.round(toDispElev(v))+" "+elevU()+"/h"});
  if(s.type==="lift"){
    const v=volume(s);if(v>0)out.push({key:"vol",kind:"highest",noun:"session volume",value:v,dir:1,fmt:fmtVol});
    const seen={};
    for(const e of s.ex||[]){if(!e.name||!(e.w>0))continue;const k=e.name.trim().toLowerCase();if(!seen[k]||seen[k].w<e.w)seen[k]={w:e.w,name:e.name.trim()};}
    for(const k in seen)out.push({key:"ex-"+k,kind:"heaviest",noun:seen[k].name,value:seen[k].w,dir:1,fmt:fmtWt,pr:true,goldOnly:true});
    const rm={};for(const e of s.ex||[]){const v=e1rm(e);if(!v||!e.name)continue;const k=e.name.trim().toLowerCase();if(!rm[k]||rm[k].v<v)rm[k]={v,name:e.name.trim()};}
    for(const k in rm)out.push({key:"rm-"+k,kind:"best",noun:rm[k].name+" est. 1RM",value:rm[k].v,dir:1,fmt:fmtWt,pr:true,goldOnly:true});
  }
  if(s.type==="hang"){
    const seen={};for(const h of s.hangs||[]){if(h.add==null||!h.grip)continue;const k=h.grip+"|"+(h.edge||"");if(seen[k]==null||h.add>seen[k].add)seen[k]=h;}
    for(const k in seen){const h=seen[k];out.push({key:"hang-"+k,kind:"heaviest",noun:`${h.grip}${h.edge?" "+h.edge+" mm":""}`,value:h.add,dir:1,fmt:fmtAdd,pr:true,goldOnly:true,sub:`${h.hang}s hangs`});}
    const ht=hangTime(s);if(ht)out.push({key:"hangtime",kind:"most",noun:"hang time",value:ht,dir:1,fmt:v=>fmtDur(v)});
  }
  if(s.type==="ride"){
    if(s.pw>0)out.push({key:"pow",kind:"highest",noun:"avg power",value:s.pw,dir:1,fmt:v=>Math.round(v)+" W"});
    if(wkg(s))out.push({key:"wkg",kind:"highest",noun:"avg W/kg",value:wkg(s),dir:1,fmt:v=>v.toFixed(2)+" W/kg"});
    if(s.p20>0)out.push({key:"p20",kind:"best",noun:"20-min power",value:s.p20,dir:1,fmt:v=>Math.round(v)+" W",pr:true});
  }

/* Phone storage holds about 5 MB. When it fills, thin out GPS routes older than 60 days (newest kept intact) so new workouts still save. */
function compactTracks(maxPts){
  let n=0;const cut=keyOf(addDays(new Date(),-60));

    if(!s||s.deleted||!Array.isArray(s.track)||s.track.length<=maxPts||s.date>=cut)continue;

function writeLocal(){localStorage.setItem(KEY,JSON.stringify(sessions));localStorage.setItem(GKEY,JSON.stringify(segments));localStorage.setItem(SKEY,JSON.stringify(settings));}
function saveLocal(){

const writing={};
async function writeDoc(key,ref,getData){
  if(writing[key]){writing[key].again=true;return;}

  catch(e){
    if(e&&e.code==="quota_exceeded")toast("Cloud storage is full. Your data is still saved on this device.");

  }

async function initRemote(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    if(!(await user.isOwner())){await enterViewer(db);return;}
    const id=await user.id();if(!id)return;
    const c=db.collection("data/users/"+id);
    const snap=await c.limit(1000).get();
    remote={col:c,db};
    const seenS=new Set(),seenG=new Set();let changed=false;
    for(const d of snap.docs){
      const body=d.data();if(!body)continue;
      if(d.id==="settings"){
        if((body.updatedAt||0)>(settings.updatedAt||0)){const {updatedAt,...rest}=body;settings={...settings,...JSON.parse(JSON.stringify(rest)),updatedAt};changed=true;}
        continue;

      const kind=d.id.slice(0,2),store=kind==="s_"?sessions:kind==="g_"?segments:null;if(!store)continue;
      (kind==="s_"?seenS:seenG).add(body.id);

      else if((loc.updatedAt||0)>(body.updatedAt||0))pushItem(kind,store,body.id);
    }
    for(const s of Object.values(sessions))if(!seenS.has(s.id))pushItem("s_",sessions,s.id);
    for(const g of Object.values(segments))if(!seenG.has(g.id))pushSegment(g);
    if(settings.share&&settings.share.on){profilePush();for(const s of Object.values(sessions))feedPush(s);}
    if(changed){invalidate();saveLocal();render();}
  }catch(e){remote=null}
}

function renderChart(all){
  const weeks=12,t=new Date();t.setHours(0,0,0,0);
  const mon=new Date(t);mon.setDate(t.getDate()-((t.getDay()+6)%7));
  const buckets=[];
  for(let i=weeks-1;i>=0;i--){const s=addDays(mon,-7*i);buckets.push({s:keyOf(s),e:keyOf(addDays(s,7)),label:s,v:0});}
  for(const x of all){
    const b=buckets.find(b=>x.date>=b.s&&x.date<b.e);if(!b)continue;
    if(chartMetric==="dist"&&DIST_TYPES.includes(x.type))b.v+=toDispDist(x.dist||0);
    if(chartMetric==="vol")b.v+=toDispWt(volume(x));
    if(chartMetric==="time")b.v+=(x.dur||0)/3600;
  }
  const max=Math.max(...buckets.map(b=>b.v),0),W=600,H=170,pb=22,pt=18,bw=W/weeks;
  const color=chartMetric==="dist"?"var(--run)":chartMetric==="vol"?"var(--lift)":"var(--walk)";
  const fmt=v=>chartMetric==="time"?round(v,1)+"h":chartMetric==="vol"?(v>=1000?round(v/1000,1)+"k":Math.round(v)):round(v,1);
  let bars="";
  buckets.forEach((b,i)=>{
    const h=max?(b.v/max)*(H-pb-pt):0,x=i*bw+bw*.18,w=bw*.64,y=H-pb-h;
    bars+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,b.v?2:0)}" rx="4" fill="${color}" opacity="${i===weeks-1?1:.55}"/>`;
    if(b.v&&(i===weeks-1||b.v===max))bars+=`<text x="${x+w/2}" y="${y-5}" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" font-family="Barlow Condensed,Arial Narrow,sans-serif">${fmt(b.v)}</text>`;
    if(i%3===0||i===weeks-1)bars+=`<text x="${x+w/2}" y="${H-5}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Barlow,system-ui,sans-serif">${i===weeks-1?"This wk":b.label.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</text>`;
  });
  const unit=chartMetric==="dist"?dU():chartMetric==="vol"?wU():"hours";
  return `<div class="seg" role="group" aria-label="Chart metric">${[["dist","Distance"],["vol","Volume"],["time","Time"]].map(([k,v])=>`<button data-metric="${k}" aria-pressed="${chartMetric===k}">${v}</button>`).join("")}</div>
  <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly ${unit}, last 12 weeks">${bars}</svg></div>
  <p class="hint">Weekly ${chartMetric==="dist"?"distance ("+unit+")":chartMetric==="vol"?"weight lifted ("+unit+")":"training time"} over the last 12 weeks.</p>`;
}

  for(let st=0;st<cfg.sets;st++){for(let r=0;r<cfg.reps;r++){seq.push(["HANG",cfg.hang,st,r]);if(r<cfg.reps-1)seq.push(["REST",cfg.rest,st,r]);}if(st<cfg.sets-1)seq.push(["SET REST",cfg.setRest,st,-1]);}
  seq.unshift(["GET READY",5,0,-1]);
  let i=0,end=Date.now()+seq[0][1]*1000;
  const tick=()=>{let left=Math.ceil((end-Date.now())/1000);
    if(left<=0){i++;if(i>=seq.length){stopHang();if(navigator.vibrate)navigator.vibrate([300,100,300]);toast("Hangboard set complete");const b=$("ht-go");if(b)b.textContent="Start repeaters";return;}end=Date.now()+seq[i][1]*1000;left=seq[i][1];if(navigator.vibrate)navigator.vibrate(seq[i][0]==="HANG"?120:60);}
    const el=$("ht");if(el){const [ph,,st,r]=seq[i];el.textContent=`${ph} ${left>59?fmtClock(left):left}`+(r>=0?`  ${st+1}.${r+1}`:"");el.style.color=ph==="HANG"?"var(--hang)":"";}};
  tick();hangT.iv=setInterval(tick,250);
}

/* Gyroscope: one shared listener, read by every live medal. */
const gyro={x:0,y:0,on:false,asked:false,base:null};
function gyroStart(){

/* Drag to spin with momentum, spring back to the nearest face, follow the phone's tilt when idle. */

/* 3D confetti with Zdog: paper pieces tumbling in real depth, lit on one side. */
function confetti3D(host,colors,o={}){

  const W=innerWidth,H=innerHeight,dpr=Math.min(2,devicePixelRatio||1),cv=document.createElement("canvas");
  cv.className="cf3";cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+"px";cv.style.height=H+"px";host.appendChild(cv);
  const illo=new Zdog.Illustration({element:cv,zoom:dpr,resize:false}),ox=(o.x??W/2)-W/2,oy=(o.y??H*.38)-H/2,P=[],n=o.n||(W<500?64:90);
  for(let i=0;i<n;i++){

    const opt={addTo:illo,translate:{x:ox,y:oy,z:0},rotate:{x:Math.random()*6,y:Math.random()*6,z:Math.random()*6},color:c,backface:shadeHex(c,-.38),fill:true,stroke:kind<.75?.6:0};

/* ---------- segments ---------- */
function createSegment(s){
  const tr=s.track,n=tr.length,cum=trackCum(s);
  let a=Math.floor(n*.25),b=Math.max(a+2,Math.floor(n*.55));
  openSheet(`<div style="--c:${col(s.type)}"><h3>Create segment</h3><p class="sub">Drag the sliders to pick the stretch you want to race yourself on. Green is the start, red is the finish.</p>
    <div class="route" id="segmap"></div>
    <label for="sa">Start</label><input type="range" id="sa" min="0" max="${n-1}" value="${a}">
    <label for="sb">Finish</label><input type="range" id="sb" min="0" max="${n-1}" value="${b}">
    <p class="hint" id="seginfo"></p>
    <label for="sname">Name</label><input type="text" id="sname" maxlength="50" placeholder="e.g. Park hill climb">
    <div class="err" id="serr"></div>
    <div class="row"><button class="btn" id="scancel">Cancel</button><button class="btn primary" id="ssave2">Save segment</button></div></div>`);
  const gainOf=(i,j)=>{let g=0,ref=null;for(let k=i;k<=j;k++){const e=tr[k][2];if(e==null)continue;if(ref==null){ref=e;continue;}if(e-ref>=2){g+=e-ref;ref=e}else if(ref-e>=2)ref=e;}return g;};
  const upd=()=>{
    a=+$("sa").value;b=+$("sb").value;if(b<=a){b=Math.min(n-1,a+1);$("sb").value=b;}
    $("segmap").innerHTML=routeSVG(tr,{w:600,h:340,pad:24,sw:5,hi:[a,b]});
    const dist=cum[b]-cum[a],t=tr[b][3]-tr[a][3];
    $("seginfo").textContent=`${fmtDist(dist/1000)}, ${fmtElev(gainOf(a,b))} climb. Your time on this workout: ${fmtClock(t)}.`;
  };
  $("sa").oninput=upd;$("sb").oninput=upd;upd();
  $("scancel").onclick=()=>openDetail(s);
  $("ssave2").onclick=()=>{
    const dist=cum[b]-cum[a];
    if(dist<100){$("serr").textContent="Make the segment at least 100 m long.";return;}
    const name=$("sname").value.trim()||"Segment from "+titleOf(s);
    const step=Math.max(1,Math.ceil((b-a+1)/150)),pts=[];
    for(let k=a;k<=b;k+=step)pts.push([tr[k][0],tr[k][1]]);
    if((b-a)%step)pts.push([tr[b][0],tr[b][1]]);
    const g={id:uid(),name,type:s.type,start:[tr[a][0],tr[a][1]],end:[tr[b][0],tr[b][1]],dist,gain:Math.round(gainOf(a,b)),pts,created:Date.now()};
    upsertSeg(g);
    const ef=segEfforts(g);
    toast(`Segment saved. Found ${ef.length} effort${ef.length===1?"":"s"}.`);
    openSegment(g);
  };
}
function openSegment(g){
  if(!g||g.deleted)return;
  const ef=segEfforts(g);
  openSheet(`<div style="--c:${col(g.type)}"><h3>${esc(g.name)}</h3><p class="sub">${TYPES[g.type]} segment, ${fmtDist(g.dist/1000)}${g.gain?", "+fmtElev(g.gain)+" climb":""}</p>
    <div class="route">${routeSVG(g.pts,{w:600,h:300,pad:24,sw:6})}</div>
    <h4>Your efforts</h4>
    ${ef.length?`<div class="tlist">${ef.map((x,i)=>`<button class="trow" data-o="${x.s.id}">${i<3?`<span class="mdot m${i+1}">${i+1}</span>`:`<span class="mdot" style="background:var(--chip);color:var(--muted)">${i+1}</span>`}<div class="tx"><b>${fmtDate(x.s.date)}</b><span>${esc(titleOf(x.s))}, ${g.type==="ride"?fmtSpeed(g.dist/1000,x.t):fmtPace(x.t/(g.dist/1000))}</span></div><span class="tv">${fmtClock(x.t)}</span></button>`).join("")}</div>`:`<div class="empty">No timed efforts on this segment yet.</div>`}
    <label for="rn">Name</label><input type="text" id="rn" maxlength="50" value="${esc(g.name)}">
    <div class="row"><button class="btn" id="gren">Rename</button><button class="btn danger" id="gdel">Delete segment</button></div>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="gclose">Close</button></div></div>`);
  $("sheet").querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>openDetail(sessions[b.dataset.o]));
  $("gclose").onclick=closeSheet;
  $("gren").onclick=()=>{const v=$("rn").value.trim();if(v){g.name=v;upsertSeg(g);openSegment(g);toast("Segment renamed");}};
  $("gdel").onclick=()=>{const b=$("gdel");if(b.dataset.armed){upsertSeg({id:g.id,deleted:true});closeSheet();toast("Segment deleted");}else{b.dataset.armed="1";b.textContent="Tap to confirm";}};
}
function openAccolade(id){
  const A=ACC.find(x=>x.id===id),c=getC(),e=c.earned[id];if(!A)return;
  let prog="";
  if(!e&&A.prog){const [a,b]=A.prog(c.ctx);prog=`<div class="xpbar" style="max-width:300px;margin:14px auto 6px"><span style="width:${Math.min(100,a/b*100)}%;background:var(--muted)"></span></div><div class="xpinfo">${esc(A.pf?A.pf(c)(a):Math.min(a,b)+" of "+b)}</div>`;}
  const tt=tierOf(A.xp);
  openSheet(`<div class="celeb"><div class="acc3d">${medal3D({icon:A.icon,c1:tt[3],c2:tt[2],size:Math.min(200,Math.round(innerWidth*.5)),locked:!e,label:A.name,back:e?`${esc(A.name)}<br><span>${fmtDate(e.date,{month:"short",day:"numeric",year:"numeric"})}</span>`:"Locked"})}</div><p class="k3hint">${e?"Drag to spin. Tap to flip.":"Not earned yet. Drag to spin."}</p>
    <h3>${esc(A.name)}</h3><p class="sub">${esc(A.desc)}. Worth ${A.xp||100} XP.</p><span class="xpchip" style="background:${tierOf(A.xp)[2]}">${tierOf(A.xp)[1]}</span>
    ${e?`<p>Earned ${fmtDate(e.date,{month:"long",day:"numeric",year:"numeric"})}</p><div class="row"><button class="btn" id="aopen">View workout</button><button class="btn primary" id="aclose">Close</button></div>`:`${prog}<div class="row"><button class="btn primary" id="aclose">Close</button></div>`}</div>`);
  $("aclose").onclick=closeSheet;if($("aopen"))$("aopen").onclick=()=>openDetail(sessions[e.sid]);

}

/* Sets per muscle group for one lift session: the first listed muscle gets the full sets, helpers get half. */
function musLoad(s){
  const v={};const add=(m,n)=>{if(m==="Full body"){for(const k of ["Chest","Back","Shoulders","Legs","Glutes","Core"])v[k]=(v[k]||0)+n*.4;return;}v[m]=(v[m]||0)+n;};
  for(const e of s.ex||[]){const n=+e.sets||1,ms=e.mus&&e.mus.length?e.mus:guessMuscles(e.name);ms.forEach((m,i)=>add(m,i?n*.5:n));}
  return v;
}
function musTop(v,n=4){return Object.entries(v).filter(([,x])=>x>0).sort((a,b)=>b[1]-a[1]).slice(0,n);}
/* In-app SVG version */
function muscleSVG(v,o={}){
  const max=Math.max(1,...Object.values(v)),hi=o.color||"var(--accent)";
  const fig=(k,dx)=>BODY[k].map(p=>{const a=p.m&&v[p.m]?.35+.65*Math.min(1,v[p.m]/max):0;const fill=a?`fill="${hi}" fill-opacity="${a.toFixed(2)}"`:`fill="currentColor" fill-opacity="${p.m?.13:.08}"`;
    return `<path d="${p.d}" ${fill} transform="translate(${dx} 0)"/>`+(p.c?"":`<path d="${p.d}" ${fill} transform="translate(${dx+200} 0) scale(-1 1)"/>`);}).join("");
  return `<svg class="musmap" viewBox="0 0 430 412" role="img" aria-label="Muscles worked: ${esc(musTop(v,6).map(([m])=>m).join(", ")||"none")}">${fig("front",0)}${fig("back",230)}</svg>`;
}
/* Canvas version for share images. h = figure height in px. */
function drawMuscleMap(x,cx,top,h,v,ink,hi){
  const k=h/412,w=430*k,ox=cx-w/2,max=Math.max(1,...Object.values(v));
  const draw=(key,dx)=>{for(const p of BODY[key]){const path=new Path2D(p.d),a=p.m&&v[p.m]?.35+.65*Math.min(1,v[p.m]/max):0;
    for(const mir of p.c?[0]:[0,1]){x.save();x.translate(ox+dx*k,top);x.scale(k,k);if(mir){x.translate(200,0);x.scale(-1,1);}
      if(a){x.globalAlpha=a;x.fillStyle=hi;x.fill(path);}else{x.globalAlpha=p.m?.16:.1;x.fillStyle=ink;x.fill(path);}
      x.restore();}}};
  draw("front",0);draw("back",230);x.globalAlpha=1;
}

      if(o.settings&&typeof o.settings==="object"){const keep=settings.share;settings={...settings,...o.settings,share:keep,updatedAt:now};pushSettings();}
      if(Array.isArray(o.places)){const have=new Set(places().map(x=>x.id));const add=o.places.filter(x=>x&&x.id&&x.name&&!have.has(x.id));if(add.length){settings.places=[...places(),...add];settings.updatedAt=now;pushSettings();}}

    }catch(e){const t=$("bk").value;if(!/^\s*[\[{]/.test(t)&&/,/.test(t.split("\n")[0]||"")){tryCSV(t);return;}$("berr").textContent="That text isn't a valid backup. Paste the whole thing, from the first { to the last }.";}
  };
}

function placeSessions(p){return live().filter(s=>s.placeId===p.id).sort((a,b)=>chrono(b,a));}
function renderPlaces(){

  const withStats=ps.map(p=>{const ss=placeSessions(p);return {p,ss,last:ss[0]};}).sort((a,b)=>(b.last?b.last.date:"").localeCompare(a.last?a.last.date:""));

      ${p.circuit&&p.circuit.length?`<div class="cdots">${p.circuit.map(c=>gm(c.name,c.color,"gm-xs")).join("")}</div>`:""}</div>
      ${ss.length?`<div class="cn">${ss.length}<small>${ss.length===1?"visit":"visits"}</small></div>`:`<div class="cn none"><small>Not yet</small></div>`}</button>`;
  }
  const untagged=live().filter(s=>!placeById(s.placeId)).length;
  if(untagged)html+=`<p class="hint">${untagged} workout${untagged===1?" has":"s have"} no place. Open one and tap Edit to add it.</p>`;
  return html;
}
function openPlace(p){
  if(!p)return;
  const ss=placeSessions(p),k=PLACE_KINDS[p.kind]||PLACE_KINDS.other;
  const time=ss.reduce((a,s)=>a+(s.dur||0),0),byType={};
  ss.forEach(s=>byType[s.type]=(byType[s.type]||0)+1);
  let html=`<h3>${esc(p.name)}</h3><p class="sub">${k[1]} ${k[0]}${ss.length?`, first visit ${fmtDate(ss[ss.length-1].date)}`:""}</p>
    <div class="dstats"><div class="n"><b>${ss.length}</b><span>Visits</span></div><div class="n"><b>${fmtTotalDur(time)}</b><span>Total time</span></div><div class="n"><b>${ss.length?fmtDate(ss[0].date,{month:"short",day:"numeric"}):"—"}</b><span>Last visit</span></div></div>`;
  if(Object.keys(byType).length>1)html+=`<p class="hint" style="margin-top:-6px">${Object.entries(byType).map(([t,n])=>`${n} ${TYPES[t].toLowerCase()}${n===1?"":t==="climb"?"s":"s"}`).join(", ")}</p>`;
  const climbs=ss.filter(s=>s.type==="climb"&&s.probs&&s.probs.length);
  if(climbs.length){
    const tot=climbs.reduce((a,s)=>a+sends(s).length,0),fl=climbs.reduce((a,s)=>a+flashes(s).length,0);
    html+=`<h4>Bouldering here</h4><div class="dstats"><div class="n"><b>${tot}</b><span>Sends</span></div><div class="n"><b>${fl}</b><span>Flashes</span></div><div class="n"><b>${tot?Math.round(fl/tot*100):0}%</b><span>Flash rate</span></div></div>`;
    const keys=[...new Set(climbs.map(sysKey))];
    for(const key of keys){
      const grp=climbs.filter(s=>sysKey(s)===key),smp=grp[0],list=gradeList(smp.gs||"v",smp.placeId),counts=list.map(()=>0);
      grp.forEach(s=>sends(s).forEach(q=>{if(counts[q.g]!=null)counts[q.g]++;}));
      const max=Math.max(...counts);if(!max)continue;

      html+=`<div class="chart" style="background:var(--bg)"><div style="font-size:.82rem;color:var(--muted);margin:0 0 8px 4px">${esc(sysName(smp))}</div><div class="pyr">${rows.map(r=>`<div><span style="font-weight:700">${r.g.color?`${gm(r.g.label,r.g.color,"gm-inl")} `:""}${esc(r.g.label)}</span><i style="width:${r.n/max*100}%"></i><em>${r.n}</em></div>`).join("")}</div></div>`;
    }
  }
  const runs=ss.filter(s=>s.type==="run"&&s.dist>=1&&s.dur);
  if(runs.length>=2){const b=best(runs,pace,true);html+=`<p class="hint">Fastest run pace here: ${fmtPace(b.v)} on ${fmtDate(b.s.date)}.</p>`;}
  const lifts=ss.filter(s=>s.type==="lift"&&volume(s));
  if(lifts.length>=2){const b=best(lifts,volume);html+=`<p class="hint">Biggest lifting session here: ${fmtVol(b.v)} on ${fmtDate(b.s.date)}.</p>`;}
  if(ss.length)html+=`<h4>Recent workouts</h4><div class="tlist">${ss.slice(0,10).map(s=>`<button class="trow" data-o="${s.id}"><span class="mdot" style="background:${col(s.type)};font-size:.7rem">${TYPES[s.type][0]}</span><div class="tx"><b>${esc(titleOf(s))}</b><span>${fmtDate(s.date)}</span></div><span class="tv" style="font-size:1.05rem">${esc((cardNums(s)[0]||["",""])[1])}</span></button>`).join("")}</div>`;
  else html+=`<div class="empty" style="background:var(--bg)">No workouts tagged here yet. Pick this place when adding a workout.</div>`;
  const defs=Object.entries(settings.defPlace||{}).filter(([,v])=>v===p.id).map(([t])=>TYPES[t].toLowerCase());
  if(defs.length)html+=`<p class="hint">Default place for ${defs.join(" and ")} sessions.</p>`;
  html+=`<div class="row"><button class="btn" id="pedit">Edit place</button><button class="btn primary" id="pclose">Close</button></div>`;
  openSheet(html);
  $("sheet").querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>openDetail(sessions[b.dataset.o]));
  $("pclose").onclick=closeSheet;$("pedit").onclick=()=>openPlaceEditor(p,()=>openPlace(placeById(p.id)));
}
