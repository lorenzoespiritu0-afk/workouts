<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workouts</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workouts">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>window.STANDALONE=true;</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#000000;--surface:#141416;--ink:#F5F5F7;--muted:#8E8E93;--line:#26272B;--chip:#1E1F23;
  --run:#4F8DFF;--walk:#A58BFF;--ride:#2FC48D;--lift:#E8A93A;--climb:#FF5C8A;--hike:#C99A5B;--hang:#FF8A4C;--other:#8E8E93;
  --gold:#F4B63F;--silver:#C0C6CF;--bronze:#C8834B;--xp:#F4B63F;--accent:#F4B63F;--accent2:#5AC8FA;
  --num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:inherit}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--run);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding:24px 18px calc(110px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-family:var(--num);font-weight:800;font-size:3.1rem;line-height:.95;margin:0;letter-spacing:-.01em}
.topr{display:flex;gap:12px;align-items:center}
.link{color:var(--muted);font-size:.92rem;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.lvpill{white-space:nowrap;background:var(--xp);color:#fff;font-family:var(--num);font-weight:700;font-size:1.05rem;padding:5px 12px;border-radius:999px}
.unit{font-size:.55em;font-weight:600;margin-left:3px;opacity:.75}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:999px;background:var(--chip);font-weight:600;font-size:.9rem;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface)}

.month{font-family:var(--num);font-weight:700;font-size:1.25rem;color:var(--muted);margin:22px 0 8px}
.card{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:14px;padding:14px 16px 14px 18px;margin-bottom:10px;position:relative;overflow:hidden}
.card.has-route{grid-template-columns:minmax(0,1fr) 78px}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.card .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .title{font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .date{color:var(--muted);font-size:.85rem;white-space:nowrap}
.card .nums{display:flex;gap:20px;margin-top:8px;flex-wrap:wrap}
.card .thumb{align-self:center;color:var(--c)}
.card.has-route .nums{gap:14px}
.card.has-route .n b{font-size:1.3rem}
.card .thumb svg{display:block;width:78px;height:62px}
.aw{display:flex;gap:12px;margin-top:9px;font-size:.85rem;color:var(--muted);align-items:center;flex-wrap:wrap}
.aw .xp{color:var(--xp);font-weight:700}
.n b{display:block;font-family:var(--num);font-weight:700;font-size:1.55rem;line-height:1;white-space:nowrap}
.n span{font-size:.75rem;color:var(--muted)}
.empty{background:var(--surface);border-radius:14px;padding:22px;color:var(--muted);line-height:1.5}
.empty strong{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:4px}

.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-weight:600;font-size:.88rem}
.seg button[aria-pressed=true]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 26px}
.tot{background:var(--surface);border-radius:14px;padding:14px 16px}
.tot b{display:block;font-family:var(--num);font-weight:800;font-size:clamp(1.6rem,7.5vw,2.1rem);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot span{color:var(--muted);font-size:.82rem}
h2.sec{font-family:var(--num);font-weight:700;font-size:1.6rem;margin:28px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.recs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rec{background:var(--surface);border-radius:14px;padding:14px 16px;text-align:left;width:100%}
.rec.wide{grid-column:1/-1}
.rec .l{font-size:.82rem;color:var(--muted)}
.rec .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--num);font-weight:800;font-size:clamp(1.6rem,7.5vw,2.5rem);line-height:1.02;margin:4px 0 2px;color:var(--c)}
.rec .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec.none .v{color:var(--line)}
.lifts{background:var(--surface);border-radius:14px;padding:6px 16px;margin-top:10px}
.liftrow{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;width:100%;text-align:left}
.liftrow:last-child{border-bottom:0}
.liftrow b{font-family:var(--num);font-size:1.4rem;font-weight:700;white-space:nowrap}
.liftrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.liftrow small{font-weight:500;font-size:.95rem;color:var(--muted)}
.chart{background:var(--surface);border-radius:14px;padding:14px 12px 8px;margin-top:10px}
.chart svg{display:block;width:100%;height:auto}

/* level & trophies */
.level{background:var(--surface);border-radius:18px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.lvnum{width:96px;height:96px;border-radius:50%;background:var(--xp);color:#fff;display:grid;place-items:center;text-align:center;line-height:.9}
.lvnum b{font-family:var(--num);font-weight:800;font-size:3rem;display:block}
.lvnum span{font-size:.7rem;font-weight:600;opacity:.85}
.rank{font-family:var(--num);font-weight:800;font-size:2rem;line-height:1}
.xpbar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin:10px 0 6px}
.xpbar span{display:block;height:100%;background:var(--xp);border-radius:5px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.xpinfo{font-size:.85rem;color:var(--muted)}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.medal{background:var(--surface);border-radius:14px;padding:12px;text-align:center}
.medal b{font-family:var(--num);font-weight:800;font-size:2rem;display:block;line-height:1;margin-top:4px}
.medal span{font-size:.78rem;color:var(--muted)}
.mdot{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-family:var(--num);font-weight:800;font-size:1rem;flex:none}
.m1{background:var(--gold)}.m2{background:var(--silver)}.m3{background:var(--bronze)}
.tlist{background:var(--surface);border-radius:14px;padding:4px 14px;margin-top:10px}
.trow{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.trow:last-child{border-bottom:0}
.trow .tx{flex:1;min-width:0}
.trow .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tx span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tv{font-family:var(--num);font-weight:700;font-size:1.25rem;white-space:nowrap}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.badge{background:var(--surface);border-radius:14px;padding:14px 8px 12px;text-align:center;width:100%}
.badge .ic{width:58px;height:58px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:linear-gradient(145deg,#FFD66B,#E2A400);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.badge b{display:block;font-size:.85rem;font-weight:700;line-height:1.2}
.badge span{display:block;font-size:.72rem;color:var(--muted);margin-top:3px}
.badge.locked .ic{background:var(--chip);filter:grayscale(1);opacity:.55;box-shadow:none}
.badge.locked b{color:var(--muted)}
.mini{height:4px;border-radius:2px;background:var(--chip);margin:6px 10px 0;overflow:hidden}
.mini i{display:block;height:100%;background:var(--muted)}

/* routes & segments */
.route{background:var(--bg);border-radius:14px;margin:4px 0 14px;color:var(--c);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px}
.route svg{display:block;width:100%;height:auto}
.segcard{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:10px;width:100%;text-align:left}
.segcard .thumb{color:var(--c)}
.segcard .thumb svg{display:block;width:90px;height:64px}
.segcard b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segcard span{font-size:.82rem;color:var(--muted)}
.segcard .best{font-family:var(--num);font-weight:800;font-size:1.6rem;text-align:right;line-height:1}
.segcard .best small{display:block;font-family:var(--font);font-weight:500;font-size:.72rem;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--c);padding:0;border:0;background:none}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr 1fr;align-items:center;padding:6px 4px}
nav .tab{padding:10px 0;font-weight:600;font-size:.8rem;color:var(--muted);white-space:nowrap}
nav .tab[aria-current=page]{color:var(--ink)}
nav .plus{background:var(--ink);color:var(--surface);font-weight:700;width:50px;height:50px;border-radius:50%;font-size:1.7rem;line-height:1;margin:0 4px}

.scrim{position:fixed;inset:0;background:rgba(8,10,16,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:94%;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(26px + env(safe-area-inset-bottom,0px));animation:up .22s ease;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.sheet,.celeb .big{animation:none!important}.xpbar span{transition:none}}
.sheet h3{font-family:var(--num);font-weight:800;font-size:2rem;margin:0 0 4px;line-height:1}
.sheet h4{font-family:var(--num);font-weight:700;font-size:1.3rem;margin:20px 0 6px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 16px}
label{display:block;font-size:.84rem;color:var(--muted);margin:14px 0 6px;font-weight:500}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid3 label,.grid2 label{margin-top:0}
.typepick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.typepick button{padding:10px 4px;border-radius:10px;background:var(--chip);font-weight:600;font-size:.86rem}
.typepick button[aria-pressed=true]{background:var(--c);color:#fff}
.gpx{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:12px;padding:12px;margin-bottom:6px}
.gpx .btn{flex:none;padding:11px 14px}
.gpx p{margin:0;font-size:.84rem;color:var(--muted);line-height:1.35}
.ex{background:var(--bg);border-radius:12px;padding:10px;margin-bottom:8px}
.ex .r{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-top:8px;align-items:end}
.ex input{background:var(--surface)}
.ex small{display:block;font-size:.72rem;color:var(--muted);margin-bottom:3px}
.x{width:40px;height:44px;border-radius:10px;color:var(--muted);font-size:1.2rem}
.addex{width:100%;padding:12px;border-radius:10px;border:2px dashed var(--line);color:var(--muted);font-weight:600}
details{margin-top:14px;background:var(--bg);border-radius:12px;padding:12px}
summary{cursor:pointer;font-weight:600;font-size:.92rem}
details .grid3{margin-top:10px}
details input{background:var(--surface)}
.hint{font-size:.8rem;color:var(--muted);margin:6px 0 0;line-height:1.45}
.err{color:#D13B4F;font-size:.88rem;margin-top:10px;min-height:1em}
.row{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:14px;border-radius:12px;font-weight:700;background:var(--chip)}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn.danger{color:#D13B4F}
.dstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;margin:6px 0 16px}
.dstats .n b{font-size:clamp(1.3rem,6.4vw,1.9rem);overflow:hidden;text-overflow:ellipsis}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:.8rem}
.notes{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;margin-top:14px;font-size:.95rem}
.xpchip{display:inline-block;background:var(--xp);color:#fff;font-weight:700;font-size:.85rem;padding:4px 10px;border-radius:999px}

.celeb{text-align:center}
.celeb .big{white-space:nowrap;font-family:var(--num);font-weight:800;font-size:clamp(3.2rem,17vw,5rem);line-height:1;color:var(--xp);animation:pop .6s ease both;margin:8px 0 2px}
.celeb .lvup{display:inline-block;margin-top:12px;background:var(--xp);color:#fff;font-weight:700;padding:8px 16px;border-radius:999px;animation:pop .6s .4s ease both}
.celeb .tlist,.celeb .badges{text-align:left}

.preview{border-radius:14px;padding:18px;display:grid;place-items:center;min-height:200px;
  background-color:#3b4250;background-image:linear-gradient(45deg,rgba(255,255,255,.06) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.06) 75%),linear-gradient(45deg,rgba(255,255,255,.06) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.06) 75%);background-size:24px 24px;background-position:0 0,12px 12px}
.preview.light{background-color:#e8eaee;background-image:linear-gradient(45deg,rgba(0,0,0,.05) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.05) 75%),linear-gradient(45deg,rgba(0,0,0,.05) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.05) 75%)}
.preview img{max-width:100%;max-height:52vh;display:block;-webkit-touch-callout:default}
.opts{display:grid;gap:10px;margin:14px 0 0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* v3 additions */
body.viewer nav{display:none}
body.viewer .wrap{padding-bottom:40px}
.banner{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:.88rem;color:var(--muted);margin-bottom:14px;line-height:1.45}
.ins{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px}
.ins h3{font-family:var(--num);font-weight:800;font-size:1.5rem;margin:0 0 4px}
.ins .bigv{font-family:var(--num);font-weight:800;font-size:3.2rem;line-height:1}
.ins .row2{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.gauge{position:relative;height:12px;border-radius:6px;margin:14px 0 6px;background:linear-gradient(90deg,#9AA3B0 0 40%,#0E9F6E 40% 65%,#E2A400 65% 75%,#D13B4F 75% 100%)}
.gauge i{position:absolute;top:-5px;width:4px;height:22px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.gscale{display:grid;grid-template-columns:40% 25% 10% 25%;font-size:.72rem;color:var(--muted)}
.gscale span:nth-child(3){white-space:nowrap}
.rec-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec-item:last-child{border-bottom:0}
.rec-item .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;flex:none;background:var(--chip)}
.rec-item b{display:block;margin-bottom:2px}
.rec-item span{font-size:.88rem;color:var(--muted);line-height:1.45}
.fb{background:var(--bg);border-radius:12px;padding:4px 14px;margin-top:8px}
.fb p{margin:0;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem;line-height:1.45}
.fb p:last-child{border-bottom:0}
.spark{display:block;width:100%;height:60px;color:var(--xp)}
.prob{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:10px}
.prob .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.prob .ph b{font-family:var(--num);font-size:1.3rem}
.gchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.gchips::-webkit-scrollbar{display:none}
.gchip{flex:none;min-width:42px;padding:8px 10px;border-radius:9px;background:var(--surface);font-weight:700;font-size:.85rem}
.gchip[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.cdot{flex:none;width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.cdot[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{padding:7px 11px;border-radius:999px;background:var(--surface);font-size:.82rem;font-weight:600}
.tchip[aria-pressed=true]{background:var(--c);color:#fff}
.plabel{font-size:.74rem;color:var(--muted);margin:10px 0 5px;font-weight:600}
.pyr{display:grid;gap:5px}
.pyr div{display:grid;grid-template-columns:92px 1fr 30px;gap:8px;align-items:center;font-size:.85rem}
.pyr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pyr i{display:block;height:16px;border-radius:4px;background:var(--climb)}
.pyr em{font-style:normal;color:var(--muted);text-align:right}
.rpe{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:4px}
.rpev{font-family:var(--num);font-weight:800;font-size:1.4rem;color:var(--ink)}
.swrow{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;background:var(--sw);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.circ{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.circ input[type=color]{width:44px;height:40px;padding:2px;flex:none}
.headbtns{display:flex;gap:8px}
.headbtns .chip{font-size:.85rem}

<script>
(function(){
/* ================= constants & helpers ================= */
const TYPES={run:"Run",walk:"Walk",hike:"Hike",ride:"Ride",lift:"Lift",climb:"Boulder",hang:"Hangboard",other:"Other"};
const DIST_TYPES=["run","walk","hike","ride","other"];
const EFFORTS={
  run:[[400,"400m"],[1000,"1K"],[1609.34,"1 mile"],[3218.69,"2 mile"],[5000,"5K"],[10000,"10K"],[21097.5,"Half marathon"],[42195,"Marathon"]],
  walk:[[1000,"1K"],[5000,"5K"],[10000,"10K"]],
  ride:[[10000,"10K"],[20000,"20K"],[40000,"40K"],[100000,"100K"]]
};
const KEY="workouts-v1",GKEY="workouts-segments-v1",SKEY="workouts-settings-v1";
const KM_MI=0.621371,KG_LB=2.20462,M_FT=3.28084;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseDate=k=>new Date(k+"T12:00:00");
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
const col=t=>`var(--${t})`;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const round=(n,d)=>{const p=Math.pow(10,d);return Math.round(n*p)/p};
function big(v){v=String(v);const i=v.lastIndexOf(" ");if(i>0&&!/\d/.test(v.slice(i+1)))return esc(v.slice(0,i))+'<span class="unit">'+esc(v.slice(i+1))+'</span>';return esc(v);}
const weekKey=k=>{const d=parseDate(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)};
function hav(a1,o1,a2,o2){const R=6371000,r=Math.PI/180;const dA=(a2-a1)*r,dO=(o2-o1)*r;const x=Math.sin(dA/2)**2+Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dO/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));}

let sessions={},segments={};
let settings={dist:"km",wt:"kg",bio:{},circuit:null,custom:null,share:{on:false,routes:false},places:[],defPlace:{},goals:[],projects:[],weights:[],events:[],checkins:{},routines:[],gear:[],pain:[],freezes:[],lt:{goals:[],days:3,mins:60,level:"intermediate",cautions:[],onboarded:false,lastCheck:0}};
let viewer=null; // read-only mode when someone else opens a shared link
let view="log",filter="all",period="week",chartMetric="dist",placeFilter="",logMode="list",calMonth=(()=>{const d=new Date();d.setDate(1);return d;})();
let remote=null;

/* ================= units & formatting ================= */
const dU=()=>settings.dist,wU=()=>settings.wt;
const toDispDist=km=>dU()==="mi"?km*KM_MI:km;
const fromDispDist=v=>dU()==="mi"?v/KM_MI:v;
const toDispWt=kg=>wU()==="lb"?kg*KG_LB:kg;
const fromDispWt=v=>wU()==="lb"?v/KG_LB:v;
const toDispElev=m=>dU()==="mi"?m*M_FT:m;
const fromDispElev=v=>dU()==="mi"?v/M_FT:v;
const elevU=()=>dU()==="mi"?"ft":"m";
const fmtDist=km=>toDispDist(km).toFixed(2)+" "+dU();
function fmtPace(secPerKm){let s=dU()==="mi"?secPerKm/KM_MI:secPerKm;s=Math.round(s);return Math.floor(s/60)+":"+pad(s%60)+" /"+dU();}
const fmtSpeed=(km,sec)=>(toDispDist(km)/(sec/3600)).toFixed(1)+(dU()==="mi"?" mph":" km/h");
function fmtDur(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}h ${pad(m)}m`:`${m}m ${pad(s)}s`;}
function fmtClock(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`;}
function fmtTotalDur(sec){const h=Math.floor(sec/3600),m=Math.round(sec%3600/60);return h?`${h}h ${m}m`:`${m}m`}
const fmtVol=kg=>Math.round(toDispWt(kg)).toLocaleString()+" "+wU();
const fmtWt=kg=>round(toDispWt(kg),1).toLocaleString()+" "+wU();
const fmtElev=m=>Math.round(toDispElev(m)).toLocaleString()+" "+elevU();
const fmtDate=(k,o)=>parseDate(k).toLocaleDateString(undefined,o||{month:"short",day:"numeric",year:"numeric"});
function parseClock(v){
  v=String(v||"").trim();if(!v)return null;
  const p=v.split(":").map(x=>num(x));if(p.some(x=>x==null))return null;
  if(p.length===1)return p[0]*60;
  if(p.length===2)return p[0]*60+p[1];
  return p[0]*3600+p[1]*60+p[2];
}

/* ================= session math ================= */
const live=()=>Object.values(sessions).filter(s=>!s.deleted);
const liveSegs=()=>Object.values(segments).filter(g=>!g.deleted);
function volume(s){
  if(s.type!=="lift")return 0;
  const ex=(s.ex||[]).filter(e=>e.sets&&e.reps&&e.w!=null);
  if(ex.length)return ex.reduce((a,e)=>a+e.sets*e.reps*e.w,0);
  return s.vol||0;
}
const totalSets=s=>(s.ex||[]).reduce((a,e)=>a+(e.sets||0),0);
const pace=s=>s.dist>0&&s.dur>0?s.dur/s.dist:null;
const hasTimes=s=>!!(s.track&&s.track.length>1&&s.track[0][3]!=null);
function defaultTitle(type,time){
  let part="";
  if(time){const h=+time.split(":")[0];part=h<5?"Night ":h<12?"Morning ":h<17?"Afternoon ":h<21?"Evening ":"Night ";}
  const name={run:"Run",walk:"Walk",hike:"Hike",ride:"Ride",lift:"Lifting session",climb:"Bouldering session",hang:"Hangboard session",other:"Workout"}[type];
  return cap(part+(part?name.toLowerCase():name));
}
const titleOf=s=>s.title||defaultTitle(s.type,s.time);
const chrono=(a,b)=>(a.date+(a.time||"99:99")).localeCompare(b.date+(b.time||"99:99"))||(a.created||0)-(b.created||0);


/* ================= bouldering ================= */
const VGRADES=["VB","V0","V1","V2","V3","V4","V5","V6","V7","V8","V9","V10","V11","V12","V13","V14","V15","V16","V17"];
const FGRADES=["3","4","4+","5","5+","6A","6A+","6B","6B+","6C","6C+","7A","7A+","7B","7B+","7C","7C+","8A","8A+","8B","8B+","8C","8C+","9A"];
const DEF_CIRCUIT=[{name:"White",color:"#F4F4F4"},{name:"Yellow",color:"#F5C518"},{name:"Green",color:"#2BAA5B"},{name:"Blue",color:"#2F6BFF"},{name:"Red",color:"#E03A3A"},{name:"Purple",color:"#8E44C9"},{name:"Black",color:"#1A1A1A"}];
const DEF_CUSTOM=["Easy","Moderate","Hard","Very hard","Elite"];
const GSYS={v:"V scale",font:"Font",color:"Color circuit",custom:"Custom"};
const STYLES=["Slab","Vertical","Overhang","Roof","Arête","Corner","Traverse","Comp style"];
const HOLDS=["Jugs","Crimps","Slopers","Pinches","Pockets","Edges","Underclings","Volumes","Jibs"];
const RESULTS={flash:"Flash",send:"Send",attempt:"Attempt"};
const PLACE_KINDS={climbgym:["Climbing gym","🧗"],mountain:["Mountain","⛰️"],gym:["Gym","🏋️"],crag:["Crag or boulders","🪨"],track:["Track","🏟️"],park:["Park","🌳"],trail:["Trail","🥾"],road:["Road route","🛣️"],pool:["Pool","🏊"],home:["Home","🏠"],other:["Other","📍"]};
const places=()=>settings.places||[];
const placeById=id=>id?places().find(p=>p.id===id):null;
const placeOf=s=>placeById(s.placeId);
const placeName=s=>{const p=placeOf(s);return p?p.name:(s.placeName||"");};
function circuitFor(placeId){const p=placeById(placeId);if(p&&p.circuit&&p.circuit.length)return p.circuit;return settings.circuit&&settings.circuit.length?settings.circuit:DEF_CIRCUIT;}
const sysKey=s=>(s.gs||"v")==="color"?"color:"+(s.placeId||""):(s.gs||"v");
function sysName(s){const gs=s.gs||"v";if(gs!=="color")return GSYS[gs];const n=placeName(s);return n&&placeOf(s)&&placeOf(s).circuit?n+" circuit":n?"Color circuit at "+n:"Color circuit";}
function defaultPlaceFor(type){
  const d=settings.defPlace&&settings.defPlace[type];if(d&&placeById(d))return d;
  const last=live().filter(s=>s.type===type&&s.placeId&&placeById(s.placeId)).sort(chrono).pop();
  return last?last.placeId:"";
}
function gradeList(gs,placeId){
  if(gs==="v")return VGRADES.map(l=>({label:l}));
  if(gs==="font")return FGRADES.map(l=>({label:l}));
  if(gs==="color")return circuitFor(placeId).map(c=>({label:c.name,color:c.color}));
  return (settings.custom&&settings.custom.length?settings.custom:DEF_CUSTOM).map(l=>({label:l}));
}
const sends=s=>(s.probs||[]).filter(p=>p.res!=="attempt");
const flashes=s=>(s.probs||[]).filter(p=>p.res==="flash");
function hardest(s){let b=null;for(const p of sends(s))if(b==null||p.g>b.g)b=p;return b;}
const diffOf=(gs,g,len)=>len>1?g/(len-1):0;
function climbPoints(s){return sends(s).reduce((a,p)=>a+p.g+1+(p.res==="flash"?1:0),0);}
const gradeLabel=p=>p?p.gl:"—";

/* ================= lifting ================= */
const MUSCLES=["Chest","Back","Shoulders","Biceps","Triceps","Legs","Glutes","Core","Calves","Full body"];
const MUSCLE_HINTS=[[/bench|chest|fly|flye|push.?up|dip|pec/i,["Chest","Triceps"]],[/squat|leg press|lunge|split|step.?up|leg ext|hack/i,["Legs","Glutes"]],[/deadlift|rdl|romanian|good morning|hip thrust|glute/i,["Glutes","Legs","Back"]],[/row|pull.?up|chin|lat|pulldown|shrug/i,["Back","Biceps"]],[/overhead|ohp|shoulder|military|lateral|raise|arnold|face pull/i,["Shoulders"]],[/curl/i,["Biceps"]],[/tricep|skull|pushdown|extension|close.?grip/i,["Triceps"]],[/plank|crunch|ab|core|sit.?up|leg raise|russian|pallof/i,["Core"]],[/calf|calves/i,["Calves"]],[/clean|snatch|thruster|burpee|kettlebell swing|swing/i,["Full body"]],[/hamstring|leg curl/i,["Legs"]]];
function guessMuscles(name){for(const [re,m] of MUSCLE_HINTS)if(re.test(name||""))return [...m];return [];}

function projector(pts,w,h,padd){

function ltProgress(g){

  const rel=(v,base,t)=>t===base?(v>=t?1:0):Math.max(0,Math.min(1,(v-base)/(t-base)));
  switch(g.kind){
    case "race":{const D=RACE_D[g.dist][1];const dr=Math.min(1,c.longest*1000/(D*0.85));
      if(g.time){const base=g.base&&g.base>g.time?g.base:(c.pred&&c.pred>g.time?c.pred*1.05:g.time*1.08);const sp=c.pred?Math.max(0,Math.min(1,(base-c.pred)/(base-g.time))):0;pct=c.done?1:Math.min(0.95,dr*0.3+sp*0.7);cur=c.pred?`Predicted ${fmtClock(c.pred)}`:"Log some runs with best efforts";tgt=`${RACE_D[g.dist][0]} in ${fmtClock(g.time)}`;}
      else{pct=c.done?1:Math.min(0.95,dr);cur=`Longest recent run ${fmtDist(c.longest)}`;tgt=`Finish a ${RACE_D[g.dist][0]}`;}
      break;}
    case "grade":{const L=gradeList(g.gs,g.placeId);pct=rel(c.v,g.base??-1,g.g);cur=c.v>=0?`Hardest send ${L[c.v]?L[c.v].label:"?"}`:"No sends yet";tgt=`Send ${L[g.g]?L[g.g].label:"?"}`;break;}
    case "lift":pct=rel(c.v,g.base||0,g.target);cur=c.v?`Est. 1RM ${fmtWt(c.v)}`:"Not logged yet";tgt=`${g.ex} ${fmtWt(g.target)}`;break;
    case "ftp":pct=rel(c.v,g.base||0,g.target);cur=c.v?`FTP ${c.v} W`:"Add FTP or 20-min power";tgt=`${g.target} W`;break;
    case "ride":pct=Math.min(1,c.v/g.target);cur=`Longest ride ${fmtDist(c.v)}`;tgt=`Ride ${fmtDist(g.target)}`;break;
    case "summit":pct=c.done?1:Math.min(0.95,g.elev?Math.max(c.longest/(g.gain||Math.max(500,g.elev*0.4)),c.hi/g.elev)*0.9:Math.min(1,c.longest/800)*0.9);cur=c.done?"Summited!":`Biggest hike climb ${fmtElev(c.longest)}`;tgt=g.name||"Summit";break;
    case "weight":{const st=g.base,t=g.target,v=c.v;pct=v==null||st===t?0:Math.max(0,Math.min(1,(st-v)/(st-t)));cur=v?`Now ${fmtWt(v)}`:"Log your weight";tgt=fmtWt(t);break;}
    case "habit":pct=Math.min(1,c.v/g.weeks);cur=`${c.v} week${c.v===1?"":"s"} in a row`;tgt=`${g.per}+ workouts a week for ${g.weeks} weeks`;break;
    case "vo2":pct=rel(c.v,g.base||0,g.target);cur=c.v?`Now ${Math.round(c.v)}`:"Not enough data";tgt=`VO2max ${g.target}`;break;
  }
  const done=!!g.done||pct>=1;
  const t0=parseDate(g.start).getTime(),t1=parseDate(g.date).getTime(),now=Date.now();
  const tpct=Math.max(0,Math.min(1,(now-t0)/Math.max(1,t1-t0)));
  const daysLeft=Math.ceil((t1-now)/864e5);
  const status=done?"done":daysLeft<0?"overdue":pct>=tpct-0.12?"ontrack":"behind";
  return {pct:done?1:pct,cur,tgt,tpct,daysLeft,status};
}
function ltBase(g){const c=ltCurrent(g);if(g.kind==="race")return c.pred?Math.round(c.pred):null;if(g.kind==="weight")return c.v;if(g.kind==="grade")return c.v;return c.v||0;}
function checkLongGoals(){
  if(viewer)return;
  const newly=[];
  for(const g of longGoals()){if(g.done)continue;const pr=ltProgress(g);if(pr.pct>=1){g.done=keyOf(new Date());newly.push(g);}}
  if(newly.length){settings.updatedAt=Date.now();invalidate();saveLocal();pushSettings();render();setTimeout(()=>celebrateGoal(newly[0]),300);}
}

function baselineBefore(start,list){

}

function challengesFor(kind,key,list,cache){
  const ck=kind+key;if(cache&&cache.has(ck))return cache.get(ck);
  const [start]=periodRange(kind,key),b=baselineBefore(start,list),f=kind==="month"?4.3:1,rnd=seeded(ck);
  const pool=CH_TEMPLATES.filter(t=>t.ok(b)).map(t=>({t,r:rnd()+(t.type&&b.types.has(t.type)?0.25:0)})).sort((a,c)=>c.r-a.r);
  const out=[],usedM=new Set();
  for(const {t} of pool){if(out.length>=3)break;const mk=t.m+(t.type||"");if(usedM.has(mk))continue;usedM.add(mk);const target=t.t(b,f);out.push({id:t.id,m:t.m,type:t.type,target,label:t.l(target),xp:CH_XP[kind],kind,key});}
  if(cache)cache.set(ck,out);return out;
}
function chalValue(ch,L){
  const T=ch.type?L.filter(s=>s.type===ch.type):L;
  switch(ch.m){
    case "sessions":return L.length;
    case "minutes":return L.reduce((a,s)=>a+(s.dur||0)/60,0);
    case "days":return new Set(L.map(s=>s.date)).size;
    case "dist":return T.reduce((a,s)=>a+(s.dist||0),0);
    case "sends":return L.reduce((a,s)=>a+(s.type==="climb"?sends(s).length:0),0);
    case "count":return T.length;
    case "vol":return L.reduce((a,s)=>a+volume(s),0);
    case "elev":return L.reduce((a,s)=>a+(s.type!=="lift"&&s.type!=="climb"?s.elev||0:0),0);
    case "types":return new Set(L.map(s=>s.type)).size;
    case "long":return Math.max(0,...L.map(s=>(s.dur||0)/60));
    case "early":return L.filter(s=>s.time&&s.time<"07:00").length;
    case "hard":return L.filter(s=>(s.rpe||0)>=8).length;
  }
  return 0;
}
function fmtChal(ch,v){
  if(ch.m==="dist")return round(toDispDist(v),1)+"/"+round(toDispDist(ch.target),0)+" "+dU();
  if(ch.m==="minutes"||ch.m==="long")return Math.round(v)+"/"+ch.target+" min";
  if(ch.m==="vol")return Math.round(toDispWt(v)).toLocaleString()+"/"+Math.round(toDispWt(ch.target)).toLocaleString()+" "+wU();
  if(ch.m==="elev")return Math.round(toDispElev(v))+"/"+Math.round(toDispElev(ch.target))+" "+elevU();
  return Math.min(Math.round(v),ch.target)+"/"+ch.target;
}

function cats(s){
  const out=[],T=TYPES[s.type].toLowerCase();
  if(s.type!=="lift"&&s.type!=="climb"&&s.dist>0)out.push({key:"long-"+s.type,kind:"longest",noun:T,value:s.dist,dir:1,fmt:fmtDist});
  if(s.dur>0)out.push({key:"dur-"+s.type,kind:"longest",noun:s.type==="lift"?"lifting session":s.type==="climb"?"bouldering session":T+" by time",value:s.dur,dir:1,fmt:fmtDur});
  if((s.type==="run"||s.type==="walk")&&s.dist>=1&&s.dur>0)out.push({key:"pace-"+s.type,kind:"fastest",noun:T+" pace",value:s.dur/s.dist,dir:-1,fmt:fmtPace});
  if(s.type==="ride"&&s.dist>=5&&s.dur>0)out.push({key:"speed-ride",kind:"fastest",noun:"ride speed",value:s.dist/(s.dur/3600),dir:1,fmt:v=>fmtSpeed(v,3600)});
  if(s.type!=="lift"&&s.type!=="climb"&&s.elev>0)out.push({key:"climb-"+s.type,kind:"biggest",noun:T+" climb",value:s.elev,dir:1,fmt:fmtElev});
  if(s.maxEle!=null&&s.type!=="lift"&&s.type!=="climb")out.push({key:"alt",kind:"highest",noun:"elevation reached",value:s.maxEle,dir:1,fmt:fmtElev});
  for(const [D,name] of EFFORTS[s.type]||[]){const v=s.efforts&&s.efforts[String(D)];if(v>0)out.push({key:`eff-${s.type}-${D}`,kind:"fastest",noun:name,value:v,dir:-1,fmt:fmtClock,pr:true,sub:s.type==="ride"?fmtSpeed(D/1000,v):fmtPace(v/(D/1000))});}

function saveLocal(){

const writing={};
async function writeDoc(key,ref,getData){
  if(writing[key]){writing[key].again=true;return;}
  writing[key]={again:false};
  try{const d=getData();if(d)await ref.set(d);else await ref.delete();}
  catch(e){
    if(e&&e.code==="quota_exceeded")toast("Cloud storage is full. Your data is still saved on this device.");
    else if(e&&e.code==="unavailable"){delete writing[key];setTimeout(()=>writeDoc(key,ref,getData),1500+Math.random()*1500);return;}
  }
  const again=writing[key].again;delete writing[key];
  if(again)writeDoc(key,ref,getData);
}

async function enterViewer(db){

  settings={...settings,service:(prof&&prof.service)||[],dist:(prof&&prof.dist)||"km",wt:(prof&&prof.wt)||"kg",circuit:(prof&&prof.circuit)||null,custom:(prof&&prof.custom)||null,bio:{},share:{on:false},places:[],defPlace:{},goals:[],projects:[],weights:[]};

async function initRemote(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    if(!(await user.isOwner())){await enterViewer(db);return;}
    const id=await user.id();if(!id)return;
    const c=db.collection("data/users/"+id);
    const snap=await c.limit(1000).get();
    remote={col:c,db};
    const seenS=new Set(),seenG=new Set();let changed=false;
    for(const d of snap.docs){
      const body=d.data();if(!body)continue;
      if(d.id==="settings"){
        if((body.updatedAt||0)>(settings.updatedAt||0)){const {updatedAt,...rest}=body;settings={...settings,...JSON.parse(JSON.stringify(rest)),updatedAt};changed=true;}
        continue;
      }
      const kind=d.id.slice(0,2),store=kind==="s_"?sessions:kind==="g_"?segments:null;if(!store)continue;
      (kind==="s_"?seenS:seenG).add(body.id);
      const loc=store[body.id];
      if(!loc||(body.updatedAt||0)>(loc.updatedAt||0)){store[body.id]=JSON.parse(JSON.stringify(body));changed=true;}
      else if((loc.updatedAt||0)>(body.updatedAt||0))pushItem(kind,store,body.id);
    }
    for(const s of Object.values(sessions))if(!seenS.has(s.id))pushItem("s_",sessions,s.id);
    for(const g of Object.values(segments))if(!seenG.has(g.id))pushSegment(g);
    if(settings.share&&settings.share.on){profilePush();for(const s of Object.values(sessions))feedPush(s);}
    if(changed){invalidate();saveLocal();render();}
  }catch(e){remote=null}
}

  if(!live().length)return html+`<div class="empty"><strong>No workouts yet</strong>Tap + to add one. Type in the numbers from Strava, Hevy, or any other app, or import a GPX file to get your route, best efforts, and elevation automatically. Every workout earns XP, and new bests earn medals.</div>`;
  if(!list.length)return html+`<div class="empty"><strong>Nothing matches these filters</strong>Pick "All" and "All places" to see everything you've logged.</div>`;
  let month="";

    if(m!==month){html+=`<div class="month">${m}</div>`;month=m;}
    const rt=s.track&&s.track.length>1;
    html+=`<button class="card${rt?" has-route":""}" style="--c:${col(s.type)}" data-open="${s.id}"><div>

  }
  return html;
}

function periodStart(p){
  const t=new Date();t.setHours(0,0,0,0);
  if(p==="week"){t.setDate(t.getDate()-((t.getDay()+6)%7));return keyOf(t);}
  if(p==="month"){t.setDate(1);return keyOf(t);}
  return "0000-00-00";
}
function best(list,score,minimize){
  let b=null,bv=null;
  for(const s of list){const v=score(s);if(v==null||!isFinite(v))continue;if(b===null||(minimize?v<bv:v>bv)){b=s;bv=v;}}
  return b?{s:b,v:bv}:null;
}
function recCard(label,r,fmt,type,wide){
  if(!r)return `<div class="rec none${wide?" wide":""}" style="--c:${col(type)}"><div class="l">${label}</div><div class="v">—</div><div class="s">Not logged yet</div></div>`;
  return `<button class="rec${wide?" wide":""}" style="--c:${col(type)}" data-open="${r.s.id}"><div class="l">${label}</div><div class="v">${big(fmt(r.v))}</div><div class="s">${esc(titleOf(r.s))}, ${fmtDate(r.s.date)}</div></button>`;
}
function renderRecords(){

  html+=`<h2 class="sec" style="--c:var(--lift)"><i></i>Lifting</h2><div class="recs">

function renderChart(all){
  const weeks=12,t=new Date();t.setHours(0,0,0,0);
  const mon=new Date(t);mon.setDate(t.getDate()-((t.getDay()+6)%7));
  const buckets=[];
  for(let i=weeks-1;i>=0;i--){const s=addDays(mon,-7*i);buckets.push({s:keyOf(s),e:keyOf(addDays(s,7)),label:s,v:0});}
  for(const x of all){
    const b=buckets.find(b=>x.date>=b.s&&x.date<b.e);if(!b)continue;
    if(chartMetric==="dist"&&DIST_TYPES.includes(x.type))b.v+=toDispDist(x.dist||0);
    if(chartMetric==="vol")b.v+=toDispWt(volume(x));
    if(chartMetric==="time")b.v+=(x.dur||0)/3600;
  }
  const max=Math.max(...buckets.map(b=>b.v),0),W=600,H=170,pb=22,pt=18,bw=W/weeks;
  const color=chartMetric==="dist"?"var(--run)":chartMetric==="vol"?"var(--lift)":"var(--walk)";
  const fmt=v=>chartMetric==="time"?round(v,1)+"h":chartMetric==="vol"?(v>=1000?round(v/1000,1)+"k":Math.round(v)):round(v,1);
  let bars="";
  buckets.forEach((b,i)=>{
    const h=max?(b.v/max)*(H-pb-pt):0,x=i*bw+bw*.18,w=bw*.64,y=H-pb-h;
    bars+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,b.v?2:0)}" rx="4" fill="${color}" opacity="${i===weeks-1?1:.55}"/>`;
    if(b.v&&(i===weeks-1||b.v===max))bars+=`<text x="${x+w/2}" y="${y-5}" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" font-family="Barlow Condensed,Arial Narrow,sans-serif">${fmt(b.v)}</text>`;
    if(i%3===0||i===weeks-1)bars+=`<text x="${x+w/2}" y="${H-5}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Barlow,system-ui,sans-serif">${i===weeks-1?"This wk":b.label.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</text>`;
  });
  const unit=chartMetric==="dist"?dU():chartMetric==="vol"?wU():"hours";
  return `<div class="seg" role="group" aria-label="Chart metric">${[["dist","Distance"],["vol","Volume"],["time","Time"]].map(([k,v])=>`<button data-metric="${k}" aria-pressed="${chartMetric===k}">${v}</button>`).join("")}</div>
  <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly ${unit}, last 12 weeks">${bars}</svg></div>
  <p class="hint">Weekly ${chartMetric==="dist"?"distance ("+unit+")":chartMetric==="vol"?"weight lifted ("+unit+")":"training time"} over the last 12 weeks.</p>`;
}

    if($("f-summit"))$("f-summit").onclick=()=>{d.summit=!d.summit;$("f-summit").setAttribute("aria-pressed",d.summit);};
    sh0.querySelectorAll("[data-rest]").forEach(b=>b.onclick=()=>startRest(+b.dataset.rest));
    sh0.querySelectorAll("[data-mu]").forEach(b=>b.onclick=()=>{const k=b.dataset.mu.indexOf(":"),i=+b.dataset.mu.slice(0,k),m=b.dataset.mu.slice(k+1);const e=d.ex[i];if(!e)return;e.mus=e.mus||[];const j=e.mus.indexOf(m);if(j>=0)e.mus.splice(j,1);else e.mus.push(m);b.setAttribute("aria-pressed",j<0);});
    sh0.querySelectorAll(".exn").forEach((inp,i)=>inp.onchange=()=>{const e=d.ex[i];if(e&&(!e.mus||!e.mus.length)){e.mus=guessMuscles(inp.value);sh0.querySelectorAll(`[data-mu^="${i}:"]`).forEach(z=>z.setAttribute("aria-pressed",e.mus.includes(z.dataset.mu.split(":")[1])));}});
    sh0.querySelectorAll(".pproj").forEach(sel=>sel.onchange=()=>{
      read();const i=+sel.dataset.i,q=d.probs[i],v=sel.value,L=gradeList(d.gs,d.placeId);
      if(v==="__new"){const gl=L[q.g]?L[q.g].label:"?";const pr={id:uid(),name:q.name||(gl+" project"+(placeById(d.placeId)?" at "+placeById(d.placeId).name:"")),gs:d.gs,placeId:d.placeId||"",g:q.g,gl,gc:L[q.g]&&L[q.g].color||null,notes:"",created:Date.now(),archived:false};settings.projects=[...projects(),pr];settings.updatedAt=Date.now();saveLocal();pushSettings();q.proj=pr.id;if(!q.name)q.name=pr.name;toast("Project saved");}
      else if(v){const pr=projById(v);q.proj=v;if(pr){if(!q.name)q.name=pr.name;if(pr.gs===d.gs&&(pr.placeId||"")===(d.placeId||"")&&pr.g<L.length)q.g=pr.g;}}
      else{delete q.proj;}
      draw();
    });
    const wk=()=>{const h=$("wkghint");if(!h||!bio().weight)return;const p=num($("f-pw").value);h.textContent=p?`${(p/bio().weight).toFixed(2)} W/kg at ${fmtWt(bio().weight)}${bio().ftp?`, ${Math.round(p/bio().ftp*100)}% of FTP`:""}`:"";};
    if($("f-pw")){$("f-pw").oninput=wk;wk();}
    if(d.type==="climb"){
      const list=gradeList(d.gs,d.placeId);
      const sum=()=>{const n=d.probs.filter(p=>p.res!=="attempt").length,f=d.probs.filter(p=>p.res==="flash").length;let h=null;d.probs.forEach(p=>{if(p.res!=="attempt"&&(h==null||p.g>h))h=p.g;});$("csum").textContent=`${n} sent of ${d.probs.length}${f?`, ${f} flashed`:""}${h!=null?`, hardest ${list[h].label}`:""}`;};
      sum();
      const sh=$("sheet");
      const press=(sel,b,on)=>{if(on===undefined){sh.querySelectorAll(sel).forEach(z=>z.setAttribute("aria-pressed",z===b));}else b.setAttribute("aria-pressed",on);};
      sh.querySelectorAll("[data-gs]").forEach(b=>b.onclick=()=>{read();d.gs=b.dataset.gs;const L=gradeList(d.gs,d.placeId).length;d.probs.forEach(p=>p.g=Math.min(p.g,L-1));draw();});
      sh.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{const [i,g]=b.dataset.pg.split(":").map(Number);d.probs[i].g=g;press(`[data-pg^="${i}:"]`,b);$("ph"+i).textContent=(i+1)+". "+list[g].label;sum();});
      sh.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>{const [i,r]=b.dataset.pr.split(":");d.probs[+i].res=r;press(`[data-pr^="${i}:"]`,b);if(r==="flash"){d.probs[+i].att=1;const a=sh.querySelector(`.patt[data-i="${i}"]`);if(a)a.value=1;}sum();});
      sh.querySelectorAll("[data-ps]").forEach(b=>b.onclick=()=>{const k=b.dataset.ps.indexOf(":"),i=+b.dataset.ps.slice(0,k),x=b.dataset.ps.slice(k+1);const p=d.probs[i];p.style=p.style===x?null:x;sh.querySelectorAll(`[data-ps^="${i}:"]`).forEach(z=>z.setAttribute("aria-pressed",z.dataset.ps===i+":"+p.style));});
      sh.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{const k=b.dataset.ph.indexOf(":"),i=+b.dataset.ph.slice(0,k),x=b.dataset.ph.slice(k+1);const p=d.probs[i];p.holds=p.holds||[];const j=p.holds.indexOf(x);if(j>=0)p.holds.splice(j,1);else p.holds.push(x);press(null,b,j<0);});
      sh.querySelectorAll("[data-prm]").forEach(b=>b.onclick=()=>{read();d.probs.splice(+b.dataset.prm,1);if(!d.probs.length)d.probs.push(newProb());draw();});
      sh.querySelectorAll("[data-pdup]").forEach(b=>b.onclick=()=>{read();const p=d.probs[+b.dataset.pdup];d.probs.splice(+b.dataset.pdup+1,0,{...JSON.parse(JSON.stringify(p)),name:""});draw();});
      $("addprob").onclick=()=>{read();d.probs.push(newProb());draw();const ps=document.querySelectorAll(".prob");ps[ps.length-1].scrollIntoView({block:"nearest"});};
    }
    $("f-time").onchange=()=>{$("f-title").placeholder=defaultTitle(d.type,$("f-time").value)};
    if($("addex"))$("addex").onclick=()=>{read();d.ex.push({name:"",sets:null,reps:null,w:null});draw();const l=document.querySelectorAll(".exn");l[l.length-1].focus();};
    $("sheet").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{read();d.ex.splice(+b.dataset.rm,1);draw();});
    if($("rmroute"))$("rmroute").onclick=()=>{read();d.track=null;d.maxEle=null;d.elapsed=null;draw();};
    if($("importgpx"))$("importgpx").onclick=()=>{
      read();const fi=$("gpxfile");fi.value="";fi.accept="";
      fi.onchange=async()=>{
        const f=fi.files&&fi.files[0];if(!f)return;
        try{
          const g=parseTrack(await f.text());
          if(g.points.length<2)throw new Error("few");
          const a=analyze(g.points);
          d.type=guessType(g.type,a);
          if(!d.title&&g.name)d.title=g.name.slice(0,60);
          if(a.start){d.date=keyOf(a.start);d.time=pad(a.start.getHours())+":"+pad(a.start.getMinutes());}
          if(a.moving||a.elapsed)d.dur=Math.round(a.moving||a.elapsed);
          d.elapsed=a.elapsed?Math.round(a.elapsed):null;d.dist=round(a.dist/1000,3);
          d.elev=a.gain!=null?Math.round(a.gain):d.elev;d.maxEle=a.maxEle!=null?Math.round(a.maxEle):null;
          d.efforts=a.efforts;d.track=a.track;d.eloss=a.loss;
          if(d.type==="hike"){d.rests=a.rests;d.restSec=a.restSec;}
          if(a.avgHr)d.hr=a.avgHr;if(a.avgPw){d.pw=a.avgPw;d.np=a.np;d.p20=a.p20;d.pmax=a.pmax;}
          draw();toast(a.start?"Route imported":"Route imported. This file has no timestamps, so add the time yourself.");
        }catch(e){$("ferr").textContent="That file couldn't be read as a GPX or TCX route. Export it again as GPX and try once more.";}
      };
      fi.click();
    };
    $("fcancel").onclick=closeSheet;
    $("fsave").onclick=()=>{
      read();
      if(!(d.dur>0)){$("ferr").textContent="Add the workout's duration first.";$("f-m").focus();return;}
      if(d.type==="lift"||d.type==="climb"){d.dist=null;d.elev=null;d.track=null;d.maxEle=null;d.efforts={};}
      if(d.type==="lift")d.ex=d.ex.filter(e=>e.name||e.sets||e.reps||e.w!=null);else{d.ex=[];d.vol=null;}
      d.placeName=placeById(d.placeId)?placeById(d.placeId).name:"";if(!d.placeId)d.placeId="";
      {const dp={...(settings.defPlace||{})};let ch=false;if(makeDefault&&d.placeId&&dp[d.type]!==d.placeId){dp[d.type]=d.placeId;ch=true;}else if(!makeDefault&&dp[d.type]&&dp[d.type]===d.placeId){delete dp[d.type];ch=true;}if(ch){settings.defPlace=dp;settings.updatedAt=Date.now();saveLocal();pushSettings();}}
      if(d.type==="climb"){const L=gradeList(d.gs,d.placeId);d.probs=d.probs.map(p=>({...p,gl:L[p.g]?L[p.g].label:"?",gc:L[p.g]&&L[p.g].color||null}));}else{d.probs=[];}
      if(d.type!=="ride"){d.pw=d.np=d.p20=d.pmax=null;}
      if(d.type!=="hike"){delete d.rests;delete d.restSec;delete d.pack;delete d.diff;delete d.cond;delete d.summit;delete d.eloss;}
      if(!["run","walk","hike"].includes(d.type))delete d.steps;
      if(d.type!=="hang")delete d.hangs;else d.hangs=d.hangs.filter(h=>h.hang&&h.sets);
      if(d.gearId&&!(gearById(d.gearId)&&(gearById(d.gearId).types||[]).includes(d.type)))d.gearId="";
      if(d._photo){const blob=d._photo;delete d._photo;d.photo=true;photoPut(d.id,blob).then(ok=>{if(!ok)toast("Photo couldn't be saved on this device");delete photoURLs[d.id];});}
      if(d._photoDel){delete d._photoDel;photoDel(d.id);delete photoURLs[d.id];}
      if(d.type!=="lift"&&d.type!=="climb"&&!EFFORTS[d.type])d.efforts={};
      if(d.type==="ride"&&bio().weight&&(!existing||!d.bw))d.bw=bio().weight;
      const beforeXP=getC().xp;
      upsert(d);
      if(existing){closeSheet();toast("Changes saved");}else celebrate(d.id,beforeXP);
    };
  };
  draw();
}

/* ---------- celebration ---------- */
function medalRows(r){
  return r.medals.map(m=>`<div class="trow"><span class="mdot m${m.rank}">${m.rank}</span><div class="tx"><b>${esc(m.label)}</b>${m.sub?`<span>${esc(m.sub)}</span>`:""}</div><span class="tv">${big(m.value)}</span></div>`).join("")
   +(r.ymedals||[]).map(m=>`<div class="trow"><span class="mdot m${m.rank}" style="opacity:.55">${m.rank}</span><div class="tx"><b>${esc(m.label)}</b>${m.sub?`<span>${esc(m.sub)}</span>`:""}</div><span class="tv">${big(m.value)}</span></div>`).join("");
}
function celebrate(id,beforeXP){
  const c=getC(),r=c.by[id],s=sessions[id];if(!r){closeSheet();return;}
  const L0=levelOf(beforeXP),L1=levelOf(c.xp),a=xpForLevel(L1),b=xpForLevel(L1+1);
  const startPct=L1>L0?0:Math.max(0,(beforeXP-a)/(b-a)*100),endPct=(c.xp-a)/(b-a)*100;
  openSheet(`<div class="celeb" style="--c:${col(s.type)}">
    <p class="sub" style="margin:0">${esc(titleOf(s))} saved</p>
    <div class="big">+${r.xp} XP</div>
    <div class="rank" style="font-size:1.4rem">Level ${L1}, ${rankOf(L1)}</div>
    <div class="xpbar" style="max-width:340px;margin:10px auto 6px"><span id="cxp" style="width:${startPct}%"></span></div>
    <div class="xpinfo">${(b-c.xp).toLocaleString()} XP to level ${L1+1}</div>
    ${L1>L0?`<div class="lvup">Level up! You reached level ${L1}</div>`:""}
    ${r.acc.length?`<h4>New accolade${r.acc.length>1?"s":""}</h4><div class="badges">${r.acc.map(A=>badgeHTML(A,c.earned[A.id],c)).join("")}</div>`:""}
    ${r.projects.length?`<h4>Project sent!</h4><div class="tlist">${r.projects.map(x=>`<div class="trow"><span class="mdot" style="background:var(--climb)">🎯</span><div class="tx"><b>${esc(x.name)}</b><span>After ${x.attempts} attempt${x.attempts===1?"":"s"}</span></div><span class="tv">${esc(x.grade||"")}</span></div>`).join("")}</div>`:""}
    ${r.quest?`<div class="trow" style="justify-content:center;border:0"><span class="xpchip" style="background:var(--ride)">🎯 Daily quest done: ${esc(r.quest.t)}, +${r.quest.xp} XP</span></div>`:""}
    ${L1>=40&&!viewer?`<div class="row" style="margin-top:6px"><button class="btn" id="csv" style="background:var(--gold);color:#fff">🏅 Service medal available</button></div>`:""}
    ${r.chal.length?`<h4>Challenge${r.chal.length>1?"s":""} complete</h4><div class="tlist">${r.chal.map(ch=>`<div class="trow"><span class="mdot" style="background:${tierBg(ch.xp)}">${ch.kind==="week"?"W":"M"}</span><div class="tx"><b>${esc(ch.label)}</b><span>${ch.kind==="week"?"Weekly":"Monthly"} challenge, +${ch.xp} XP</span></div></div>`).join("")}${r.perfect.map(pf=>`<div class="trow"><span class="mdot" style="background:${tierBg(CH_BONUS[pf.kind])}">🌟</span><div class="tx"><b>Perfect ${pf.kind}!</b><span>All 3 challenges done, +${CH_BONUS[pf.kind]} XP</span></div></div>`).join("")}</div>`:""}
    ${r.goals.length?`<h4>Weekly goal${r.goals.length>1?"s":""} reached</h4><div class="tlist">${r.goals.map(g=>`<div class="trow"><span class="mdot" style="background:var(--ride)">✓</span><div class="tx"><b>${esc(goalLabel(g))}</b><span>Target ${esc(fmtGoal(g,g.target))}</span></div></div>`).join("")}</div>`:""}
    ${r.medals.length||(r.ymedals||[]).length?`<h4>Medals</h4><div class="tlist">${medalRows(r)}</div><div class="row"><button class="btn" id="cpr">Share PRs as image</button></div>`:""}
    <h4>Feedback</h4><div class="fb" style="text-align:left">${feedback(s).map(t=>`<p>${esc(t)}</p>`).join("")}</div>
    ${dykHTML(s,' style="text-align:left"')}
    <div class="row"><button class="btn" id="cview">View workout</button><button class="btn primary" id="cdone">Done</button></div></div>`);
  requestAnimationFrame(()=>setTimeout(()=>{const f=$("cxp");if(f)f.style.width=endPct+"%";},120));
  if(navigator.vibrate)navigator.vibrate(L1>L0?[20,60,20]:15);
  $("cdone").onclick=closeSheet;$("cview").onclick=()=>openDetail(s);if($("cpr"))$("cpr").onclick=()=>openPRShare(s);if($("csv"))$("csv").onclick=()=>openServiceClaim();
}

/* ---------- workout detail ---------- */
function openDetail(s){
  if(!s||s.deleted)return;
  const c=getC(),r=c.by[s.id];
  const st=[];
  if(s.type==="lift"){
    const v=volume(s);if(v)st.push(["Volume",fmtVol(v)]);st.push(["Time",fmtDur(s.dur)]);const sets=totalSets(s);if(sets)st.push(["Sets",sets]);
  }else if(s.type==="hang"){
    st.push(["Hang time",fmtDur(hangTime(s))]);if(maxAdd(s)!=null)st.push(["Max load",fmtAdd(maxAdd(s))]);st.push(["Sets",hangSets(s)]);st.push(["Session",fmtDur(s.dur)]);
  }else if(s.type==="hike"){
    if(s.dist)st.push(["Distance",fmtDist(s.dist)]);
    if(s.elev)st.push(["Elev gain",fmtElev(s.elev)]);
    if(s.eloss)st.push(["Elev loss",fmtElev(s.eloss)]);
    if(s.maxEle!=null)st.push(["Highest point",fmtElev(s.maxEle)]);
    st.push(["Moving time",fmtDur(s.dur)]);
    if(s.elapsed&&s.elapsed-s.dur>60)st.push(["Elapsed",fmtDur(s.elapsed)]);
    else if(s.restSec)st.push(["Total time",fmtDur(s.dur+s.restSec)]);
    if(s.elev&&s.dur)st.push(["Climb rate",Math.round(toDispElev(s.elev/(s.dur/3600)))+" "+elevU()+"/h"]);
    if(s.dist&&s.dur)st.push(["Pace",fmtPace(pace(s))]);
    if(s.rests!=null)st.push(["Rests",s.rests+(s.restSec?`, ${Math.round(s.restSec/60)} min`:"")]);
    if(s.pack)st.push(["Pack",fmtWt(s.pack)]);
    if(s.diff)st.push(["Difficulty",s.diff]);
    if(s.summit)st.push(["Summit","🚩 Reached"]);
  }else if(s.type==="climb"){
    st.push(["Sends",sends(s).length+"/"+(s.probs||[]).length]);const h=hardest(s);if(h)st.push(["Hardest",h.gl]);
    st.push(["Flashes",flashes(s).length]);st.push(["Attempts",(s.probs||[]).reduce((a,p)=>a+(p.att||1),0)]);st.push(["Time",fmtDur(s.dur)]);st.push(["Points",climbPoints(s)]);
  }else{
    if(s.dist)st.push(["Distance",fmtDist(s.dist)]);
    if(s.dist&&s.dur)st.push(s.type==="ride"?["Avg speed",fmtSpeed(s.dist,s.dur)]:["Pace",fmtPace(pace(s))]);
    st.push(["Moving time",fmtDur(s.dur)]);
    if(s.pw)st.push(["Avg power",s.pw+" W"]);
    if(wkg(s))st.push(["W/kg",wkg(s).toFixed(2)]);
    if(s.np)st.push(["Normalized",s.np+" W"]);
    if(s.p20)st.push(["20-min best",s.p20+" W"]);
    if(s.pmax)st.push(["Max power",s.pmax+" W"]);
    if(rideIF(s)&&s.type==="ride")st.push(["Intensity",rideIF(s).toFixed(2)]);
    if(rideTSS(s)&&s.type==="ride")st.push(["Training stress",Math.round(rideTSS(s))]);
    if(s.elapsed&&s.elapsed-s.dur>60)st.push(["Elapsed",fmtDur(s.elapsed)]);
    if(s.elev)st.push(["Elevation",fmtElev(s.elev)]);
    if(s.maxEle!=null)st.push(["Max elevation",fmtElev(s.maxEle)]);
  }
  if(s.hr)st.push(["Avg HR",Math.round(s.hr)+" bpm"]);
  if(s.cal)st.push(["Calories",Math.round(s.cal)]);
  if(s.steps)st.push(["Steps",Math.round(s.steps).toLocaleString()]);
  if(s.rpe)st.push(["Effort",s.rpe+"/10"]);
  let html=`<div style="--c:${col(s.type)}"><h3>${esc(titleOf(s))}</h3>
    <p class="sub">${TYPES[s.type]}${placeName(s)?` at ${esc(placeName(s))}`:""}, ${fmtDate(s.date,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}${s.time?", "+s.time:""}</p>`;
  if(s.track&&s.track.length>1)html+=`<div class="route" id="lmap" style="overflow:hidden">${routeSVG(s.track,{w:600,h:340,pad:24,sw:5})}</div>`;
  html+=`<div class="dstats">${st.map(([l,v])=>`<div class="n"><b>${esc(v)}</b><span>${l}</span></div>`).join("")}</div>`;
  if(r)html+=`<span class="xpchip">+${r.xp} XP</span>`;
  if(s.photo)html+=`<div id="d-photo" style="margin:4px 0 12px"></div>`;
  if(s.fuel&&s.dur){const h=s.dur/3600,sr=s.fuel.pre&&s.fuel.post?((s.fuel.pre-s.fuel.post)*1000+(s.fuel.fl||0))/h:null;html+=`<p class="hint" style="margin:-4px 0 10px">💧 ${s.fuel.fl?`${s.fuel.fl} ml drunk (${Math.round(s.fuel.fl/h)} ml/h)`:"No fluid logged"}${s.fuel.gels?`, ${s.fuel.gels} gel${s.fuel.gels===1?"":"s"}`:""}${sr?`. Sweat rate about ${r50(sr)} ml/h, ${s.fuel.pre>s.fuel.post?`lost ${round(toDispWt(s.fuel.pre-s.fuel.post),1)} ${wU()} (${round((s.fuel.pre-s.fuel.post)/s.fuel.pre*100,1)}% of body weight)`:"no weight lost"}`:""}.</p>`;}
  if(gearById(s.gearId))html+=`<p class="hint" style="margin:-4px 0 10px">Gear: ${esc(gearById(s.gearId).name)}</p>`;
  if(s.type==="hang"&&s.hangs&&s.hangs.length)html+=`<h4>Hangs</h4><table><thead><tr><th>Grip</th><th>Edge</th><th>Load</th><th>Sets × reps</th></tr></thead><tbody>${s.hangs.map(h=>`<tr><td>${esc(h.grip)}</td><td>${h.edge?h.edge+" mm":"–"}</td><td>${fmtAdd(h.add||0)}</td><td>${h.sets} × ${h.reps} (${h.hang}s/${h.rest}s)</td></tr>`).join("")}</tbody></table>`;
  if(s.cond&&s.cond.length)html+=`<p class="hint" style="margin:-6px 0 10px">Trail: ${esc(s.cond.join(", ").toLowerCase())}</p>`;
  if(r&&r.projects&&r.projects.length)html+=`<h4>Project sent</h4><div class="tlist">${r.projects.map(x=>`<div class="trow"><span class="mdot" style="background:var(--climb)">🎯</span><div class="tx"><b>${esc(x.name)}</b><span>After ${x.attempts} attempt${x.attempts===1?"":"s"}</span></div><span class="tv">${esc(x.grade||"")}</span></div>`).join("")}</div>`;
  if(r&&(r.medals.length||r.acc.length||(r.ymedals||[]).length)){
    html+=`<h4>Trophies</h4><div class="tlist">${r.acc.map(A=>`<button class="trow" data-acc2="${A.id}"><span class="mdot" style="background:linear-gradient(145deg,#FFD66B,#E2A400);font-size:.95rem">${A.icon}</span><div class="tx"><b>${esc(A.name)}</b><span>${esc(A.desc)}</span></div></button>`).join("")}${medalRows(r)}</div>${!viewer&&(r.medals.length||(r.ymedals||[]).length)?`<div class="row" style="margin-top:10px"><button class="btn" id="dpr">Share PRs as image</button></div>`:""}`;
  }
  const E=EFFORTS[s.type];
  if(E&&s.efforts&&Object.keys(s.efforts).length){
    html+=`<h4>Best efforts</h4><table><thead><tr><th>Distance</th><th>Time</th><th>Pace</th></tr></thead><tbody>${E.filter(([D])=>s.efforts[String(D)]).map(([D,name])=>{const t=s.efforts[String(D)];return `<tr><td>${name}</td><td>${fmtClock(t)}</td><td>${s.type==="ride"?fmtSpeed(D/1000,t):fmtPace(t/(D/1000))}</td></tr>`}).join("")}</tbody></table>`;
  }

/* ---------- segments ---------- */
function createSegment(s){
  const tr=s.track,n=tr.length,cum=trackCum(s);
  let a=Math.floor(n*.25),b=Math.max(a+2,Math.floor(n*.55));
  openSheet(`<div style="--c:${col(s.type)}"><h3>Create segment</h3><p class="sub">Drag the sliders to pick the stretch you want to race yourself on. Green is the start, red is the finish.</p>
    <div class="route" id="segmap"></div>
    <label for="sa">Start</label><input type="range" id="sa" min="0" max="${n-1}" value="${a}">
    <label for="sb">Finish</label><input type="range" id="sb" min="0" max="${n-1}" value="${b}">
    <p class="hint" id="seginfo"></p>
    <label for="sname">Name</label><input type="text" id="sname" maxlength="50" placeholder="e.g. Park hill climb">
    <div class="err" id="serr"></div>
    <div class="row"><button class="btn" id="scancel">Cancel</button><button class="btn primary" id="ssave2">Save segment</button></div></div>`);
  const gainOf=(i,j)=>{let g=0,ref=null;for(let k=i;k<=j;k++){const e=tr[k][2];if(e==null)continue;if(ref==null){ref=e;continue;}if(e-ref>=2){g+=e-ref;ref=e}else if(ref-e>=2)ref=e;}return g;};
  const upd=()=>{
    a=+$("sa").value;b=+$("sb").value;if(b<=a){b=Math.min(n-1,a+1);$("sb").value=b;}
    $("segmap").innerHTML=routeSVG(tr,{w:600,h:340,pad:24,sw:5,hi:[a,b]});
    const dist=cum[b]-cum[a],t=tr[b][3]-tr[a][3];
    $("seginfo").textContent=`${fmtDist(dist/1000)}, ${fmtElev(gainOf(a,b))} climb. Your time on this workout: ${fmtClock(t)}.`;
  };
  $("sa").oninput=upd;$("sb").oninput=upd;upd();
  $("scancel").onclick=()=>openDetail(s);
  $("ssave2").onclick=()=>{
    const dist=cum[b]-cum[a];
    if(dist<100){$("serr").textContent="Make the segment at least 100 m long.";return;}
    const name=$("sname").value.trim()||"Segment from "+titleOf(s);
    const step=Math.max(1,Math.ceil((b-a+1)/150)),pts=[];
    for(let k=a;k<=b;k+=step)pts.push([tr[k][0],tr[k][1]]);
    if((b-a)%step)pts.push([tr[b][0],tr[b][1]]);
    const g={id:uid(),name,type:s.type,start:[tr[a][0],tr[a][1]],end:[tr[b][0],tr[b][1]],dist,gain:Math.round(gainOf(a,b)),pts,created:Date.now()};
    upsertSeg(g);
    const ef=segEfforts(g);
    toast(`Segment saved. Found ${ef.length} effort${ef.length===1?"":"s"}.`);
    openSegment(g);
  };
}
function openSegment(g){
  if(!g||g.deleted)return;
  const ef=segEfforts(g);
  openSheet(`<div style="--c:${col(g.type)}"><h3>${esc(g.name)}</h3><p class="sub">${TYPES[g.type]} segment, ${fmtDist(g.dist/1000)}${g.gain?", "+fmtElev(g.gain)+" climb":""}</p>
    <div class="route">${routeSVG(g.pts,{w:600,h:300,pad:24,sw:6})}</div>
    <h4>Your efforts</h4>
    ${ef.length?`<div class="tlist">${ef.map((x,i)=>`<button class="trow" data-o="${x.s.id}">${i<3?`<span class="mdot m${i+1}">${i+1}</span>`:`<span class="mdot" style="background:var(--chip);color:var(--muted)">${i+1}</span>`}<div class="tx"><b>${fmtDate(x.s.date)}</b><span>${esc(titleOf(x.s))}, ${g.type==="ride"?fmtSpeed(g.dist/1000,x.t):fmtPace(x.t/(g.dist/1000))}</span></div><span class="tv">${fmtClock(x.t)}</span></button>`).join("")}</div>`:`<div class="empty">No timed efforts on this segment yet.</div>`}
    <label for="rn">Name</label><input type="text" id="rn" maxlength="50" value="${esc(g.name)}">
    <div class="row"><button class="btn" id="gren">Rename</button><button class="btn danger" id="gdel">Delete segment</button></div>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="gclose">Close</button></div></div>`);
  $("sheet").querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>openDetail(sessions[b.dataset.o]));
  $("gclose").onclick=closeSheet;

  $("gdel").onclick=()=>{const b=$("gdel");if(b.dataset.armed){upsertSeg({id:g.id,deleted:true});closeSheet();toast("Segment deleted");}else{b.dataset.armed="1";b.textContent="Tap to confirm";}};
}
function openAccolade(id){

function allStats(s){

  if(s.pw)o.push({k:"pw",l:"Avg power",v:s.pw+" W"});

  if(s.np)o.push({k:"np",l:"Normalized",v:s.np+" W"});
  if(s.elev&&s.type!=="lift"&&s.type!=="climb")o.push({k:"elev",l:"Elev gain",v:fmtElev(s.elev)});
  if(s.type==="hang"){o.push({k:"htime",l:"Hang time",v:fmtDur(hangTime(s))});if(maxAdd(s)!=null)o.push({k:"hload",l:"Max load",v:fmtAdd(maxAdd(s))});o.push({k:"hsets",l:"Sets",v:String(hangSets(s))});}

  if(s.type==="hike"&&s.elev&&s.dur)o.push({k:"vrate",l:"Climb rate",v:Math.round(toDispElev(s.elev/(s.dur/3600)))+" "+elevU()+"/h"});
  if(s.type==="hike"&&s.rests!=null)o.push({k:"rests",l:"Rests",v:String(s.rests)});
  if(s.pack)o.push({k:"pack",l:"Pack",v:fmtWt(s.pack)});
  if(s.steps)o.push({k:"steps",l:"Steps",v:Math.round(s.steps).toLocaleString()});

  if(s.rpe)o.push({k:"rpe",l:"Effort",v:s.rpe+"/10"});

function defaultStats(s){
  const pref={run:["dist","pace","time"],walk:["dist","pace","time"],hike:["dist","elev","time"],ride:["dist","speed","time","pw"],lift:["vol","time","sets"],climb:["sends","hard","flash","time"],hang:["htime","hload","hsets"],other:["time","dist","cal"]}[s.type];
  const have=allStats(s).map(x=>x.k);
  const out=pref.filter(k=>have.includes(k)).slice(0,s.type==="ride"&&s.pw?4:3);

}

      if(o.outline){path();x.strokeStyle=contrast;x.lineWidth=22;x.stroke();}
      path();x.strokeStyle=ink;x.lineWidth=12;x.stroke();
      continue;
    }
    const sz=op.fixed?op.s:fit(op.t,op.f,op.s,op.mw);
    x.font=fnt(op.f,sz);x.globalAlpha=op.a;
    if(o.outline){x.save();x.shadowColor="transparent";x.lineWidth=Math.max(4,sz*0.07);x.strokeStyle=contrast;x.strokeText(op.t,op.x,off+op.y);x.restore();}
    x.fillText(op.t,op.x,off+op.y);
  }
  x.globalAlpha=1;return c;
}

function openPlace(p){
  if(!p)return;
  const ss=placeSessions(p),k=PLACE_KINDS[p.kind]||PLACE_KINDS.other;
  const time=ss.reduce((a,s)=>a+(s.dur||0),0),byType={};
  ss.forEach(s=>byType[s.type]=(byType[s.type]||0)+1);
  let html=`<h3>${esc(p.name)}</h3><p class="sub">${k[1]} ${k[0]}${ss.length?`, first visit ${fmtDate(ss[ss.length-1].date)}`:""}</p>
    <div class="dstats"><div class="n"><b>${ss.length}</b><span>Visits</span></div><div class="n"><b>${fmtTotalDur(time)}</b><span>Total time</span></div><div class="n"><b>${ss.length?fmtDate(ss[0].date,{month:"short",day:"numeric"}):"—"}</b><span>Last visit</span></div></div>`;
  if(Object.keys(byType).length>1)html+=`<p class="hint" style="margin-top:-6px">${Object.entries(byType).map(([t,n])=>`${n} ${TYPES[t].toLowerCase()}${n===1?"":t==="climb"?"s":"s"}`).join(", ")}</p>`;
  const climbs=ss.filter(s=>s.type==="climb"&&s.probs&&s.probs.length);
  if(climbs.length){
    const tot=climbs.reduce((a,s)=>a+sends(s).length,0),fl=climbs.reduce((a,s)=>a+flashes(s).length,0);
    html+=`<h4>Bouldering here</h4><div class="dstats"><div class="n"><b>${tot}</b><span>Sends</span></div><div class="n"><b>${fl}</b><span>Flashes</span></div><div class="n"><b>${tot?Math.round(fl/tot*100):0}%</b><span>Flash rate</span></div></div>`;
    const keys=[...new Set(climbs.map(sysKey))];
    for(const key of keys){
      const grp=climbs.filter(s=>sysKey(s)===key),smp=grp[0],list=gradeList(smp.gs||"v",smp.placeId),counts=list.map(()=>0);
      grp.forEach(s=>sends(s).forEach(q=>{if(counts[q.g]!=null)counts[q.g]++;}));
      const max=Math.max(...counts);if(!max)continue;
      const rows=list.map((g,i)=>({g,n:counts[i]})).filter(x=>x.n).reverse();
      html+=`<div class="chart" style="background:var(--bg)"><div style="font-size:.82rem;color:var(--muted);margin:0 0 8px 4px">${esc(sysName(smp))}</div><div class="pyr">${rows.map(r=>`<div><span style="font-weight:700">${r.g.color?`<span class="mdot" style="width:16px;height:16px;background:${r.g.color};box-shadow:0 0 0 1px var(--line);vertical-align:-3px"></span> `:""}${esc(r.g.label)}</span><i style="width:${r.n/max*100}%"></i><em>${r.n}</em></div>`).join("")}</div></div>`;
    }

/* ---------- monthly recap ---------- */
function recapData(ym){
  const c=getC(),all=live().sort(chrono),ms=all.filter(s=>s.date.startsWith(ym));
  const [y,m]=ym.split("-").map(Number),prevYm=keyOf(new Date(y,m-2,1)).slice(0,7),prev=all.filter(s=>s.date.startsWith(prevYm));
  const sum=(L,f)=>L.reduce((a,s)=>a+(f(s)||0),0);
  const before=all.filter(s=>s.date<ym+"-01"),xpStart=before.length?c.by[before[before.length-1].id].cum:0;
  const xpGain=sum(ms,s=>c.by[s.id].xp);
  const medals=ms.flatMap(s=>c.by[s.id].medals.map(md=>({...md,s}))).sort((a,b)=>a.rank-b.rank);
  const acc=ms.flatMap(s=>c.by[s.id].acc.map(A=>({A,s})));
  const projs=ms.flatMap(s=>c.by[s.id].projects||[]);
  const pc={};ms.forEach(s=>{const n=placeName(s);if(n)pc[n]=(pc[n]||0)+1;});
  const fav=Object.entries(pc).sort((a,b)=>b[1]-a[1])[0];
  const byType={};ms.forEach(s=>byType[s.type]=(byType[s.type]||0)+(s.dur||0));
  const days=[...new Set(ms.map(s=>s.date))].sort();let bestRun=0,run=0,prevD=null;for(const d of days){run=prevD&&keyOf(addDays(parseDate(prevD),1))===d?run+1:1;bestRun=Math.max(bestRun,run);prevD=d;}
  return {ym,label:parseDate(ym+"-01").toLocaleDateString(undefined,{month:"long",year:"numeric"}),ms,count:ms.length,days:days.length,time:sum(ms,s=>s.dur),prevTime:sum(prev,s=>s.dur),
    dist:sum(ms,s=>DIST_TYPES.includes(s.type)?s.dist:0),elev:sum(ms,s=>s.type!=="lift"&&s.type!=="climb"?s.elev:0),vol:sum(ms,volume),sends:sum(ms,s=>s.type==="climb"?sends(s).length:0),
    summits:ms.filter(s=>s.summit).length,xpGain,lvStart:levelAt(xpStart,ym+"-01"),lvEnd:levelAt(xpStart+xpGain,keyOf(new Date(y,m,0))),medals,acc,projs,fav,byType,bestRun,
    longest:best(ms,s=>s.dur||null)};
}
function recapStats(R){
  const out=[["Workouts",String(R.count)],["Active days",String(R.days)],["Time",fmtTotalDur(R.time)]];
  if(R.dist)out.push(["Distance",round(toDispDist(R.dist),1)+" "+dU()]);
  if(R.elev)out.push(["Elevation",fmtElev(R.elev)]);
  if(R.vol)out.push(["Lifted",Math.round(toDispWt(R.vol)).toLocaleString()+" "+wU()]);
  if(R.sends)out.push(["Sends",String(R.sends)]);
  if(R.summits)out.push(["Summits",String(R.summits)]);
  return out;
}
function openRecap(ym){

  if(!R.count){openSheet(`<h3>${R.label}</h3><p class="sub">No workouts logged this month yet.</p><div class="row"><button class="btn primary" id="rc-close">Close</button></div>`);$("rc-close").onclick=closeSheet;return;}
  const tmax=Math.max(...Object.values(R.byType));
  const ch=R.prevTime?Math.round((R.time/R.prevTime-1)*100):null;

const MEDAL_HEX=["#D9A300","#8E97A3","#C4622D"];
function wrapLines(x,text,maxW,maxLines){
  const words=String(text).replace(/\s+/g," ").trim().split(" "),lines=[];let cur="";
  for(const w of words){const t=cur?cur+" "+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;if(lines.length>=maxLines)break;}else cur=t;}
  if(lines.length<maxLines&&cur)lines.push(cur);
  if(lines.length===maxLines&&words.join(" ").length>lines.join(" ").length)lines[maxLines-1]=lines[maxLines-1].replace(/\s*\S*$/,"")+"…";
  return lines;
}
function drawMedalIcon(x,cx,cy,r,rank){
  const col=MEDAL_HEX[rank-1];
  x.save();x.shadowColor="transparent";x.fillStyle=col;
  x.beginPath();x.moveTo(cx-r*.95,cy-r*1.75);x.lineTo(cx-r*.35,cy-r*1.75);x.lineTo(cx,cy-r*.9);x.lineTo(cx+r*.35,cy-r*1.75);x.lineTo(cx+r*.95,cy-r*1.75);x.lineTo(cx+r*.45,cy-r*.75);x.lineTo(cx-r*.45,cy-r*.75);x.closePath();x.globalAlpha=.85;x.fill();x.globalAlpha=1;
  x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fill();
  x.beginPath();x.arc(cx,cy,r*.68,0,Math.PI*2);x.strokeStyle="rgba(0,0,0,.28)";x.lineWidth=r*.12;x.stroke();
  x.fillStyle="rgba(0,0,0,.6)";x.font=`800 ${Math.round(r*1.05)}px "Barlow Condensed","Arial Narrow",sans-serif`;x.textAlign="center";x.textBaseline="middle";x.fillText(String(rank),cx,cy+r*.06);
  x.restore();
}
const PR_ROW=172,PR_GAP=44,PR_PAD=56;
const prBlockHeight=n=>PR_PAD*2+n*PR_ROW+(n-1)*PR_GAP;
function drawPRBlock(x,X,Y,w,ent,o){
  const h=prBlockHeight(ent.length);
  const box={dark:"#0E0E10",light:"#FFFFFF",glass:"rgba(0,0,0,.58)",color:o.hex||"#2F6BFF",none:null}[o.style];
  const t1=o.style==="light"?"#121212":o.style==="none"?o.color:"#FFFFFF",t2=o.style==="light"?"#3A3F4A":o.style==="none"?o.color:"rgba(255,255,255,.88)";
  x.save();
  if(box){x.fillStyle=box;x.beginPath();if(x.roundRect)x.roundRect(X,Y,w,h,o.radius);else x.rect(X,Y,w,h);x.fill();}
  x.textAlign="left";x.textBaseline="alphabetic";
  ent.forEach((m,i)=>{
    const ry=Y+PR_PAD+i*(PR_ROW+PR_GAP),tx=X+PR_PAD+130,mw=w-PR_PAD*2-130;
    drawMedalIcon(x,X+PR_PAD+50,ry+92,34,m.rank);
    x.fillStyle=t1;x.font='500 48px "Barlow",system-ui,sans-serif';let t=m.title;while(x.measureText(t).width>mw&&t.length>3)t=t.slice(0,-1);x.fillText(t===m.title?t:t+"…",tx,ry+44);
    x.fillStyle=t2;x.font='400 40px "Barlow",system-ui,sans-serif';x.fillText(m.sub?`${m.value}    ${m.sub}`:m.value,tx,ry+104);
    x.fillText(m.caption,tx,ry+160);
  });
  x.restore();return h;
}

const CAUTIONS=["Knees","Shoulders","Lower back","Fingers","Elbows","Ankles"];
function ltTitle(g){
  const L=g.kind==="grade"?gradeList(g.gs,g.placeId):null;
  switch(g.kind){
    case "race":return `${RACE_D[g.dist][0]}${g.time?" in "+fmtClock(g.time):""}`;
    case "grade":return `Send ${L[g.g]?L[g.g].label:"?"}${g.gs==="color"&&placeById(g.placeId)?" at "+placeById(g.placeId).name:""}`;
    case "lift":return `${g.ex} ${fmtWt(g.target)}`;
    case "ftp":return `FTP ${g.target} W`;
    case "ride":return `Ride ${fmtDist(g.target)}`;
    case "summit":return `Summit ${g.name||"a mountain"}`;
    case "weight":return `Reach ${fmtWt(g.target)}`;
    case "habit":return `${g.per}× a week for ${g.weeks} weeks`;
    case "vo2":return `VO2max ${g.target}`;
  }
  return "Goal";
}

    if(k==="lift")return {...base,ex:"Bench press",target:""};
    if(k==="ftp"){const f=currentFTP();return {...base,target:f?Math.round(f*1.08):""};}
    if(k==="ride")return {...base,target:100};

    if(k==="weight")return {...base,target:""};
    if(k==="habit")return {...base,per:Math.max(2,lt.days||3),weeks:12,by:"auto"};

  const byOpts=[["1m","1 month",30],["3m","3 months",91],["6m","6 months",182],["1y","1 year",365],["custom","Pick a date",0]];

        if(k==="summit")h+=`<label>Mountain</label><input data-i="${k}:name" type="text" placeholder="e.g. Mt. Pulag" value="${esc(d.name)}"><label>Linked place (optional)</label><select data-i="${k}:placeId"><option value="">None</option>${places().map(p=>`<option value="${p.id}"${d.placeId===p.id?" selected":""}>${esc(p.name)}</option>`).join("")}</select><label>Summit elevation (${elevU()}, optional)</label><input data-i="${k}:elev" type="number" inputmode="numeric" value="${d.elev!==""?Math.round(toDispElev(d.elev)):""}">`;
        if(k==="weight"){const w=weights();const cur=w.length?w[w.length-1].kg:bio().weight;h+=`<label>Target weight (${wU()})</label><input data-i="${k}:target" type="number" inputmode="decimal" value="${d.target!==""?round(toDispWt(d.target),1):""}">${cur?`<p class="hint">Currently ${fmtWt(cur)}. A safe pace is about 0.5% of body weight per week.</p>`:`<p class="hint">Log your weight in Coach, Stats so progress can be tracked.</p>`}`;}
        if(k==="habit")h+=`<label>Workouts per week</label><div class="seg" data-f="${k}:per">${[2,3,4,5,6].map(v=>`<button data-v="${v}" aria-pressed="${d.per==v}">${v}</button>`).join("")}</div><label>For how many weeks in a row</label><div class="seg" data-f="${k}:weeks">${[4,8,12,26].map(v=>`<button data-v="${v}" aria-pressed="${d.weeks==v}">${v}</button>`).join("")}</div>`;
        if(k==="vo2")h+=`<label>Target VO2max</label><input data-i="${k}:target" type="number" inputmode="numeric" value="${d.target}">`;
        if(k!=="habit")h+=`<label>By when?</label><div class="seg" data-f="${k}:by">${byOpts.map(([v,n])=>`<button data-v="${v}" aria-pressed="${d.by===v}">${n}</button>`).join("")}</div>${d.by==="custom"?`<input data-i="${k}:date" type="date" style="margin-top:8px" value="${d.date}">`:`<p class="hint">Target date: ${fmtDate(d.date)}</p>`}`;
        h+=`</div>`;
      }
      h+=`<div class="err" id="wz-err"></div><div class="row"><button class="btn" id="wz-back">Back</button><button class="btn primary" id="wz-next">Next</button></div>`;
    }else if(st.step===2){
      const P=st.prof;
      h=`<h3>${mode==="profile"?"Training profile":"How you train"}</h3><p class="sub">Used to size your recommended workouts.</p>
        <label>Days per week you can train</label><div class="seg" data-p="days">${[2,3,4,5,6,7].map(v=>`<button data-v="${v}" aria-pressed="${P.days==v}">${v}</button>`).join("")}</div>
        <label>Usual session length</label><div class="seg" data-p="mins">${[30,45,60,90,120].map(v=>`<button data-v="${v}" aria-pressed="${P.mins==v}">${v<120?v+" min":"2 h"}</button>`).join("")}</div>
        <label>Experience</label><div class="seg" data-p="level">${[["beginner","Beginner"],["intermediate","Intermediate"],["advanced","Advanced"]].map(([v,n])=>`<button data-v="${v}" aria-pressed="${P.level===v}">${n}</button>`).join("")}</div>
        <label>Where you train</label><div class="seg" data-p="climate">${[["hot","Hot and humid"],["mild","Mild"],["cool","Cool"]].map(([v,n])=>`<button data-v="${v}" aria-pressed="${P.climate===v}">${n}</button>`).join("")}</div>
        <label>Anything to be careful with?</label><div class="tchips" style="--c:#D13B4F">${CAUTIONS.map(c=>`<button class="tchip" data-caut="${c}" aria-pressed="${P.cautions.includes(c)}">${c}</button>`).join("")}</div>

    }else{
      const newG=[...st.sel].map(k=>st.d[k]);

        ${newG.length?`<div class="tlist">${newG.map(d=>`<div class="trow"><span class="mdot" style="background:var(--chip)">${LT_KINDS[d.kind].icon}</span><div class="tx"><b>${esc(ltTitle({...d,time:d.time?parseClock(d.time):null,target:+d.target||d.target}))}</b><span>By ${fmtDate(d.kind==="habit"?keyOf(addDays(new Date(),d.weeks*7)):d.date)}</span></div></div>`).join("")}</div>`:""}
        <p class="hint">Achieving a long-term goal earns 500 XP and a Legendary trophy. I'll check in again in about 8 weeks.</p>
        <div class="row"><button class="btn" id="wz-back">Back</button><button class="btn primary" id="wz-done">Save goals</button></div>`;
    }
    openSheet(h);wire();

  const readInputs=()=>{document.querySelectorAll("[data-i]").forEach(inp=>{const [k,f]=inp.dataset.i.split(":");const d=st.d[k];if(!d)return;let v=inp.value;
    if(f==="target"){const n=num(v);v=n==null?"":k==="lift"||k==="weight"?fromDispWt(n):k==="ride"?fromDispDist(n):n;}
    if(f==="elev"){const n=num(v);v=n==null?"":fromDispElev(n);}

  const wire=()=>{
    const q=sel=>document.querySelectorAll(sel);

    q("[data-caut]").forEach(b=>b.onclick=()=>{const c=b.dataset.caut,a=st.prof.cautions,i=a.indexOf(c);if(i>=0)a.splice(i,1);else a.push(c);b.setAttribute("aria-pressed",i<0);});

        }

        if(k==="grade"){g.gs=d.gs;g.placeId=d.placeId;g.g=d.g;}
        if(k==="lift"){g.ex=d.ex.trim();g.target=+d.target;}

        if(k==="summit"){g.name=d.name.trim();g.placeId=d.placeId;g.elev=d.elev?+d.elev:null;}

      Object.assign(lt,st.prof,{onboarded:true,lastCheck:Date.now()});

function celebrateGoal(g){

const todayCheck=()=>(settings.checkins||{})[keyOf(new Date())];
function readiness(){
  const c=todayCheck();if(!c)return null;
  let r=100;
  if(c.sleep!=null&&c.sleep<8)r-=Math.min(40,(8-c.sleep)*8);
  r-=((c.sore||1)-1)*7;r-=((c.stress||1)-1)*5;r-=(3-(c.energy||3))*6;
  if(c.rhr){const prev=Object.entries(settings.checkins||{}).filter(([d,x])=>x.rhr&&d<keyOf(new Date())&&d>=keyOf(addDays(new Date(),-21))).map(([,x])=>x.rhr);if(prev.length>=3){const avg=prev.reduce((a,b)=>a+b,0)/prev.length;if(c.rhr>avg+3)r-=Math.min(20,(c.rhr-avg)*3);}}
  r-=Math.min(25,recoveryLeft().h/2.5);
  r-=activePain().reduce((a,p)=>a+(p.level>=6?8:3),0);
  return Math.max(5,Math.min(100,Math.round(r)));
}

/* ---------- CSV export ---------- */
function buildCSV(){
  const cols=["date","time","type","title","place","duration_min","distance_km","elevation_m","pace_min_per_km","avg_hr","avg_power_w","effort","volume_kg","sends","hang_time_s","notes"];
  const q=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;};
  const rows=live().sort(chrono).map(s=>[s.date,s.time||"",s.type,titleOf(s),placeName(s),s.dur?round(s.dur/60,1):"",s.dist?round(s.dist,3):"",s.elev?Math.round(s.elev):"",pace(s)?round(pace(s)/60,2):"",s.hr||"",s.pw||"",s.rpe||"",volume(s)?Math.round(volume(s)):"",s.type==="climb"?sends(s).length:"",s.type==="hang"?hangTime(s):"",s.notes||""].map(q).join(","));
  return [cols.join(","),...rows].join("\n");
}
async function exportCSV(){
