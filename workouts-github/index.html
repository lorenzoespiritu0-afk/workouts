function renderCalendar(list){
  const y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();
  const lead=(first.getDay()+6)%7,today=keyOf(new Date());
  const byDay={};for(const s of list)if(s.date.startsWith(keyOf(first).slice(0,7)))(byDay[s.date]=byDay[s.date]||[]).push(s);
  let cells="";for(let i=0;i<lead;i++)cells+=`<div class="cday empty"></div>`;
  for(let d=1;d<=days;d++){
    const k=keyOf(new Date(y,m,d)),ss=byDay[k]||[];
    const pl=!viewer&&k>=today?plannedOn(k):null;
    cells+=`<button class="cday${ss.length?" act":""}${k===today?" today":""}${k>today&&!pl?" fut":""}" data-day="${k}" aria-label="${parseDate(k).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}, ${ss.length} workout${ss.length===1?"":"s"}">${d}<span class="dots">${pl?(pl.race?"🏁":`<i style="background:transparent;box-shadow:inset 0 0 0 2px ${col(pl.type)}"></i>`):""}${ss.slice(0,4).map(s=>`<i style="background:${col(s.type)}"></i>`).join("")}</span></button>`;
  }
  const ms=Object.values(byDay).flat(),time=ms.reduce((a,s)=>a+(s.dur||0),0);
  const ym=keyOf(first).slice(0,7);
  return `<div class="cal"><div class="calh"><button data-cal="-1" aria-label="Previous month">‹</button><b>${first.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b><button data-cal="1" aria-label="Next month">›</button></div>
    <div class="calg">${["M","T","W","T","F","S","S"].map(x=>`<div class="wd">${x}</div>`).join("")}${cells}</div>${activePlanEvent()?`<p class="hint" style="margin:8px 4px 0">Hollow dots are planned sessions for ${esc(activePlanEvent().name)}. Tap a day to see or start it.</p>`:""}</div>
    <div class="dstats" style="margin-top:14px"><div class="n"><b>${ms.length}</b><span>Workouts</span></div><div class="n"><b>${Object.keys(byDay).length}</b><span>Active days</span></div><div class="n"><b>${fmtTotalDur(time)}</b><span>Time</span></div></div>
    <div class="tchips">${Object.entries(TYPES).filter(([t])=>ms.some(s=>s.type===t)).map(([t,n])=>`<span class="tchip" style="background:${col(t)};color:#fff">${n} ${ms.filter(s=>s.type===t).length}</span>`).join("")}</div>
    ${ms.length?`<button class="btn primary" style="width:100%;margin-top:14px" data-recap="${ym}">Monthly recap</button>`:""}`;
}
function openDay(k){

function recapData(ym){

  const acc=ms.flatMap(s=>c.by[s.id].acc.map(A=>({A,s})));
  const projs=ms.flatMap(s=>c.by[s.id].projects||[]);
  const pc={};ms.forEach(s=>{const n=placeName(s);if(n)pc[n]=(pc[n]||0)+1;});
  const fav=Object.entries(pc).sort((a,b)=>b[1]-a[1])[0];
  const byType={};ms.forEach(s=>byType[s.type]=(byType[s.type]||0)+(s.dur||0));
  const days=[...new Set(ms.map(s=>s.date))].sort();let bestRun=0,run=0,prevD=null;for(const d of days){run=prevD&&keyOf(addDays(parseDate(prevD),1))===d?run+1:1;bestRun=Math.max(bestRun,run);prevD=d;}
  return {ym,label:parseDate(ym+"-01").toLocaleDateString(undefined,{month:"long",year:"numeric"}),ms,count:ms.length,days:days.length,time:sum(ms,s=>s.dur),prevTime:sum(prev,s=>s.dur),
    dist:sum(ms,s=>DIST_TYPES.includes(s.type)?s.dist:0),elev:sum(ms,s=>s.type!=="lift"&&s.type!=="climb"?s.elev:0),vol:sum(ms,volume),sends:sum(ms,s=>s.type==="climb"?sends(s).length:0),
    summits:ms.filter(s=>s.summit).length,xpGain,lvStart:levelAt(xpStart,ym+"-01"),lvEnd:levelAt(xpStart+xpGain,keyOf(new Date(y,m,0))),medals,acc,projs,fav,byType,bestRun,
    longest:best(ms,s=>s.dur||null)};
}

/* ---------- PR card ---------- */
const MEDAL_HEX=["#D9A300","#8E97A3","#C4622D"];
function wrapLines(x,text,maxW,maxLines){
  const words=String(text).replace(/\s+/g," ").trim().split(" "),lines=[];let cur="";
  for(const w of words){const t=cur?cur+" "+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;if(lines.length>=maxLines)break;}else cur=t;}
  if(lines.length<maxLines&&cur)lines.push(cur);
  if(lines.length===maxLines&&words.join(" ").length>lines.join(" ").length)lines[maxLines-1]=lines[maxLines-1].replace(/\s*\S*$/,"")+"…";
  return lines;
}
function drawMedalIcon(x,cx,cy,r,rank){

/* ---------- long-term goals: wizard, list, celebration ---------- */
const CAUTIONS=["Knees","Shoulders","Lower back","Fingers","Elbows","Ankles"];
function ltTitle(g){
  const L=g.kind==="grade"?gradeList(g.gs,g.placeId):null;
  switch(g.kind){
    case "race":return `${RACE_D[g.dist][0]}${g.time?" in "+fmtClock(g.time):""}`;
    case "grade":return `Send ${L[g.g]?L[g.g].label:"?"}${g.gs==="color"&&placeById(g.placeId)?" at "+placeById(g.placeId).name:""}`;
    case "lift":return `${g.ex} ${fmtWt(g.target)}`;
    case "ftp":return `FTP ${g.target} W`;
    case "ride":return `Ride ${fmtDist(g.target)}`;
    case "summit":return `Summit ${g.name||"a mountain"}`;
    case "weight":return `Reach ${fmtWt(g.target)}`;
    case "habit":return `${g.per}× a week for ${g.weeks} weeks`;
    case "vo2":return `VO2max ${g.target}`;
  }
  return "Goal";
}
function openWizard(mode){
  const lt=LT();

  const mk=k=>{const today=keyOf(new Date());const by=keyOf(addDays(new Date(),91));
    const base={kind:k,by:"3m",date:by};
    if(k==="race")return {...base,dist:"5",time:""};
    if(k==="grade"){const last=live().filter(s=>s.type==="climb").sort(chrono).pop();const gs=last?last.gs||"v":"v",pl=last?last.placeId||"":"";const h=hardestIn(gs,pl);return {...base,gs,placeId:pl,g:Math.min(gradeList(gs,pl).length-1,Math.max(0,h+1))};}
    if(k==="lift")return {...base,ex:"Bench press",target:""};
    if(k==="ftp"){const f=currentFTP();return {...base,target:f?Math.round(f*1.08):""};}
    if(k==="ride")return {...base,target:100};
    if(k==="summit")return {...base,name:"",placeId:"",elev:""};
    if(k==="weight")return {...base,target:""};
    if(k==="habit")return {...base,per:Math.max(2,lt.days||3),weeks:12,by:"auto"};
    if(k==="vo2"){const v=vo2Now();return {...base,target:v?Math.round(v.v)+3:45};}
    return base;};
  const byOpts=[["1m","1 month",30],["3m","3 months",91],["6m","6 months",182],["1y","1 year",365],["custom","Pick a date",0]];
  const heads={first:["Welcome!","Let's set up your goals so the app can coach you. What do you want to work toward?"],next:["What's next?","You crushed a goal. Pick your next challenge."],checkin:["Goal check-in","It's been a while, so here's how your goals are going. Keep, drop, or add new ones."],add:["Add a goal","What do you want to work toward?"],profile:["Training profile",""]};
  const draw=()=>{
    let h="";

      }
      h+=`<div class="tchips" style="--c:var(--xp)">${Object.entries(LT_KINDS).map(([k,v])=>`<button class="tchip" data-kind="${k}" aria-pressed="${st.sel.has(k)}">${v.icon} ${v.name}</button>`).join("")}</div>
        <div class="row"><button class="btn" id="wz-skip">${mode==="first"?"Skip for now":"Cancel"}</button><button class="btn primary" id="wz-next">${st.sel.size?"Next":mode==="checkin"?"Next":"Next"}</button></div>`;

      for(const k of st.sel){
        const d=st.d[k]||(st.d[k]=mk(k)),K=LT_KINDS[k];

        if(k==="grade"){const L=gradeList(d.gs,d.placeId);h+=`<label>Grade system</label><div class="seg" data-f="${k}:gs">${Object.entries(GSYS).map(([v,n])=>`<button data-v="${v}" aria-pressed="${d.gs===v}">${n}</button>`).join("")}</div>${d.gs==="color"?`<label>Gym</label><select data-i="${k}:placeId"><option value="">Default circuit</option>${places().map(p=>`<option value="${p.id}"${d.placeId===p.id?" selected":""}>${esc(p.name)}</option>`).join("")}</select>`:""}<label>Target grade</label><div class="gchips">${L.map((g,i)=>g.color?`<button class="cdot" style="background:${g.color}" data-gg="${k}:${i}" aria-pressed="${d.g===i}" aria-label="${esc(g.label)}"></button>`:`<button class="gchip" data-gg="${k}:${i}" aria-pressed="${d.g===i}">${esc(g.label)}</button>`).join("")}</div>${hardestIn(d.gs,d.placeId)>=0?`<p class="hint">Your hardest send so far: ${esc(L[hardestIn(d.gs,d.placeId)].label)}.</p>`:""}`;}
        if(k==="lift"){const cur=bestE1rm(d.ex);h+=`<label>Exercise</label><input data-i="${k}:ex" type="text" list="exlist-dl" value="${esc(d.ex)}"><datalist id="exlist-dl">${["Bench press","Barbell back squat","Deadlift","Overhead press","Weighted pull-up","Hip thrust"].map(x=>`<option value="${x}">`).join("")}</datalist><label>Target 1-rep max (${wU()})</label><input data-i="${k}:target" type="number" inputmode="decimal" value="${d.target!==""?round(toDispWt(d.target),1):""}" placeholder="${cur?round(toDispWt(cur*1.1),0):""}">${cur?`<p class="hint">Your current estimated 1RM: ${fmtWt(cur)}.</p>`:""}`;}
        if(k==="ftp")h+=`<label>Target FTP (watts)</label><input data-i="${k}:target" type="number" inputmode="numeric" value="${d.target}">${currentFTP()?`<p class="hint">Current: ${currentFTP()} W${bio().weight?`, ${(currentFTP()/bio().weight).toFixed(2)} W/kg`:""}.</p>`:`<p class="hint">Add your FTP in Settings or log a ride with 20-minute power so progress can be tracked.</p>`}`;
        if(k==="ride")h+=`<label>Distance (${dU()})</label><input data-i="${k}:target" type="number" inputmode="decimal" value="${d.target!==""?round(toDispDist(d.target),0):""}">`;
        if(k==="summit")h+=`<label>Mountain</label><input data-i="${k}:name" type="text" placeholder="e.g. Mt. Pulag" value="${esc(d.name)}"><label>Linked place (optional)</label><select data-i="${k}:placeId"><option value="">None</option>${places().map(p=>`<option value="${p.id}"${d.placeId===p.id?" selected":""}>${esc(p.name)}</option>`).join("")}</select><label>Summit elevation (${elevU()}, optional)</label><input data-i="${k}:elev" type="number" inputmode="numeric" value="${d.elev!==""?Math.round(toDispElev(d.elev)):""}">`;
        if(k==="weight"){const w=weights();const cur=w.length?w[w.length-1].kg:bio().weight;h+=`<label>Target weight (${wU()})</label><input data-i="${k}:target" type="number" inputmode="decimal" value="${d.target!==""?round(toDispWt(d.target),1):""}">${cur?`<p class="hint">Currently ${fmtWt(cur)}. A safe pace is about 0.5% of body weight per week.</p>`:`<p class="hint">Log your weight in Coach, Stats so progress can be tracked.</p>`}`;}
        if(k==="habit")h+=`<label>Workouts per week</label><div class="seg" data-f="${k}:per">${[2,3,4,5,6].map(v=>`<button data-v="${v}" aria-pressed="${d.per==v}">${v}</button>`).join("")}</div><label>For how many weeks in a row</label><div class="seg" data-f="${k}:weeks">${[4,8,12,26].map(v=>`<button data-v="${v}" aria-pressed="${d.weeks==v}">${v}</button>`).join("")}</div>`;
        if(k==="vo2")h+=`<label>Target VO2max</label><input data-i="${k}:target" type="number" inputmode="numeric" value="${d.target}">`;
        if(k!=="habit")h+=`<label>By when?</label><div class="seg" data-f="${k}:by">${byOpts.map(([v,n])=>`<button data-v="${v}" aria-pressed="${d.by===v}">${n}</button>`).join("")}</div>${d.by==="custom"?`<input data-i="${k}:date" type="date" style="margin-top:8px" value="${d.date}">`:`<p class="hint">Target date: ${fmtDate(d.date)}</p>`}`;
        h+=`</div>`;
      }
      h+=`<div class="err" id="wz-err"></div><div class="row"><button class="btn" id="wz-back">Back</button><button class="btn primary" id="wz-next">Next</button></div>`;
    }else if(st.step===2){
      const P=st.prof;
      h=`<h3>${mode==="profile"?"Training profile":"How you train"}</h3><p class="sub">Used to size your recommended workouts.</p>
        <label>Days per week you can train</label><div class="seg" data-p="days">${[2,3,4,5,6,7].map(v=>`<button data-v="${v}" aria-pressed="${P.days==v}">${v}</button>`).join("")}</div>
        <label>Usual session length</label><div class="seg" data-p="mins">${[30,45,60,90,120].map(v=>`<button data-v="${v}" aria-pressed="${P.mins==v}">${v<120?v+" min":"2 h"}</button>`).join("")}</div>
        <label>Experience</label><div class="seg" data-p="level">${[["beginner","Beginner"],["intermediate","Intermediate"],["advanced","Advanced"]].map(([v,n])=>`<button data-v="${v}" aria-pressed="${P.level===v}">${n}</button>`).join("")}</div>
        <label>Where you train</label><div class="seg" data-p="climate">${[["hot","Hot and humid"],["mild","Mild"],["cool","Cool"]].map(([v,n])=>`<button data-v="${v}" aria-pressed="${P.climate===v}">${n}</button>`).join("")}</div>
        <label>Anything to be careful with?</label><div class="tchips" style="--c:#D13B4F">${CAUTIONS.map(c=>`<button class="tchip" data-caut="${c}" aria-pressed="${P.cautions.includes(c)}">${c}</button>`).join("")}</div>
        <p class="hint">Workouts will go easier on these areas. This app can't replace advice from a doctor or physio for an injury.</p>
        <div class="row">${mode==="profile"?`<button class="btn" id="wz-skip">Cancel</button>`:`<button class="btn" id="wz-back">Back</button>`}<button class="btn primary" id="wz-next">${mode==="profile"?"Save":"Next"}</button></div>`;
    }else{
      const newG=[...st.sel].map(k=>st.d[k]);
      h=`<h3>You're all set</h3><p class="sub">${newG.length?"Here's what you're working toward.":"Your profile is saved."} You'll find everything in the Coach tab, and workout suggestions will lean toward these goals.</p>
        ${newG.length?`<div class="tlist">${newG.map(d=>`<div class="trow"><span class="mdot" style="background:var(--chip)">${LT_KINDS[d.kind].icon}</span><div class="tx"><b>${esc(ltTitle({...d,time:d.time?parseClock(d.time):null,target:+d.target||d.target}))}</b><span>By ${fmtDate(d.kind==="habit"?keyOf(addDays(new Date(),d.weeks*7)):d.date)}</span></div></div>`).join("")}</div>`:""}
        <p class="hint">Achieving a long-term goal earns 500 XP and a Legendary trophy. I'll check in again in about 8 weeks.</p>
        <div class="row"><button class="btn" id="wz-back">Back</button><button class="btn primary" id="wz-done">Save goals</button></div>`;
    }
    openSheet(h);wire();
  };
  const readInputs=()=>{document.querySelectorAll("[data-i]").forEach(inp=>{const [k,f]=inp.dataset.i.split(":");const d=st.d[k];if(!d)return;let v=inp.value;
    if(f==="target"){const n=num(v);v=n==null?"":k==="lift"||k==="weight"?fromDispWt(n):k==="ride"?fromDispDist(n):n;}
    if(f==="elev"){const n=num(v);v=n==null?"":fromDispElev(n);}
    d[f]=v;});};
  const wire=()=>{
    const q=sel=>document.querySelectorAll(sel);
    q("[data-kind]").forEach(b=>b.onclick=()=>{const k=b.dataset.kind;if(st.sel.has(k))st.sel.delete(k);else st.sel.add(k);b.setAttribute("aria-pressed",st.sel.has(k));});
    q("[data-keep]").forEach(b=>b.onclick=()=>{const id=b.dataset.keep;if(st.keep.has(id))st.keep.delete(id);else st.keep.add(id);b.setAttribute("aria-pressed",st.keep.has(id));b.textContent=st.keep.has(id)?"Keep":"Drop";});
    q("[data-f]").forEach(el=>el.querySelectorAll("button").forEach(b=>b.onclick=()=>{readInputs();const [k,f]=el.dataset.f.split(":");const d=st.d[k];d[f]=f==="per"||f==="weeks"?+b.dataset.v:b.dataset.v;
      if(f==="by"){const o=byOpts.find(x=>x[0]===d.by);if(o&&o[2])d.date=keyOf(addDays(new Date(),o[2]));}

    q("[data-gg]").forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.gg.split(":");st.d[k].g=+i;q(`[data-gg^="${k}:"]`).forEach(z=>z.setAttribute("aria-pressed",z===b));});
    q("select[data-i]").forEach(sl=>sl.onchange=()=>{readInputs();draw();});
    q("[data-p]").forEach(el=>el.querySelectorAll("button").forEach(b=>b.onclick=()=>{const f=el.dataset.p;st.prof[f]=f==="level"||f==="climate"?b.dataset.v:+b.dataset.v;el.querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",z===b));}));
    q("[data-caut]").forEach(b=>b.onclick=()=>{const c=b.dataset.caut,a=st.prof.cautions,i=a.indexOf(c);if(i>=0)a.splice(i,1);else a.push(c);b.setAttribute("aria-pressed",i<0);});
    if($("wz-skip"))$("wz-skip").onclick=()=>{if(mode==="first"){LT().onboarded=true;LT().lastCheck=Date.now();settings.updatedAt=Date.now();saveLocal();pushSettings();}closeSheet();};
    if($("wz-back"))$("wz-back").onclick=()=>{readInputs();st.step=st.step===3&&!st.sel.size?0:st.step-1;draw();};

      if(st.step===0){st.step=st.sel.size?1:2;draw();return;}

          if(k==="race"&&d.time&&!parseClock(d.time)){$("wz-err").textContent="Use a time like 25:00 or 1:55:00.";return;}

          if(["lift","ftp","ride","grade","vo2"].includes(k)){const tg={kind:k,start:keyOf(new Date()),date:d.date,target:+d.target,ex:d.ex,gs:d.gs,placeId:d.placeId,g:d.g};tg.base=ltBase(tg);if(ltProgress(tg).pct>=1){$("wz-err").textContent=`You've already reached the "${LT_KINDS[k].name}" target. Aim a bit higher!`;return;}}
        }
        st.step=2;draw();return;}
      if(st.step===2){if(mode==="profile"){Object.assign(LT(),st.prof);settings.updatedAt=Date.now();saveLocal();pushSettings();render();closeSheet();toast("Profile saved");return;}st.step=3;draw();}
    };
    if($("wz-done"))$("wz-done").onclick=()=>{
      const lt=LT(),today=keyOf(new Date());
      if(mode==="checkin")lt.goals=lt.goals.filter(g=>g.done||st.keep.has(g.id));
      for(const k of st.sel){const d=st.d[k];const g={id:uid(),kind:k,start:today,date:k==="habit"?keyOf(addDays(new Date(),d.weeks*7)):d.date,xp:500};
        if(k==="race"){g.dist=d.dist;g.time=d.time?parseClock(d.time):null;}
        if(k==="grade"){g.gs=d.gs;g.placeId=d.placeId;g.g=d.g;}
        if(k==="lift"){g.ex=d.ex.trim();g.target=+d.target;}
        if(["ftp","ride","weight","vo2"].includes(k))g.target=+d.target;
        if(k==="summit"){g.name=d.name.trim();g.placeId=d.placeId;g.elev=d.elev?+d.elev:null;}
        if(k==="habit"){g.per=d.per;g.weeks=d.weeks;}
        g.base=ltBase(g);lt.goals.push(g);}
      Object.assign(lt,st.prof,{onboarded:true,lastCheck:Date.now()});
      settings.updatedAt=Date.now();invalidate();saveLocal();pushSettings();closeSheet();view="insights";coachTab="goals";render();toast(st.sel.size?"Goals saved":"Saved");
    };
  };
  draw();
}
function celebrateGoal(g){

      ${g?`<p class="hint">Working toward: ${esc(ltTitle(g))}. Suggestions lean toward this goal.</p>`:longGoals().length?"":`<p class="hint">Set a long-term goal in Coach for more targeted workouts.</p>`}

      <div id="pl-out">${plan?planHTML(plan)+`<div class="row"><button class="btn" id="pl-again">Try another</button><button class="btn go" id="pl-start">Start this workout</button></div><div class="row" style="margin-top:8px"><button class="btn" id="pl-save">Save as routine</button></div>`:""}</div>`);
    document.querySelectorAll("[data-po]").forEach(el=>el.querySelectorAll("button").forEach(b=>b.onclick=()=>{const k=el.dataset.po;o[k]=k==="mins"?+b.dataset.v:b.dataset.v;if(k==="feel")o.feelSet=true;el.querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed",z===b));if(k==="type"){plan=null;draw();}}));

    document.querySelectorAll('[data-po="terrain"] button').forEach(b=>{const f=b.onclick;b.onclick=()=>{f();const t=$("sheet").scrollTop;draw();$("sheet").scrollTop=t;};});
    document.querySelectorAll("[data-tg2]").forEach(b=>b.onclick=()=>{const v=b.dataset.tg2;if(v==="auto"||v==="any")o.target=v;else{let a=Array.isArray(o.target)?[...o.target]:[];const i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);o.target=a.length?a:"auto";}haptic("light");const t=$("sheet").scrollTop;draw();$("sheet").scrollTop=t;});
    $("pl-custom").onchange=()=>{const h=num($("pl-custom").value);if(h>0){o.mins=Math.round(h*60);document.querySelectorAll('[data-po="mins"] button').forEach(z=>z.setAttribute("aria-pressed","false"));}};
    $("pl-cancel").onclick=closeSheet;
    $("pl-build").onclick=()=>{plan=buildPlan(o);planPrefs={...o};const top=$("sheet").scrollTop;draw();setTimeout(()=>{const el=$("pl-out");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});},60);};
    if($("pl-again"))$("pl-again").onclick=()=>{o.seed++;plan=buildPlan(o);draw();setTimeout(()=>$("pl-out").scrollIntoView({block:"start"}),60);};
    if($("pl-start"))$("pl-start").onclick=()=>startActive(plan);
    if($("pl-save"))$("pl-save").onclick=()=>savePlanAsRoutine(plan);
  };
  draw();
}

/* ---------- live workout ---------- */
const AKEY="workouts-active-v1";
const TIMED_RE=/plank|hold|wall sit|dead hang|l-sit|hollow|isometric/i;
let active=null,actIv=null;
function loadActive(){try{const r=localStorage.getItem(AKEY);active=r?JSON.parse(r):null;}catch(e){active=null;}}
function saveActive(){try{if(active)localStorage.setItem(AKEY,JSON.stringify(active));else localStorage.removeItem(AKEY);}catch(e){}}
function startActive(plan){
  const ex=[];plan.blocks.forEach(b=>b.items.forEach(it=>{if(it.ex)ex.push({name:it.ex,sets:it.sets,reps:it.reps,w:it.w,mus:it.mus,rest:it.rest,done:0});}));
  active={plan,started:Date.now(),checks:{},ex};saveActive();render();openActive();
}
const elapsedSec=()=>active?Math.round((Date.now()-active.started)/1000):0;
function activeBanner(){return active&&!viewer?`<button class="banner live-banner" data-act="active" style="width:100%;text-align:left;color:var(--ink)"><b><span class="rec-dot"></span>Live: ${esc(active.plan.title)}</b><span style="display:block;margin-top:2px">${fmtDur(elapsedSec())} so far. Tap to resume.</span></button>`:"";}
function openActive(){
  if(!active)return;
  const pl=active.plan;
  let ci=0;const tmrItems={};
  const body=pl.blocks.map((b,bi)=>`<h4 style="margin:16px 0 6px">${esc(b.n)}</h4>`+b.items.map((it,ii)=>{
    if(it.ex){const e=active.ex.find(x=>x.name===it.ex);const k=active.ex.indexOf(e);
      return `<div class="ex" style="--c:${col(pl.type)}"><div class="ph" style="display:flex;justify-content:space-between;align-items:baseline"><b>${esc(e.name)}</b><span class="hint" style="margin:0">rest ${e.rest>=120?e.rest/60+" min":e.rest+" s"}</span></div>
        <div class="r" style="grid-template-columns:1fr 1fr"><div><small>Reps</small><input data-ar="${k}" type="number" inputmode="numeric" value="${e.reps}"></div><div><small>Weight (${wU()})</small><input data-aw="${k}" type="number" inputmode="decimal" step="any" value="${e.w!=null?round(toDispWt(e.w),1):""}" placeholder="—"></div></div>
        <div class="tchips" style="margin-top:8px">${Array.from({length:e.sets},(_,si)=>`<button class="tchip" data-as="${k}:${si}" aria-pressed="${si<e.done}">Set ${si+1}${si<e.done?" ✓":""}</button>`).join("")}${TIMED_RE.test(e.name)?`<button class="tchip thold" data-thold="${k}">${icon("timer")} Hold timer</button>`:""}</div></div>`;}
    const key=bi+"-"+ii;
    if(it.hang||it.timer){const tc=it.timer||hangCfg(it.hang);tmrItems[key]=tc;return `<div class="ex tcard" style="--c:${it.hang?"var(--hang)":"var(--core)"}"><b style="display:block;margin-bottom:8px;white-space:normal">${esc(it.text)}</b><button class="btn go tstart" data-tmr="${key}">${icon("timer")} Start timer <span>${fmtClock(tmTotal(tc))}</span></button><button class="tchip" data-ac="${key}" aria-pressed="${!!active.checks[key]}" style="margin-top:8px">${active.checks[key]?"Done ✓":"Mark done"}</button></div>`;}
    return `<button class="trow" data-ac="${key}" style="width:100%;text-align:left"><span class="mdot" style="background:${active.checks[key]?col(pl.type):"var(--chip)"};color:${active.checks[key]?"#fff":"var(--muted)"}">${active.checks[key]?"✓":""}</span><div class="tx"><b style="white-space:normal;font-weight:${active.checks[key]?400:600};${active.checks[key]?"text-decoration:line-through;color:var(--muted)":""}">${esc(it.text)}</b></div></button>`;
  }).join("")).join("");
  openSheet(`<div style="--c:${col(pl.type)}"><div class="row2" style="display:flex;justify-content:space-between;align-items:center"><h3><span class="rec-dot"></span>${esc(pl.title)}</h3><span class="rpev" id="act-el" style="color:var(--red)">${fmtClock(elapsedSec())}</span></div>
    ${pl.targetId&&tgtById(pl.targetId)?`<div class="banner live-banner" style="margin:6px 0 10px"><b>🎯 ${esc(targetTitle(tgtById(pl.targetId)))}</b></div>`:""}
    <p class="sub">Target effort ${pl.rpe}/10, about ${pl.est} minutes. Tap items as you go.</p>
    ${pl.type==="lift"?`<div class="timer"><b id="rt">${restLeft()?fmtClock(restLeft()):"Rest"}</b>${[60,90,120,180].map(t=>`<button data-rest="${t}">${t<120?t+"s":(t/60)+" min"}</button>`).join("")}<button data-rest="0">Stop</button></div><p class="hint" style="margin-top:-4px">Ticking off a set starts its rest timer automatically.</p>`:""}
    ${body}
    <div class="row"><button class="btn" id="act-min">Minimize</button><button class="btn primary" id="act-fin">Finish and log</button></div>
    <div class="row" style="margin-top:10px"><button class="btn danger" id="act-del">Discard workout</button></div></div>`);
  clearInterval(actIv);actIv=setInterval(()=>{const el=$("act-el");if(!el||!active){clearInterval(actIv);return;}el.textContent=fmtClock(elapsedSec());},1000);
  const sh=$("sheet");
  sh.querySelectorAll("[data-rest]").forEach(b=>b.onclick=()=>startRest(+b.dataset.rest));
  sh.querySelectorAll("[data-tmr]").forEach(b=>b.onclick=()=>{const k=b.dataset.tmr,c=tmrItems[k];if(!c)return;startTimer(c,{log:false,onClose:sm=>{if(sm.complete||sm.work>0){active.checks[k]=true;saveActive();}if(active)openActive();}});});
  sh.querySelectorAll("[data-thold]").forEach(b=>b.onclick=()=>{const k=+b.dataset.thold,e=active.ex[k];const it=pl.blocks.flatMap(x=>x.items).find(x=>x.ex===e.name);const m=it&&it.note&&it.note.match(/(\d+)\s*seconds/);
    startTimer({key:"holds",name:e.name,kind:"core",prep:5,work:m?+m[1]:45,rest:Math.min(90,e.rest||45),reps:Math.max(1,e.sets-e.done),sets:1,setRest:0,names:[]},{log:false,onClose:sm=>{if(sm.complete){e.done=e.sets;saveActive();}if(active)openActive();}});});
  sh.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{const k=b.dataset.ac;active.checks[k]=!active.checks[k];saveActive();const top=sh.scrollTop;openActive();$("sheet").scrollTop=top;});
  sh.querySelectorAll("[data-as]").forEach(b=>b.onclick=()=>{const [k,si]=b.dataset.as.split(":").map(Number);const e=active.ex[k];const was=si<e.done;e.done=was?si:si+1;saveActive();if(!was&&e.done<e.sets)startRest(e.rest);const top=sh.scrollTop;openActive();$("sheet").scrollTop=top;});
  sh.querySelectorAll("[data-ar]").forEach(i=>i.onchange=()=>{active.ex[+i.dataset.ar].reps=num(i.value)||active.ex[+i.dataset.ar].reps;saveActive();});
  sh.querySelectorAll("[data-aw]").forEach(i=>i.onchange=()=>{const v=num(i.value);active.ex[+i.dataset.aw].w=v!=null?fromDispWt(v):null;saveActive();});
  $("act-min").onclick=()=>{closeSheet();render();};
  $("act-del").onclick=()=>{const b=$("act-del");if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Tap to confirm";return;}active=null;saveActive();closeSheet();render();toast("Workout discarded");};
  $("act-fin").onclick=()=>{
    const st=new Date(active.started),pl2=active.plan;
    const preset={fromPlan:true,type:pl2.type,title:pl2.title,date:keyOf(st),time:pad(st.getHours())+":"+pad(st.getMinutes()),dur:Math.max(60,elapsedSec()),rpe:pl2.rpe,notes:`Planned: ${pl2.title}.`};
    if(pl2.type==="lift")preset.ex=active.ex.filter(e=>e.done>0).map(e=>({name:e.name,sets:e.done,reps:e.reps,w:e.w,mus:e.mus}));
    if(pl2.type==="climb"){preset.gs=pl2.gs;preset.placeId=pl2.placeId;}
    else if(pl2.placeId)preset.placeId=pl2.placeId;
    if(pl2.targetId)preset.targetId=pl2.targetId;
    if(pl2.type==="hang"&&pl2.hangs)preset.hangs=JSON.parse(JSON.stringify(pl2.hangs));
    active=null;saveActive();openForm(null,preset);toast("Add any final details, then save");
  };
}

function challengesHTML(c){
  const L=live().sort(chrono),today=keyOf(new Date());
  let h="";
  for(const kind of ["week","month"]){
    const key=periodOf(kind,today),[st,en]=periodRange(kind,key),chs=challengesFor(kind,key,L,c.chCache);
    const PL=L.filter(s=>s.date>=st&&s.date<en),left=Math.ceil((parseDate(en)-Date.now())/864e5);
    const doneN=chs.filter(ch=>chalValue(ch,PL)>=ch.target).length;
    h+=`<div class="ins" style="margin-top:12px"><div class="row2"><div><h3>${kind==="week"?"This week's":"This month's"} challenges</h3><div class="xpinfo">Resets in ${left} day${left===1?"":"s"}. ${doneN} of 3 done.</div></div><span class="xpchip" style="background:${tierOf(CH_XP[kind])[2]}">${tierOf(CH_XP[kind])[1]}</span></div>
      ${chs.map(ch=>{const v=chalValue(ch,PL),ok=v>=ch.target;return `<div class="trow"><span class="mdot" style="background:${ok?tierBg(ch.xp):"var(--chip)"};color:${ok?"#fff":"var(--muted)"}">${ok?"✓":kind==="week"?"W":"M"}</span><div class="tx"><b style="white-space:normal;${ok?"text-decoration:line-through;color:var(--muted)":""}">${esc(ch.label)}</b><div class="mini" style="margin:6px 0 0"><i style="width:${Math.min(100,v/ch.target*100)}%;background:${ok?tierOf(ch.xp)[2]:"var(--muted)"}"></i></div></div><span class="tv" style="font-size:.95rem">${esc(fmtChal(ch,v))}</span></div>`;}).join("")}
      <p class="hint">+${CH_XP[kind]} XP each. Finish all three for a ${tierOf(CH_BONUS[kind])[1]} "Perfect ${kind}" bonus of +${CH_BONUS[kind]} XP${kind==="month"?" and a monthly badge":""}. Challenges are picked fresh each ${kind} and scale with your recent training.</p></div>`;
  }
  return h+`<p class="hint">${c.ctx.chalDone} challenge${c.ctx.chalDone===1?"":"s"} completed so far, including ${c.ctx.perfWeeks} perfect week${c.ctx.perfWeeks===1?"":"s"} and ${c.ctx.perfMonths} perfect month${c.ctx.perfMonths===1?"":"s"}.</p>`;
}

/* ---------- pain log ---------- */
const PAIN_AREAS=["Fingers","Wrists","Elbows","Shoulders","Neck","Upper back","Lower back","Hips","Knees","Hamstrings","Calves","Shins","Ankles","Feet"];
const PAIN_TO_CAUT={Fingers:"Fingers",Wrists:"Fingers",Elbows:"Elbows",Shoulders:"Shoulders",Neck:"Shoulders","Lower back":"Lower back",Hips:"Lower back",Knees:"Knees",Ankles:"Ankles",Feet:"Ankles",Shins:"Ankles",Calves:"Ankles",Hamstrings:"Knees"};
const painList=()=>settings.pain||[];
const activePain=()=>painList().filter(x=>!x.healed);
function cautionsNow(){const c=new Set(LT().cautions||[]);for(const p of activePain())if(PAIN_TO_CAUT[p.area])c.add(PAIN_TO_CAUT[p.area]);return [...c];}
function painCard(){
  const A=activePain();
  let h=`<div class="ins"><div class="row2"><h3>Aches and pains</h3><button class="chip" data-act="pain">Log</button></div>`;
  if(!A.length)return h+`<p class="hint">Nothing logged. If something hurts, log it and your workouts will avoid loading that area until you mark it healed.</p></div>`;
  const recur=PAIN_AREAS.filter(a=>painList().filter(p=>p.area===a&&parseDate(p.date)>addDays(new Date(),-120)).length>=2);
  return h+A.map(p=>{const last=(p.updates&&p.updates.length?p.updates[p.updates.length-1]:p);return `<button class="trow" data-pain="${p.id}"><span class="mdot" style="background:${last.level>=7?"#D13B4F":last.level>=4?"#E2A400":"var(--ride)"}">${last.level}</span><div class="tx"><b>${esc(p.area)}</b><span>Since ${fmtDate(p.date,{month:"short",day:"numeric"})}${p.note?", "+esc(p.note):""}</span></div></button>`;}).join("")
    +(recur.length?`<p class="hint">Recurring: ${recur.join(", ").toLowerCase()}. If it keeps coming back, it's worth seeing a physio.</p>`:"")+`<p class="hint">Workouts are avoiding moves that load ${[...new Set(A.map(p=>p.area))].join(", ").toLowerCase()}.</p></div>`;
}
function openPain(p){
  const isNew=!p,d=p?JSON.parse(JSON.stringify(p)):{id:uid(),area:"",level:3,note:"",date:keyOf(new Date()),healed:null,updates:[]};
  const cur=isNew?d.level:(d.updates.length?d.updates[d.updates.length-1].level:d.level);let lvl=cur;
  openSheet(`<h3>${isNew?"Log an ache or pain":esc(d.area)}</h3><p class="sub">${isNew?"Where does it hurt, and how much?":"Started "+fmtDate(d.date)}</p>
    ${isNew?`<label>Area</label><div class="tchips" id="pn-a" style="--c:#D13B4F">${PAIN_AREAS.map(a=>`<button class="tchip" data-v="${a}">${a}</button>`).join("")}</div>`:""}
    <label for="pn-l">${isNew?"Pain level":"How is it today?"}</label><div style="display:flex;justify-content:space-between"><span class="rpev" id="pn-v">${lvl}/10</span></div><input type="range" id="pn-l" min="1" max="10" value="${lvl}" style="--c:#D13B4F">
    <div class="rpe"><span>Barely there</span><span>Annoying</span><span>Painful</span><span>Severe</span></div>
    ${isNew?`<label for="pn-n">Note (optional)</label><input id="pn-n" type="text" maxlength="80" placeholder="e.g. sharp on crimps, sore after long runs">`:`${d.updates.length?`<p class="hint">History: ${[{date:d.date,level:d.level},...d.updates].map(u=>`${fmtDate(u.date,{month:"short",day:"numeric"})} ${u.level}`).join(", ")}</p>`:""}`}
    <p class="hint">Sharp pain, swelling, numbness, or pain that keeps getting worse should be checked by a doctor or physio.</p>
    <div class="err" id="pn-e"></div>

/* ================= events & training plans ================= */
const EVENT_TYPES={run:["Running race","🏁","run"],ride:["Cycling event","🚴","ride"],climb:["Climbing comp or trip","🧗","climb"],hike:["Hike or trek","🏔️","hike"],lift:["Lifting meet or test","🏋️","lift"],other:["Other event","⭐",null]};

function planView(ev){

  for(const x of P){x.status=x.race?(x.date<today?"past":"event"):doneOn(x.date,x.type)?"done":x.date<today?"missed":"todo";}
  const wk=weekKey(today),end=keyOf(addDays(parseDate(wk),7));
  for(const m of P.filter(x=>x.status==="missed"&&x.key&&x.date>=wk&&!x.race)){
    const slot=P.find(x=>x.date>=today&&x.date<end&&x.status==="todo"&&!x.key&&!x.race);

const SPEEDS=[[0.05,"a garden snail"],[0.27,"a sloth"],[0.4,"a giant tortoise"],[3.5,"a carabao plodding through a rice field"],[5,"a typical person walking"],[9,"a jeepney in rush-hour EDSA traffic"],[13,"a house mouse at full sprint"],[14,"a chicken running away from you"],[20,"a world-class marathoner's race pace"],[25,"an elephant charging"],[32,"a kangaroo hopping"],[40,"a tricycle on an open road"],[48,"a house cat at full speed"],[56,"a galloping horse"],[70,"a racing greyhound"],[100,"a cheetah"]];

function pickRel(list,v){let lo=null,hi=null;for(const x of list){if(x[0]<=v)lo=x;else{hi=x;break;}}return {lo,hi};}

function funFacts(s){

  const kmh=s.dist&&s.dur&&s.type!=="lift"&&s.type!=="climb"&&s.type!=="hang"?s.dist/(s.dur/3600):null;
  if(kmh){const {lo,hi}=pickRel(SPEEDS,kmh);
    if(lo&&hi)f.push(`At ${round(kmh,1)} km/h on average, you were faster than ${lo[1]} (${lo[0]} km/h) but slower than ${hi[1]} (${hi[0]} km/h).`);
    else if(lo)f.push(`At ${round(kmh,1)} km/h, you out-paced ${lo[1]}. Impressive.`);
    const snail=(s.dur/3600)*0.05*1000;f.push(`A garden snail would have covered about ${nice(snail)} m in the time you took. You did ${nice(s.dist*1000)} m.`);}

  if(s.steps)f.push(`${Math.round(s.steps).toLocaleString()} steps is ${Math.round(s.steps/10000*100)}% of the classic 10,000-steps-a-day goal.`);

/* ---------- backfill new best-effort distances from saved routes ---------- */
function effortsFromTrack(tr){
  const n=tr.length,cum=[0];for(let i=1;i<n;i++)cum.push(cum[i-1]+hav(tr[i-1][0],tr[i-1][1],tr[i][0],tr[i][1]));
  const t=tr.map(p=>p[3]),out={};
  for(const [D] of EFFORTS.run){if(cum[n-1]<D)continue;let best=null,j=0;
    for(let i=0;i<n;i++){if(j<i)j=i;while(j<n&&cum[j]-cum[i]<D)j++;if(j>=n)break;const seg=cum[j]-cum[j-1],need=D-(cum[j-1]-cum[i]);const tt=t[j-1]+(seg>0?need/seg:0)*(t[j]-t[j-1])-t[i];if(tt>0&&(best==null||tt<best))best=tt;}
    if(best)out[String(D)]=Math.round(best);}
  return out;
}
function backfillEfforts(){

}

const targets=()=>settings.targets||[];

function exMatch(a,b){a=(a||"").trim().toLowerCase();b=(b||"").trim().toLowerCase();return a===b||(a.length>3&&b.length>3&&(a.includes(b)||b.includes(a)));}

    if(v==null&&s.dist&&s.dur){const m=s.dist*1000;if(m>=t.D*0.98&&m<=t.D*1.06)v=Math.round(s.dur*t.D/m);}
    return {met:v!=null&&v<=t.time+0.5,val:v};}
  if(t.type==="lift"){const L=(s.ex||[]).filter(e=>exMatch(e.name,t.ex)&&e.w!=null&&e.reps);if(!L.length)return {met:false,val:null};
    const met=L.some(e=>e.w>=t.w-0.01&&e.reps>=t.reps);const b=L.slice().sort((a,c)=>(e1rm(c)||0)-(e1rm(a)||0))[0];return {met,val:{w:b.w,reps:b.reps}};}

    const met=L.some(h=>(h.add||0)>=t.add-0.01&&h.hang>=t.hang);const b=L.slice().sort((a,c)=>(c.add||0)-(a.add||0))[0];return {met,val:{add:b.add||0,hang:b.hang}};}

}
function targetValText(t,v){

/* the mark itself: one drawing per grading style, used everywhere a grade is shown */
function gradeKind(label){const l=String(label||"");let m;
  if((m=l.match(/^(\d+)\s*bars?$/i)))return {k:"bar",n:+m[1]};
  if((m=l.match(/^(\d+)\s*pies?$/i)))return {k:"pie",n:+m[1],of:6};
  if(/\bchip$/i.test(l))return {k:"chip"};
  return {k:"dot"};}
/* Boulder World "bars": a disc cut into 8 separate slices, grade = slices filled */
function barSlices(n){const out=[],R=10.2,r=2.4,g=.13;for(let i=0;i<8;i++){const a0=i/8*Math.PI*2+g/2,a1=(i+1)/8*Math.PI*2-g/2,P=(rad,a)=>[12+rad*Math.sin(a),12-rad*Math.cos(a)];
  const [x0,y0]=P(R,a0),[x1,y1]=P(R,a1),[x2,y2]=P(r,a1),[x3,y3]=P(r,a0);out.push({on:i<n,d:`M${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}L${x2.toFixed(2)} ${y2.toFixed(2)}A${r} ${r} 0 0 0 ${x3.toFixed(2)} ${y3.toFixed(2)}Z`});}return out;}
function gm(label,color,cls){
  const c=color||"#8E8E93",g=gradeKind(label),dark=/^#(1|2)/.test(c)&&c.length===7&&parseInt(c.slice(1,3),16)<0x40;
  const o=`<svg class="gm${cls?" "+cls:""}" viewBox="0 0 24 24" aria-hidden="true">`;
  if(g.k==="bar")return o+`<circle cx="12" cy="12" r="11.6" fill="#1C1C1E"/>${barSlices(Math.min(8,g.n)).map(w=>`<path d="${w.d}" fill="${c}"${w.on?"":` fill-opacity=".22"`}/>`).join("")}</svg>`;
  if(g.k==="pie"){const of=g.of||6,n=Math.min(of,g.n),a=n/of*Math.PI*2,x=12+9*Math.sin(a),y=12-9*Math.cos(a);
    const wedge=n>=of?`<circle cx="12" cy="12" r="9" fill="${c}"/>`:`<path d="M12 12L12 3A9 9 0 ${a>Math.PI?1:0} 1 ${x.toFixed(2)} ${y.toFixed(2)}Z" fill="${c}"/>`;
    return o+`<circle cx="12" cy="12" r="10.6" fill="#1C1C1E"/><circle cx="12" cy="12" r="9" fill="none" stroke="${c}" stroke-opacity=".35" stroke-width="1.2"/>${wedge}${[...Array(of)].map((_,i)=>{const t=i/of*Math.PI*2;return `<line x1="12" y1="12" x2="${(12+9*Math.sin(t)).toFixed(2)}" y2="${(12-9*Math.cos(t)).toFixed(2)}" stroke="#1C1C1E" stroke-width=".9"/>`;}).join("")}</svg>`;}
  if(g.k==="chip")return o+`<circle cx="12" cy="12" r="11" fill="${c}"/><circle cx="12" cy="12" r="8.4" fill="none" stroke="#fff" stroke-width="2.4" stroke-dasharray="3.3 3.3" stroke-opacity=".9"/><circle cx="12" cy="12" r="5.2" fill="${c}" stroke="#fff" stroke-opacity=".55" stroke-width=".8"/></svg>`;
  return o+`<circle cx="12" cy="12" r="10.5" fill="${c}"${dark?` stroke="#5A5A60" stroke-width="1.2"`:""}/><circle cx="9" cy="8.5" r="3.2" fill="#fff" fill-opacity=".18"/></svg>`;
}
/* the same marks on canvas, for share images */
function drawGM(x,label,color,cx,cy,r){
  const c=color||"#8E8E93",g=gradeKind(label),s=r/12;x.save();x.translate(cx-12*s,cy-12*s);x.scale(s,s);

  x.restore();
}

        <p class="hint" style="margin-top:10px">${esc(TIMER_PRESETS[c.key]?TIMER_PRESETS[c.key].desc:"")}</p>`}
      <div class="tfields">${fields.map(([f,l,stp])=>{const v=c[f]||0,isT=f!=="reps"&&f!=="sets";return `<div class="tfield"><span>${l}</span><div class="stepper"><button type="button" data-tf="${f}:-${stp}" aria-label="Less ${l.toLowerCase()}"${v<=(f==="sets"||f==="reps"?1:0)?" disabled":""}>−</button><output><b>${isT?fmtS(v):v}</b></output><button type="button" data-tf="${f}:${stp}" aria-label="More ${l.toLowerCase()}">+</button></div></div>`;}).join("")}</div>
      ${c.kind==="hang"?`<div class="tfields"><div class="tfield"><span>Edge</span><div class="stepper"><button type="button" data-tf="edge:-1">−</button><output><b>${c.edge}mm</b></output><button type="button" data-tf="edge:1">+</button></div></div><div class="tfield"><span>Added weight</span><div class="stepper"><button type="button" data-tf="add:-2.5">−</button><output><b>${fmtAdd(c.add||0)}</b></output><button type="button" data-tf="add:2.5">+</button></div></div></div>`:""}
      ${c.kind!=="hang"&&!c.blocks?`<label for="tp-names">Exercises, one per line <span class="hint" style="margin:0;font-weight:400">(read out at each change)</span></label><textarea id="tp-names" rows="4" placeholder="Leave empty for plain intervals">${esc((c.names||[]).join("\n"))}</textarea>`:""}
      <div class="tsum"><b id="tp-total">${fmtClock(tmTotal(c))}</b><span>${c.blocks?`${c.blocks.length} blocks of ${tmReps(c)}, ${fmtS(c.work)} on / ${fmtS(c.rest)} off`:`${tmReps(c)} ${hasNames?"moves":"reps"} × ${c.sets} ${c.prog?"round":"set"}${c.sets===1?"":"s"}, ${fmtS(c.work)} on / ${fmtS(c.rest)} off`}</span></div>
      <div class="row"><button class="btn" id="tp-c">Cancel</button><button class="btn go" id="tp-go">${icon("play")} Start</button></div>`;
    openSheet(`<h3>Interval timer</h3><p class="sub">Beeps on every change, reads each move out loud, and keeps the screen awake.</p>
      <div class="seg" id="tp-tab" style="margin-bottom:14px"><button data-v="timers" aria-pressed="${tab==="timers"}">Timers</button><button data-v="programs" aria-pressed="${tab==="programs"}">Programs</button></div>
      ${tab==="programs"&&listing?`<p class="hint" style="margin-top:0">Ready-made sessions that run on the timer. Pick one, adjust the times if you like, and start.</p>${progList()}<div class="row"><button class="btn" id="tp-c">Cancel</button></div>`:editor}`);
    const rdN=()=>{const t=$("tp-names");if(t){c.names=t.value.split("\n").map(x=>x.trim()).filter(Boolean);}};
    document.querySelectorAll("#tp-tab [data-v]").forEach(b=>b.onclick=()=>{rdN();tab=b.dataset.v;if(tab==="programs"){listing=true;}else{listing=false;if(c.prog)c={...timerCfg("repeaters")};}draw();});
    document.querySelectorAll("[data-prog]").forEach(b=>b.onclick=()=>{pick(TIMER_PROGRAMS.find(p=>p.id===b.dataset.prog));listing=false;haptic("light");draw();});
    if($("tp-back"))$("tp-back").onclick=()=>{listing=true;draw();};
    document.querySelectorAll("#tp-pre [data-k]").forEach(b=>b.onclick=()=>{c={...timerCfg(b.dataset.k)};draw();});
    document.querySelectorAll("[data-tf]").forEach(b=>b.onclick=()=>{rdN();const [f,dl]=b.dataset.tf.split(":");const st=+dl;let v=(c[f]||0)+st;
      if((f==="work"||f==="rest")&&Math.abs(st)===5&&(c[f]<15||(st<0&&c[f]<=15)))v=(c[f]||0)+(st>0?1:-1);
      const min=f==="sets"||f==="reps"||f==="work"?1:f==="edge"?4:f==="add"?-60:0;c[f]=Math.max(min,Math.round(v*10)/10);haptic("light");const t=$("sheet").scrollTop;draw();$("sheet").scrollTop=t;});
    if($("tp-names"))$("tp-names").onchange=()=>{rdN();const t=$("sheet").scrollTop;draw();$("sheet").scrollTop=t;};
    $("tp-c").onclick=closeSheet;
    if($("tp-go"))$("tp-go").onclick=()=>{rdN();if(c.prog){try{const all=JSON.parse(localStorage.getItem(TM_KEY)||"{}");all[c.key]={work:c.work,rest:c.rest,setRest:c.setRest,prep:c.prep,sets:c.blocks?undefined:c.sets};localStorage.setItem(TM_KEY,JSON.stringify(all));}catch(e){}}else saveTimerCfg(c);closeSheet();startTimer(c,{});};
  };
  draw();
}
function hangCfg(h,name){const R=Math.max(1,h.reps||1);return {key:"repeaters",name:name||(R>1?"Hangboard repeaters":"Max hangs"),kind:"hang",prep:10,work:h.hang||7,rest:R>1?(h.rest||3):0,reps:R,sets:h.sets||4,setRest:R>1?180:(h.rest||180),grip:h.grip,edge:h.edge,add:h.add||0,names:[]};}

let tt;function toast(m,act){const t=$("toast");t.textContent=m;t.classList.toggle("act",!!act);
  if(act){const b=document.createElement("button");b.type="button";b.textContent=act.label;b.onclick=()=>{clearTimeout(tt);t.classList.remove("show","act");act.fn();};t.append(b);}
  t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show","act"),act?5200:2600)}

symObs.observe(document.body,{childList:true,subtree:true,characterData:true});symbolize(document.body);
loadLocal();loadActive();seedGyms();render();
let onboardChecked=false;
function maybePrompt(){
  if(onboardChecked||viewer)return;onboardChecked=true;
  if($("scrim").classList.contains("open"))return;
  const lt=LT();
  if(!lt.onboarded){openWizard("first");return;}
  if(lt.lastCheck&&Date.now()-lt.lastCheck>56*864e5){lt.lastCheck=Date.now();settings.updatedAt=Date.now();saveLocal();pushSettings();openWizard("checkin");return;}
  checkLongGoals();checkRanks();
}
initRemote().finally(()=>{if(seedGyms())render();backfillEfforts();setTimeout(maybePrompt,400);});
setTimeout(maybePrompt,4000);
})();
</script>
